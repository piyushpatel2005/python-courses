<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 340" role="img" aria-labelledby="title desc"><title id="title">Transpose an Observation Grid</title><desc id="desc">Two by three night-by-sensor grid turns into a three by two sensor-by-night grid.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#315f82" stroke-width="2"/></marker></defs><rect width="830" height="340" rx="22" fill="#fcfbf7"/><g font-family="Trebuchet MS, sans-serif" fill="#24344a"><text x="415" y="42" text-anchor="middle" font-size="23" fill="#24344a">Transpose swaps rows and columns</text><text x="207" y="88" text-anchor="middle" font-size="18" fill="#24344a">Nights × sensors: (2, 3)</text><text x="638" y="88" text-anchor="middle" font-size="18" fill="#24344a">Sensors × nights: (3, 2)</text><rect x="104" y="128" width="58" height="46" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="133.0" y="158.0" text-anchor="middle" font-size="20" fill="#24344a">2</text><rect x="166" y="128" width="58" height="46" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="195.0" y="158.0" text-anchor="middle" font-size="20" fill="#24344a">4</text><rect x="228" y="128" width="58" height="46" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="257.0" y="158.0" text-anchor="middle" font-size="20" fill="#24344a">6</text><rect x="104" y="178" width="58" height="46" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="133.0" y="208.0" text-anchor="middle" font-size="20" fill="#24344a">1</text><rect x="166" y="178" width="58" height="46" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="195.0" y="208.0" text-anchor="middle" font-size="20" fill="#24344a">3</text><rect x="228" y="178" width="58" height="46" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="257.0" y="208.0" text-anchor="middle" font-size="20" fill="#24344a">5</text><r