<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 390" role="img" aria-labelledby="title desc"><title id="title">Matrix Dot Product</title><desc id="desc">A two by three grid times a three by two calibration matrix yields a two by two grid; the first output cell is four.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#315f82" stroke-width="2"/></marker></defs><rect width="950" height="390" rx="22" fill="#fcfbf7"/><g font-family="Trebuchet MS, sans-serif" fill="#24344a"><text x="475" y="37" text-anchor="middle" font-size="23" fill="#24344a">Matrix product: inner dimensions match</text><text x="204" y="83" text-anchor="middle" font-size="18" fill="#24344a">Readings (2 × 3)</text><text x="493" y="83" text-anchor="middle" font-size="18" fill="#24344a">Calibration (3 × 2)</text><text x="783" y="83" text-anchor="middle" font-size="18" fill="#24344a">Output (2 × 2)</text><rect x="102" y="114" width="56" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="130.0" y="143.0" text-anchor="middle" font-size="20" fill="#24344a">1</text><rect x="162" y="114" width="56" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="190.0" y="143.0" text-anchor="middle" font-size="20" fill="#24344a">2</text><rect x="222" y="114" width="56" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="250.0" y="143.0" text-anchor="middle" font-size="20" fill="#24344a">3</text><rect x="102" y="162" width="56" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="130.0" y="191.0" text-anchor="middle" font-size="20" fill="#24344a">4</text><rect x="162" y="162" width="56" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="190.0" y="191.0" text-anchor="middle" font-size="20" fill="#24344a">5</text><rect x="222" y="162" width="56" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="250.0" y="191.0" text-anchor="middle" font-size="20" fill="#24344a">6</text><rect x="410" y="102" width="56" height="44" rx="12" fill="#f8ebd5" stroke="#315f82" stroke-width="2"/><text x="438.0" y="131.0" text-anchor="middle" font-size="20" fill="#24344a">1</text><rect x="470" y="102" width="56" height="44" rx="12" fill="#f8ebd5" stroke="#315f82" stroke-width="2"/><text x="498.0" y="131.0" text-anchor="middle" font-size="20" fill="#24344a">0</text><rect x="410" y="150" width="56" height="44" rx="12" fill="#f8ebd5" stroke="#315f82" stroke-width="2"/><text x="438.0" y="179.0" text-anchor="middle" font-size="20" fill="#24344a">0</text><rect x="470" y="150" width="56" height="44" rx="12" fill="#f8ebd5" stroke="#315f82" stroke-width="2"/><text x="498.0" y="179.0" text-anchor="middle" font-size="20" fill="#24344a">1</text><rect x="410" y="198" width="56" height="44" rx="12" fill="#f8ebd5" stroke="#315f82" stroke-width="2"/><text x="438.0" y="227.0" text-anchor="middle" font-size="20" fill="#24344a">1</text><rect x="470" y="198" width="56" height="44" rx="12" fill="#f8ebd5" stroke="#315f82" stroke-width="2"/><text x="498.0" y="227.0" text-anchor="middle" font-size="20" fill="#24344a">1</text><rect x="701" y="127" width="56" height="44" rx="12" fill="#dff3e3" stroke="#315f82" stroke-width="2"/><text x="729.0" y="156.0" text-anchor="middle" font-size="20" fill="#24344a">4</text><rect x="761" y="127" width="56" height="44" rx="12" fill="#dff3e3" stroke="#315f82" stroke-width="2"/><text x="789.0" y="156.0" text-anchor="middle" font-size="20" fill="#24344a">5</text><rect x="701" y="175" width="56" height="44" rx="12" fill="#dff3e3" stroke="#315f82" stroke-width="2"/><text x="729.0" y="204.0" text-anchor="middle" font-size="20" fill="#24344a">10</text><rect x="761" y="175" width="56" height="44" rx="12" fill="#dff3e3" stroke="#315f82" stroke-width="2"/><text x="789.0" y="204.0" text-anchor="middle" font-size="20" fill="#24344a">11</text><text x="352" y="181" text-anchor="middle" font-size="32" fill="#24344a">@</text><text x="644" y="181" text-anchor="middle" font-size="32" fill="#24344a">=</text><text x="475" y="320" text-anchor="middle" font-size="18" fill="#24344a">First output cell: (1 × 1) + (2 × 0) + (3 × 1) = 4</text><text x="475" y="354" text-anchor="middle" font-size="17" fill="#24344a">Unlike *, @ combines each input row with each calibration column.</text></g></svg>