<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270" role="img" aria-labelledby="title desc"><title id="title">Stepped NumPy slice</title><desc id="desc">Six indexed array cells. Slice 1 to 6 step 2 selects indices 1, 3 and 5, while the stop at 6 is excluded.</desc><rect width="820" height="270" fill="#fffdf6"/><text x="35" y="43" font-family="Trebuchet MS,sans-serif" font-size="25" font-weight="bold" fill="#12233a">A stepped slice picks spaced cells</text><text x="35" y="83" font-family="monospace" font-size="19" fill="#17324a">pulses[1:6:2]</text><g font-family="Trebuchet MS,sans-serif" text-anchor="middle" fill="#12233a"><text x="105" y="132" font-size="16">0</text><text x="225" y="132" font-size="16">1</text><text x="345" y="132" font-size="16">2</text><text x="465" y="132" font-size="16">3</text><text x="585" y="132" font-size="16">4</text><text x="705" y="132" font-size="16">5</text></g><g stroke="#203e5a" stroke-width="3"><rect x="53" y="148" width="104" height="62" rx="7" fill="#f1f4f7" transform="rotate(-1 105 179)"/><rect x="173" y="148" width="104" height="62" rx="7" fill="#bce8db" transform="rotate(1 225 179)"/><rect x="293" y="148" width="104" height="62" rx="7" fill="#f1f4f7" transform="rotate(-1 345 179)"/><rect x="413" y="148" width="104" height="62" rx="7" fill="#bce8db" transform="rotate(1 465 179)"/><rect x="533" y="148" width="104" height="62" rx="7" fill="#f1f4f7" transform="rotate(-1 585 179)"/><rect x="653" y="148" width="104" height="62" rx="7" fill="#bce8db" transform="rotate(1 705 179)"/></g><g font-family="monospace" font-size="22" text-anchor="middle" fill="#102b38"><text x="105" y="187">10</text><text x="225" y="187">11</text><text x="345" y="187">12</text><text x="465" y="187">13</text><text x="585" y="187">14</text><text x="705" y="187">15</text></g><text x="53" y="245" font-family="Trebuchet MS,sans-serif" font-size="17" fill="#17324a">Highlighted cells: indices 1, 3, 5. Stop 6 is not included.</text></svg>
