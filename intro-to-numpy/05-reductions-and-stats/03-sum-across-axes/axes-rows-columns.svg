<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 425" role="img" aria-labelledby="title desc"><title id="title">Axes Reduce a Sensor Grid</title><desc id="desc">A two by three grid and separate axis-zero and axis-one totals.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#315f82" stroke-width="2"/></marker></defs><rect width="700" height="425" rx="22" fill="#fcfbf7"/><g font-family="Trebuchet MS, sans-serif" fill="#24344a"><text x="360" y="35" text-anchor="middle" font-size="24" fill="#24344a">Which axis disappears?</text><text x="180" y="82" text-anchor="middle" font-size="18" fill="#24344a">Input: 2 nights × 3 sensors</text><rect x="75" y="110" width="65" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="107.5" y="139.0" text-anchor="middle" font-size="20" fill="#24344a">2</text><rect x="144" y="110" width="65" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="176.5" y="139.0" text-anchor="middle" font-size="20" fill="#24344a">5</text><rect x="213" y="110" width="65" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="245.5" y="139.0" text-anchor="middle" font-size="20" fill="#24344a">3</text><rect x="75" y="158" width="65" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="107.5" y="187.0" text-anchor="middle" font-size="20" fill="#24344a">4</text><rect x="144" y="158" width="65" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="176.5" y="187.0" text-anchor="middle" font-size="20" fill="#24344a">1</text><rect x="213" y="158" width="65" height="44" rx="12" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/><text x="245.5" y="187.0" text-anchor="middle" font-size="20" fill="#24344a">6</text><text x="500" y="80" text-anchor="middle" font-size="18" fill="#24344a">axis=0: add down nights</text><path d="M497 89 L497 112" stroke="#315f82" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="410" y="115" width="175" height="60" rx="12" fill="#dff3e3" stroke="#315f82" stroke-width="2"/><text x="497" y="153" text-anchor="middle" font-size="19" fill="#24344a">[6, 6, 9]</text><text x="500" y="210" text-anchor="middle" font-size="16" fill="#24344a">3 sensor totals remain</text><text x="500" y="257" text-anchor="middle" font-size="18" fill="#24344a">axis=1: add across sensors</text><path d="M497 268 L497 290" stroke="#315f82" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="410" y="294" width="175" height="60" rx="12" fill="#f8ebd5" stroke="#315f82" stroke-width="2"/><text x="497" y="333" text-anchor="middle" font-size="19" fill="#24344a">[10, 11]</text><text x="500" y="390" text-anchor="middle" font-size="16" fill="#24344a">2 night totals remain</text><text x="172" y="260" text-anchor="middle" font-size="16" fill="#24344a">rows: night 0, night 1</text><text x="172" y="293" text-anchor="middle" font-size="16" fill="#24344a">columns: sensors 0, 1, 2</text></g></svg>