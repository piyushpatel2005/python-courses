<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img" aria-labelledby="title desc">
<title id="title">Center And Spread Of Three Readings</title>
<desc id="desc">Temperatures 10 12 14 have mean 12. Subtracting the mean gives minus 2, zero, and 2. Squared distances 4 0 4 average to 8 divided by 3. Population standard deviation is the square root, approximately 1.633.</desc>
<rect width="840" height="450" rx="20" fill="#fffdf6"/>
<g font-family="Trebuchet MS, sans-serif" fill="#17324a" text-anchor="middle">
<text x="420" y="42" font-size="25" font-weight="bold">Center And Spread</text>
<text x="420" y="82" font-size="19">temperatures = [10., 12., 14.]</text>
<text x="165" y="128" font-size="18">Readings</text><text x="420" y="128" font-size="18">Offsets From Mean 12</text><text x="675" y="128" font-size="18">Squared Distances</text>
<rect x="70" y="148" width="190" height="132" rx="12" fill="#e7f0ff" stroke="#315f82" stroke-width="2"/>
<rect x="325" y="148" width="190" height="132" rx="12" fill="#ffe9b9" stroke="#315f82" stroke-width="2"/>
<rect x="580" y="148" width="190" height="132" rx="12" fill="#bce8db" stroke="#315f82" stroke-width="2"/>
<g font-family="monospace" font-size="23">
<text x="165" y="181">10</text><text x="165" y="223">12</text><text x="165" y="265">14</text>
<text x="420" y="181">−2</text><text x="420" y="223">0</text><text x="420" y="265">2</text>
<text x="675" y="181">4</text><text x="675" y="223">0</text><text x="675" y="265">4</text>
</g>
<text x="420" y="328" font-size="20">Population variance: (4 + 0 + 4) / 3 = 8 / 3</text>
<text x="420" y="369" font-size="20">Standard deviation: √(8 / 3) ≈ 1.633</text>
<text x="420" y="413" font-size="18">Variance uses squared units; standard deviation uses the original units.</text>
</g></svg>
