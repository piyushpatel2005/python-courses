<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">One Baseline Per Row</title>
<desc id="desc">The lesson grid has rows 2 4, 6 8, and 10 12. Baselines 1 2 3 become a three by one column. Subtracting it gives rows 1 3, 4 6, and 7 9.</desc>
<rect width="840" height="430" rx="20" fill="#fffdf6"/>
<g font-family="Trebuchet MS, sans-serif" fill="#17324a" text-anchor="middle">
<text x="420" y="42" font-size="25" font-weight="bold">One Baseline Per Row</text>
<text x="420" y="82" font-size="18">baselines[:, np.newaxis] changes (3,) into (3, 1)</text>
<text x="155" y="128" font-size="19">grid (3, 2)</text>
<text x="420" y="128" font-size="19">column (3, 1)</text>
<text x="685" y="128" font-size="19">corrected (3, 2)</text>
<rect x="55" y="151" width="200" height="164" rx="12" fill="#e7f0ff" stroke="#315f82" stroke-width="2"/>
<rect x="355" y="151" width="130" height="164" rx="12" fill="#ffe9b9" stroke="#315f82" stroke-width="2"/>
<rect x="585" y="151" width="200" height="164" rx="12" fill="#bce8db" stroke="#315f82" stroke-width="2"/>
<g font-family="monospace" font-size="25">
<text x="155" y="190">2   4</text><text x="155" y="240">6   8</text><text x="155" y="290">10  12</text>
<text x="420" y="190">1</text><text x="420" y="240">2</text><text x="420" y="290">3</text>
<text x="685" y="190">1   3</text><text x="685" y="240">4   6</text><text x="685" y="290">7   9</text>
<text x="305" y="242">−</text><text x="535" y="242">=</text>
</g>
<text x="420" y="360" font-size="18">Each baseline is reused across its row's two columns.</text>
<text x="420" y="397" font-size="18">Aligned dimensions: 3 matches 3; 1 expands to 2.</text>
</g></svg>
