<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="title desc"><title id="title">Broadcast a vector across grid rows</title><desc id="desc">A two-row, three-column grid combines with a three-element vector. The vector is reused in both rows to give a two by three result.</desc><rect width="840" height="340" fill="#fffdf6"/><text x="34" y="41" font-family="Trebuchet MS,sans-serif" font-size="25" font-weight="bold" fill="#12233a">A column offset is reused across rows</text><g font-family="Trebuchet MS,sans-serif" font-size="17" fill="#17324a"><text x="40" y="90">grid (2, 3)</text><text x="293" y="90">offsets (3,)</text><text x="560" y="90">result (2, 3)</text></g><g stroke="#203e5a" stroke-width="3" font-family="monospace" font-size="22" text-anchor="middle" fill="#102b38"><rect x="35" y="120" width="207" height="140" rx="9" fill="#e7f0ff" transform="rotate(-0.5 138 190)"/><rect x="280" y="143" width="207" height="54" rx="9" fill="#ffe9b9" transform="rotate(0.7 385 170)"/><rect x="550" y="120" width="245" height="140" rx="9" fill="#bce8db" transform="rotate(-0.5 672 190)"/></g><g font-family="monospace" font-size="23" fill="#102b38"><text x="51" y="168">1   2   3</text><text x="51" y="225">4   5   6</text><text x="297" y="179">10  20  30</text><text x="569" y="168">11  22  33</text><text x="569" y="225">14  25  36</text></g><text x="248" y="199" font-family="Trebuchet MS,sans-serif" font-size="29" font-weight="bold" fill="#203e5a">+</text><path d="M494 189 L540 189" stroke="#203e5a" stroke-width="3" fill="none"/><path d="M530 183 L540 189 L530 195" stroke="#203e5a" stroke-width="3" fill="none"/><text x="342" y="293" font-family="Trebuchet MS,sans-serif" font-size="17" fill="#17324a">same offsets on row 1 and row 2</text></svg>
