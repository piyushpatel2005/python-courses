<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="title desc"><title id="title">Broadcast a vector across grid rows</title><desc id="desc">A two-row, three-column grid combines with a three-element vector. The vector is reused in both rows to give a two by three result.</desc><rect width="840" height="340" fill="#fffdf6"/><text x="420" y="41" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="25" font-weight="bold" fill="#12233a">One Offset Per Column, Reused Across Rows</text><g font-family="Trebuchet MS,sans-serif" font-size="17" fill="#17324a"><text x="138" y="90" text-anchor="middle">grid (2, 3)</text><text x="383" y="90" text-anchor="middle">offsets (3,)</text><text x="672" y="90" text-anchor="middle">result (2, 3)</text></g><g stroke="#203e5a" stroke-width="3" font-family="monospace" font-size="22" text-anchor="middle" fill="#102b38"><rect x="35" y="120" width="207" height="140" rx="9" fill="#e7f0ff" transform="rotate(-0.5 138 190)"/><rect x="280" y="143" width="207" height="54" rx="9" fill="#ffe9b9" transform="rotate(0.7 385 170)"/><rect x="550" y="120" width="245" height="140" rx="9" fill="#bce8db" transform="rotate(-0.5 672 190)"/></g><g font-family="monospace" font-size="23" fill="#102b38"><text x="138" text-anchor="middle" y="168">1   2   3</text><text x="138" text-anchor="middle" y="225">4   5   6</text><text x="383" text-anchor="middle" y="179">10  20  30</text><text x="672" text-anchor="middle" y="168">11  22  33</text><text x="672" text-anchor="middle" y="225">14  25  36</text></g><text x="248" y="199" font-family="Trebuchet MS,sans-serif" font-size="29" font-weight="bold" fill="#203e5a">+</text><text x="518" y="198" text-anchor="middle" font-family="monospace" font-size="29" fill="#203e5a">=</text><text x="420" y="293" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="17" fill="#17324a">The same offsets apply to row 0 and row 1.</text></svg>
