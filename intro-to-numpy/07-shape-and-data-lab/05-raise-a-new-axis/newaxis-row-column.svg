<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">One Vector, Two Orientations</title>
  <desc id="desc">The vector 9, 4, 6 has shape (3,). A new axis before the slice makes one row with shape (1, 3). A new axis after the slice makes one column with shape (3, 1). Both contain three values.</desc>
  <rect width="760" height="390" rx="22" fill="#fcfbf7"/>
  <g font-family="Trebuchet MS, sans-serif" fill="#24344a" text-anchor="middle">
    <text x="380" y="39" font-size="24">One Vector, Two Orientations</text>
    <text x="380" y="76" font-size="19">values = [9, 4, 6]    shape (3,)</text>
    <rect x="35" y="107" width="330" height="227" rx="14" fill="#e5f1f7" stroke="#315f82" stroke-width="2"/>
    <text x="200" y="141" font-size="20">values[np.newaxis, :]</text>
    <text x="200" y="171" font-size="18">One row: (1, 3)</text>
    <rect x="93" y="214" width="62" height="52" rx="8" fill="#fff" stroke="#315f82"/>
    <text x="124" y="247" font-size="22">9</text>
    <rect x="169" y="214" width="62" height="52" rx="8" fill="#fff" stroke="#315f82"/>
    <text x="200" y="247" font-size="22">4</text>
    <rect x="245" y="214" width="62" height="52" rx="8" fill="#fff" stroke="#315f82"/>
    <text x="276" y="247" font-size="22">6</text>
    <rect x="395" y="107" width="330" height="227" rx="14" fill="#e7f3e8" stroke="#35725b" stroke-width="2"/>
    <text x="560" y="141" font-size="20">values[:, np.newaxis]</text>
    <text x="560" y="171" font-size="18">One column: (3, 1)</text>
    <rect x="529" y="190" width="62" height="38" rx="8" fill="#fff" stroke="#35725b"/>
    <text x="560" y="216" font-size="22">9</text>
    <rect x="529" y="235" width="62" height="38" rx="8" fill="#fff" stroke="#35725b"/>
    <text x="560" y="261" font-size="22">4</text>
    <rect x="529" y="280" width="62" height="38" rx="8" fill="#fff" stroke="#35725b"/>
    <text x="560" y="306" font-size="22">6</text>
    <text x="380" y="366" font-size="18">A length-one axis changes shape, not the number of readings.</text>
  </g>
</svg>
