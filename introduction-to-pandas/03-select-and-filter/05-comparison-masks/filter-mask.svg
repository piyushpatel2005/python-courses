<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title desc">
<title id="title">Comparison mask and kept rows</title>
<desc id="desc">Three labeled stock rows are matched with a True or False mask. Rows Bee and Oak have at least eight crates and appear in the kept table, preserving their original labels.</desc>
<rect width="820" height="340" rx="20" fill="#101c30"/>
<text x="28" y="42" font-family="sans-serif" font-weight="bold" font-size="23" fill="#ffffff">Select rows where crates ≥ 8</text>
<g font-family="sans-serif" font-size="16" font-weight="bold" fill="#bed1e5"><text x="34" y="86">INPUT TABLE</text><text x="317" y="86">MASK</text><text x="530" y="86">KEPT ROWS</text></g>
<g font-family="monospace" font-size="18" fill="#ffffff"><rect x="28" y="106" width="250" height="49" rx="7" fill="#34445c"/><text x="44" y="137">f  Fern   5</text><rect x="28" y="161" width="250" height="49" rx="7" fill="#147d70"/><text x="44" y="192">b  Bee    8</text><rect x="28" y="216" width="250" height="49" rx="7" fill="#147d70"/><text x="44" y="247">o  Oak   12</text><rect x="313" y="106" width="170" height="49" rx="7" fill="#34445c"/><text x="335" y="137">f  False</text><rect x="313" y="161" width="170" height="49" rx="7" fill="#147d70"/><text x="335" y="192">b  True</text><rect x="313" y="216" width="170" height="49" rx="7" fill="#147d70"/><text x="335" y="247">o  True</text><rect x="525" y="161" width="265" height="49" rx="7" fill="#147d70"/><text x="543" y="192">b  Bee    8</text><rect x="525" y="216" width="265" height="49" rx="7" fill="#147d70"/><text x="543" y="247">o  Oak   12</text></g>
<text x="29" y="308" font-family="sans-serif" font-size="16" fill="#bed1e5">The index labels stay attached to their matching rows.</text>
</svg>
