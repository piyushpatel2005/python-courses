<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" role="img" aria-labelledby="title desc">
<title id="title">Community market report pipeline</title>
<desc id="desc">Two CSV input tables feed cleaning and revenue enrichment. Filtered sales join the stall directory. Neighborhood totals become an index-free CSV report. Arrows point left to right between stages.</desc>
<rect width="940" height="260" rx="18" fill="#f7f8f3"/>
<text x="470" y="39" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#17324b">Community Market Report</text>
<rect x="20" y="76" width="192" height="130" rx="12" fill="#e6f2fa" stroke="#427391" stroke-width="2"/>
<text x="116" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17324b">Sales + stall</text>
<text x="116" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17324b">CSV sheets</text>
<path d="M212 141 H250" stroke="#427391" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="254" y="76" width="192" height="130" rx="12" fill="#fff2d8" stroke="#987445" stroke-width="2"/>
<text x="350" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17324b">Clean dates</text>
<text x="350" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17324b">+ add revenue</text>
<path d="M446 141 H484" stroke="#427391" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="488" y="76" width="192" height="130" rx="12" fill="#e8efe8" stroke="#477959" stroke-width="2"/>
<text x="584" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17324b">Filter sales</text>
<text x="584" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17324b">+ join stalls</text>
<path d="M680 141 H718" stroke="#427391" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="722" y="76" width="198" height="130" rx="12" fill="#eceafa" stroke="#655b91" stroke-width="2"/>
<text x="821" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17324b">Group totals</text>
<text x="821" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17324b">+ export CSV</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#427391"/></marker></defs>
</svg>
