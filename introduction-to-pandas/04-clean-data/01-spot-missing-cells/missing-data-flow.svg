<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 335" role="img" aria-labelledby="title desc">
<title id="title">Missing email determines which records remain</title>
<desc id="desc">A sign-up table, missing-cell check, and contact list appear in three panels. Ada has a missing optional note and remains; Bea has a missing required email and is removed; Cy remains.</desc>
<rect width="850" height="335" rx="20" fill="#101c30"/>
<text x="25" y="41" font-family="sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Keep sign-ups with an email</text>
<g font-family="sans-serif" font-size="16" font-weight="bold" fill="#bed1e5"><text x="28" y="84">SIGN-UPS</text><text x="322" y="84">EMAIL MISSING?</text><text x="599" y="84">CONTACT LIST</text></g>
<g font-family="monospace" font-size="17" fill="#ffffff"><rect x="25" y="103" width="265" height="51" rx="8" fill="#147d70"/><text x="39" y="122">Ada  email ✓</text><text x="39" y="146">note missing</text><rect x="25" y="159" width="265" height="51" rx="8" fill="#674050"/><text x="39" y="191">Bea  email missing</text><rect x="25" y="215" width="265" height="51" rx="8" fill="#147d70"/><text x="39" y="247">Cy   email ✓</text><rect x="318" y="103" width="238" height="51" rx="8" fill="#147d70"/><text x="337" y="135">Ada  False</text><rect x="318" y="159" width="238" height="51" rx="8" fill="#674050"/><text x="337" y="191">Bea  True</text><rect x="318" y="215" width="238" height="51" rx="8" fill="#147d70"/><text x="337" y="247">Cy   False</text><rect x="589" y="103" width="232" height="51" rx="8" fill="#147d70"/><text x="609" y="135">Ada  retained</text><rect x="589" y="215" width="232" height="51" rx="8" fill="#147d70"/><text x="609" y="247">Cy   retained</text></g>
<text x="27" y="305" font-family="sans-serif" font-size="16" fill="#bed1e5">A missing note is allowed; a missing email is not.</text>
</svg>
