<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Place Each Total at Its Zone and Day</title><desc id="desc">N Friday 5, N Saturday 3 and S Friday 8 become a grid. S Saturday has no source row and displays zero only after fill_value=0.</desc><rect width="900" height="380" rx="16" fill="#101a30"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ce4d3"/></marker></defs><text x="450" y="38" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="25">Place Each Total at Its Zone and Day</text><rect x="30" y="75" width="240" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="150.0" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Source Records</text><text x="150.0" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">zone | day | amount</text><text x="150.0" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">N | Fri | 5</text><text x="150.0" y="203" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">N | Sat | 3</text><text x="150.0" y="232" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">S | Fri | 8</text><rect x="330" y="75" width="240" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="450.0" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Cell Coordinates</text><text x="450.0" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">row label = zone</text><text x="450.0" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">column label = day</text><text x="450.0" y="203" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">cell = sum(amount)</text><rect x="630" y="75" width="240" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="750.0" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Filled Grid</text><text x="750.0" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">zone | Fri | Sat</text><text x="750.0" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">N | 5 | 3</text><text x="750.0" y="203" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">S | 8 | 0*</text><path d="M270,185 L330,185" fill="none" stroke="#8ce4d3" stroke-width="2" marker-end="url(#arrow)"/><path d="M570,185 L630,185" fill="none" stroke="#8ce4d3" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="335" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">* There is no S/Sat record. fill_value=0 displays zero for that gap.</text><text x="450" y="360" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">Repeated zone-day records would be summed into the same cell.</text></svg>
