<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Split by Zone, Then Count</title><desc id="desc">North contains amount 10 and a missing amount; South contains amount 6. count returns one for each zone, while size returns two for North and one for South.</desc><rect width="900" height="380" rx="16" fill="#101a30"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ce4d3"/></marker></defs><text x="450" y="38" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="25">Split by Zone, Then Count</text><rect x="30" y="75" width="240" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="150.0" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Input Rows</text><text x="150.0" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">North | 10</text><text x="150.0" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">North | missing</text><text x="150.0" y="203" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">South | 6</text><rect x="330" y="75" width="240" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="450.0" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Split by Zone</text><text x="450.0" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">North: [10, missing]</text><text x="450.0" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">South: [6]</text><rect x="630" y="75" width="240" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="750.0" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Apply and Combine</text><text x="750.0" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">zone | count | size</text><text x="750.0" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">North | 1 | 2</text><text x="750.0" y="203" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">South | 1 | 1</text><path d="M270,185 L330,185" fill="none" stroke="#8ce4d3" stroke-width="2" marker-end="url(#arrow)"/><path d="M570,185 L630,185" fill="none" stroke="#8ce4d3" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="335" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">count() counts known amounts; size() counts rows.</text></svg>
