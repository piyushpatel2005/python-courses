<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
<title id="title">From CSV text to a labeled table</title>
<desc id="desc">Comma-separated rows go into an in-memory StringIO buffer. A right-pointing arrow leads to read_csv, then another arrow leads to a table with separate stall and visits columns.</desc>
<rect width="900" height="240" rx="18" fill="#f7f8f3"/>
<text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#17324b">From text to columns</text>
<rect x="22" y="68" width="220" height="126" rx="12" fill="#e6f2fa" stroke="#427391" stroke-width="2"/>
<text x="132" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17324b">CSV text</text>
<text x="132" y="131" text-anchor="middle" font-family="monospace" font-size="13" fill="#17324b">stall,visits</text>
<text x="132" y="157" text-anchor="middle" font-family="monospace" font-size="13" fill="#17324b">Tea Cart,5</text>
<path d="M242 131 H315" stroke="#427391" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="319" y="68" width="240" height="126" rx="12" fill="#fff2d8" stroke="#987445" stroke-width="2"/>
<text x="439" y="114" text-anchor="middle" font-family="monospace" font-size="17" fill="#17324b">StringIO(text)</text>
<text x="439" y="148" text-anchor="middle" font-family="monospace" font-size="17" fill="#17324b">pd.read_csv(...)</text>
<path d="M559 131 H631" stroke="#427391" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="635" y="68" width="242" height="126" rx="12" fill="#e6f3e9" stroke="#477959" stroke-width="2"/>
<text x="756" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17324b">DataFrame</text>
<text x="756" y="136" text-anchor="middle" font-family="monospace" font-size="14" fill="#17324b">stall    visits</text>
<text x="756" y="164" text-anchor="middle" font-family="monospace" font-size="14" fill="#17324b">Tea Cart     5</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#427391"/></marker></defs>
</svg>
