<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Stack Rows, Replace Labels</title><desc id="desc">Input a has label 8 and b has label 5. Concatenating in that order with ignore_index=True produces labels 0 and 1.</desc><rect width="900" height="380" rx="16" fill="#101a30"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ce4d3"/></marker></defs><text x="450" y="38" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="25">Stack Rows, Replace Labels</text><rect x="30" y="75" width="245" height="210" rx="10" fill="#203551" stroke="#6888ac"/><text x="152.5" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">First Sheet: a</text><text x="152.5" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">index | stall | crates</text><text x="152.5" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">8 | Lark | 2</text><rect x="325" y="75" width="245" height="210" rx="10" fill="#203551" stroke="#6888ac"/><text x="447.5" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Second Sheet: b</text><text x="447.5" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">index | stall | crates</text><text x="447.5" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">5 | Moss | 4</text><rect x="620" y="75" width="250" height="210" rx="10" fill="#203551" stroke="#6888ac"/><text x="745.0" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Combined</text><text x="745.0" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">index | stall | crates</text><text x="745.0" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">0 | Lark | 2</text><text x="745.0" y="203" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">1 | Moss | 4</text><text x="450" y="335" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">pd.concat([a, b], ignore_index=True)</text><text x="450" y="360" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">Keep the values; replace only the row labels.</text></svg>
