<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" role="img" aria-labelledby="title desc"><title id="title">Which Keys Survive a Merge?</title><desc id="desc">Bookings have Lark and Unknown; vendor lookup has only Lark. Inner and right retain Lark. Left and outer also retain Unknown with a missing vendor.</desc><rect width="900" height="485" rx="16" fill="#101a30"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ce4d3"/></marker></defs><text x="450" y="38" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="25">Which Keys Survive a Merge?</text><rect x="30" y="75" width="405" height="140" rx="10" fill="#203551" stroke="#6888ac"/><text x="232.5" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Inner: Matches Only</text><text x="232.5" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Lark | 2 tables | Ari</text><rect x="465" y="75" width="405" height="140" rx="10" fill="#203551" stroke="#6888ac"/><text x="667.5" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Left: All Bookings</text><text x="667.5" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Lark | 2 tables | Ari</text><text x="667.5" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Unknown | 1 table | missing</text><rect x="30" y="245" width="405" height="140" rx="10" fill="#203551" stroke="#6888ac"/><text x="232.5" y="277" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Right: All Vendor Keys</text><text x="232.5" y="315" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Lark | 2 tables | Ari</text><rect x="465" y="245" width="405" height="140" rx="10" fill="#203551" stroke="#6888ac"/><text x="667.5" y="277" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Outer: Keys From Either Side</text><text x="667.5" y="315" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Lark | 2 tables | Ari</text><text x="667.5" y="344" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Unknown | 1 table | missing</text><text x="450" y="440" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">Inputs: bookings = Lark, Unknown; vendor lookup = Lark → Ari</text><text x="450" y="465" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">Here the lookup has no right-only key, so right matches inner.</text></svg>
