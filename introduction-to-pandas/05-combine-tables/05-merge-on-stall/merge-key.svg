<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 305" role="img" aria-label="Match stall keys">
<title>Match Stall Keys</title>
<desc>A left merge keeps both booking rows and adds vendor information for the matching stall.</desc>
<rect width="860" height="305" rx="18" fill="#101a30"/>
<text x="35" y="43" fill="#f4f7fd" font-family="Arial,sans-serif" font-size="24" font-weight="bold">Match stall keys</text>
<rect x="40" y="65" width="230" height="215" rx="12" fill="#203551" stroke="#6888ac"/>
<text x="55" y="98" fill="#8ce4d3" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Bookings</text>
<text x="55" y="138" fill="#f4f7fd" font-family="monospace" font-size="15">Lark 2</text>
<text x="55" y="171" fill="#f4f7fd" font-family="monospace" font-size="15">Unknown 1</text>
<rect x="315" y="65" width="230" height="215" rx="12" fill="#203551" stroke="#6888ac"/>
<text x="330" y="98" fill="#8ce4d3" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Vendor lookup</text>
<text x="330" y="138" fill="#f4f7fd" font-family="monospace" font-size="15">Lark Ari</text>
<rect x="590" y="65" width="230" height="215" rx="12" fill="#203551" stroke="#6888ac"/>
<text x="605" y="98" fill="#8ce4d3" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Left merge</text>
<text x="605" y="138" fill="#f4f7fd" font-family="monospace" font-size="15">Lark 2 Ari</text>
<text x="605" y="171" fill="#f4f7fd" font-family="monospace" font-size="15">Unknown 1 missing</text>
</svg>
