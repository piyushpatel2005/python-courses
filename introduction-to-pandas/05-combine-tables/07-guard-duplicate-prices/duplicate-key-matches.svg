<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Repeated Keys Create Every Matching Pair</title><desc id="desc">The duplicate probe uses two Bread orders and two identical Bread price rows. Each order matches both price rows, making four rows unless many_to_one validation rejects the duplicate lookup.</desc><rect width="900" height="380" rx="16" fill="#101a30"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ce4d3"/></marker></defs><text x="450" y="38" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="25">Repeated Keys Create Every Matching Pair</text><rect x="30" y="75" width="245" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="152.5" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Orders</text><text x="152.5" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Bread | units 1</text><text x="152.5" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Bread | units 2</text><rect x="325" y="75" width="245" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="447.5" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Duplicate Price Probe</text><text x="447.5" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Bread | price 4</text><text x="447.5" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Bread | price 4</text><rect x="620" y="75" width="250" height="220" rx="10" fill="#203551" stroke="#6888ac"/><text x="745.0" y="107" text-anchor="middle" fill="#8ce4d3" font-family="Arial, sans-serif" font-size="20">Unchecked Result</text><text x="745.0" y="145" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Bread | 1 | 4</text><text x="745.0" y="174" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Bread | 1 | 4</text><text x="745.0" y="203" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Bread | 2 | 4</text><text x="745.0" y="232" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="18">Bread | 2 | 4</text><text x="450" y="335" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">2 orders × 2 matching price rows = 4 output rows</text><text x="450" y="360" text-anchor="middle" fill="#f4f7fd" font-family="Arial, sans-serif" font-size="17">many_to_one rejects the duplicate lookup before returning a result.</text></svg>
