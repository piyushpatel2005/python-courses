<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">Add by Label, Not Position</title><desc id="desc">Morning lists north 4 then south 7. Afternoon lists south 3 then north 2. Match labels to calculate north 4 plus 2 equals 6 and south 7 plus 3 equals 10.</desc>
<rect width="760" height="390" rx="18" fill="#111827"/>
<g font-family="sans-serif" text-anchor="middle" fill="#f9fafb">
<text x="380" y="38" font-size="23" font-weight="bold">Add by Label, Not Position</text>
<text x="200" y="78" font-size="19">morning</text><text x="560" y="78" font-size="19">afternoon</text>
<rect x="70" y="94" width="260" height="45" rx="7" fill="#1e3a5f"/><text x="200" y="123" font-size="20">north : 4</text>
<rect x="70" y="151" width="260" height="45" rx="7" fill="#14532d"/><text x="200" y="180" font-size="20">south : 7</text>
<rect x="430" y="94" width="260" height="45" rx="7" fill="#14532d"/><text x="560" y="123" font-size="20">south : 3</text>
<rect x="430" y="151" width="260" height="45" rx="7" fill="#1e3a5f"/><text x="560" y="180" font-size="20">north : 2</text>
<text x="380" y="229" font-size="18">Match each name before adding its values</text>
<rect x="70" y="248" width="620" height="45" rx="7" fill="#1e3a5f"/><text x="380" y="277" font-size="20">north : 4 + 2 = 6</text>
<rect x="70" y="305" width="620" height="45" rx="7" fill="#14532d"/><text x="380" y="334" font-size="20">south : 7 + 3 = 10</text>
<text x="380" y="377" font-size="15" fill="#cbd5e1">Starting values, before you change the afternoon count</text>
</g></svg>
