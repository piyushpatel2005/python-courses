<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="title desc"><title id="title">Series Labels and Values</title><desc id="desc">Two stall index labels are paired row by row with visitor counts.</desc><rect width="640" height="250" rx="20" fill="#111827"/><text x="320" y="40" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="22" font-weight="bold">One Series, two parts</text><text x="185" y="84" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="17">Index labels</text><text x="455" y="84" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="17">Values</text><g font-family="sans-serif" font-size="19" text-anchor="middle"><rect x="74" y="99" width="222" height="41" rx="8" fill="#1e3a5f"/><text x="185" y="126" fill="#eff6ff">bread</text><rect x="344" y="99" width="222" height="41" rx="8" fill="#14532d"/><text x="455" y="126" fill="#f0fdf4">8</text><rect x="74" y="149" width="222" height="41" rx="8" fill="#1e3a5f"/><text x="185" y="176" fill="#eff6ff">flowers</text><rect x="344" y="149" width="222" height="41" rx="8" fill="#14532d"/><text x="455" y="176" fill="#f0fdf4">5</text></g><text x="320" y="223" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Each row pairs one label with one count.</text></svg>