<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 280" role="img" aria-labelledby="title desc"><title id="title">DataFrame Grid</title><desc id="desc">A two-column table shows row index labels, stall names, and visitor counts.</desc><rect width="670" height="280" rx="20" fill="#111827"/><text x="335" y="40" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="22" font-weight="bold">A DataFrame is a labeled table</text><g font-family="sans-serif" font-size="19" text-anchor="middle"><rect x="44" y="73" width="178" height="49" rx="8" fill="#374151"/><text x="133" y="104" fill="#f9fafb">Row index</text><rect x="236" y="73" width="178" height="49" rx="8" fill="#1e3a5f"/><text x="325" y="104" fill="#eff6ff">stall</text><rect x="428" y="73" width="178" height="49" rx="8" fill="#14532d"/><text x="517" y="104" fill="#f0fdf4">visitors</text><rect x="44" y="132" width="178" height="49" rx="8" fill="#374151"/><text x="133" y="163" fill="#f9fafb">0</text><rect x="236" y="132" width="178" height="49" rx="8" fill="#1e3a5f"/><text x="325" y="163" fill="#eff6ff">tea</text><rect x="428" y="132" width="178" height="49" rx="8" fill="#14532d"/><text x="517" y="163" fill="#f0fdf4">4</text><rect x="44" y="191" width="178" height="49" rx="8" fill="#374151"/><text x="133" y="222" fill="#f9fafb">1</text><rect x="236" y="191" width="178" height="49" rx="8" fill="#1e3a5f"/><text x="325" y="222" fill="#eff6ff">bread</text><rect x="428" y="191" width="178" height="49" rx="8" fill="#14532d"/><text x="517" y="222" fill="#f0fdf4">6</text></g></svg>