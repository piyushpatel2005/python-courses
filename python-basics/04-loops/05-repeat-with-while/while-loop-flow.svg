<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">While Loop Flow</title><desc id="desc">Check seconds before each iteration. True runs the body and decrements seconds, then checks again. False exits.</desc>
<rect width="800" height="400" fill="#f8fafc" rx="12"/>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5874a0"/></marker></defs>
<text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#17233c">How a while loop repeats</text>
<rect x="335" y="60" width="130" height="48" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="400" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#17233c">Start</text>
<rect x="315" y="135" width="170" height="65" rx="12" fill="#fff1d6" stroke="#5874a0" stroke-width="2"/>
<text x="400" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#17233c">Check condition</text>
<text x="400" y="187" text-anchor="middle" font-family="monospace" font-size="17" font-weight="400" fill="#17233c">seconds &gt; 0?</text>
<rect x="50" y="145" width="205" height="65" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="152" y="171" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#17233c">Loop body</text>
<text x="152" y="195" text-anchor="middle" font-family="monospace" font-size="13" font-weight="400" fill="#17233c">print(&quot;Mist&quot;, seconds)</text>
<rect x="65" y="270" width="175" height="62" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="152" y="296" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#17233c">Update</text>
<text x="152" y="318" text-anchor="middle" font-family="monospace" font-size="15" font-weight="400" fill="#17233c">seconds -= 1</text>
<rect x="595" y="143" width="140" height="60" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="665" y="178" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17233c">Done</text>
<path d="M400 108 V135" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M315 168 H255" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="278" y="153" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#455777">True</text>
<path d="M152 210 V270" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M240 301 H285 V235 H400 V200" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M485 168 H595" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="540" y="153" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#455777">False</text>
<text x="400" y="373" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="400" fill="#17233c">3 → 2 → 1 → 0; when the condition is false, the loop stops.</text>
</svg>
