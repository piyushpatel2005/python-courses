<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">One Instruction, Three Turns</title>
  <desc id="desc">One instruction to print Ticket ready is repeated three times. Turns one, two, and three each produce a separate Ticket ready line.</desc>
  <rect width="480" height="480" rx="16" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5874a0"/>
    </marker>
  </defs>
  <text x="240" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17233c">One Instruction, Three Turns</text>
  <rect id="instruction" x="60" y="65" width="360" height="85" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
  <text data-container="instruction" x="240" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17233c">Repeat 3 Times</text>
  <text data-container="instruction" x="240" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17233c">Print "Ticket ready"</text>
  <path data-from="instruction" data-to="turn-1" d="M240 150 V195" fill="none" stroke="#5874a0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect id="turn-1" x="60" y="195" width="360" height="55" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
  <text data-container="turn-1" x="240" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17233c">Turn 1: Ticket ready</text>
  <path data-from="turn-1" data-to="turn-2" d="M240 250 V275" fill="none" stroke="#5874a0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect id="turn-2" x="60" y="275" width="360" height="55" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
  <text data-container="turn-2" x="240" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17233c">Turn 2: Ticket ready</text>
  <path data-from="turn-2" data-to="turn-3" d="M240 330 V355" fill="none" stroke="#5874a0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect id="turn-3" x="60" y="355" width="360" height="55" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
  <text data-container="turn-3" x="240" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17233c">Turn 3: Ticket ready</text>
  <text x="240" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17233c">Three turns; one line per turn.</text>
</svg>
