<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
<title id="title">String Slicing: route[:4]</title><desc id="desc">GLOW:TRAM has indices 0 through 8. The slice route[:4] includes positions 0 through 3, yielding GLOW; index 4, the colon, is excluded.</desc>
<rect width="800" height="360" fill="#f8fafc" rx="12"/>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5874a0"/></marker></defs>
<text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#17233c">A slice stops before the stop index</text>
<text x="95" y="76" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="400" fill="#455777">Index</text>
<text x="95" y="138" text-anchor="end" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">route</text>
<text x="95" y="188" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="400" fill="#455777">From end</text>
<rect x="110" y="99" width="54" height="54" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="137" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">W</text>
<text x="137" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">0</text>
<text x="137" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-9</text>
<rect x="171" y="99" width="54" height="54" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="198" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">E</text>
<text x="198" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">1</text>
<text x="198" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-8</text>
<rect x="232" y="99" width="54" height="54" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="259" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">S</text>
<text x="259" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">2</text>
<text x="259" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-7</text>
<rect x="293" y="99" width="54" height="54" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="320" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">T</text>
<text x="320" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">3</text>
<text x="320" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-6</text>
<rect x="354" y="99" width="54" height="54" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="381" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">:</text>
<text x="381" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">4</text>
<text x="381" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-5</text>
<rect x="415" y="99" width="54" height="54" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="442" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">T</text>
<text x="442" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">5</text>
<text x="442" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-4</text>
<rect x="476" y="99" width="54" height="54" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="503" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">R</text>
<text x="503" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">6</text>
<text x="503" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-3</text>
<rect x="537" y="99" width="54" height="54" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="564" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">A</text>
<text x="564" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">7</text>
<text x="564" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-2</text>
<rect x="598" y="99" width="54" height="54" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="625" y="134" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#17233c">M</text>
<text x="625" y="83" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">8</text>
<text x="625" y="186" text-anchor="middle" font-family="monospace" font-size="16" font-weight="400" fill="#17233c">-1</text>
<path d="M110 205 V215 H347 V205" fill="none" stroke="#26814b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  />
<text x="229" y="243" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#1b673a">route[:4]  →  &quot;GLOW&quot;</text>
<rect x="75" y="270" width="650" height="70" rx="12" fill="#fff1d6" stroke="#5874a0" stroke-width="2"/>
<text x="98" y="298" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#17233c">Start 0 is included: W, E, S, T. Stop 4 is excluded: the colon stays out.</text>
<text x="98" y="322" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#17233c">Leave out start for 0; leave out stop to continue to the end.</text>
</svg>
