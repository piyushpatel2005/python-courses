<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
<title id="title">f-string Anatomy</title><desc id="desc">f enables interpolation; name becomes GLOW, and energy formatted with .2f becomes 7.50, producing GLOW: 7.50 energy.</desc>
<rect width="800" height="380" fill="#f8fafc" rx="12"/>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5874a0"/></marker></defs>
<text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#17233c">An f-string fills in a energy card</text>
<rect x="65" y="67" width="670" height="66" rx="12" fill="#17233c" stroke="#17233c" stroke-width="2"/>
<text x="400" y="108" text-anchor="middle" font-family="monospace" font-size="23" font-weight="400" fill="white">card = f&quot;{name}: ${energy:.2f}&quot;</text>
<rect x="65" y="167" width="195" height="68" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="162" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#17233c">f before the quote</text>
<text x="162" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#17233c">enables substitution</text>
<rect x="302" y="167" width="195" height="68" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="399" y="194" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" fill="#17233c">{name}</text>
<text x="399" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#17233c">inserts GLOW</text>
<rect x="539" y="167" width="195" height="68" rx="12" fill="#fff1d6" stroke="#5874a0" stroke-width="2"/>
<text x="636" y="194" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" fill="#17233c">{energy:.2f}</text>
<text x="636" y="217" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#17233c">shows 2 decimals</text>
<path d="M162 133 V167" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M399 133 V167" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M636 133 V167" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="185" y="266" width="430" height="63" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="400" y="289" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="400" fill="#17233c">Output with name = &quot;GLOW&quot;, energy = 7.5</text>
<text x="400" y="315" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#17233c">GLOW: 7.50 energy</text>
<text x="400" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="400" fill="#455777">Formatting changes the displayed text, not the value of energy.</text>
</svg>
