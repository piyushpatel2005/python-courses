<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">List Indexing: First and Last</title><desc id="desc">For gear containing rope, flint, and lens, positive indices are 0, 1, 2 and negative indices are -3, -2, -1; gear[-1] is lens.</desc>
<rect width="800" height="340" fill="#f8fafc" rx="12"/>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5874a0"/></marker></defs>
<text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#17233c">Find the last item in a list</text>
<text x="95" y="89" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="400" fill="#455777">Index</text>
<text x="190" y="91" text-anchor="middle" font-family="monospace" font-size="18" font-weight="400" fill="#17233c">0</text>
<rect x="115" y="108" width="150" height="65" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="190" y="147" text-anchor="middle" font-family="monospace" font-size="21" font-weight="400" fill="#17233c">&quot;rope&quot;</text>
<text x="190" y="203" text-anchor="middle" font-family="monospace" font-size="18" font-weight="400" fill="#17233c">-3</text>
<text x="382" y="91" text-anchor="middle" font-family="monospace" font-size="18" font-weight="400" fill="#17233c">1</text>
<rect x="307" y="108" width="150" height="65" rx="12" fill="#e8f1ff" stroke="#5874a0" stroke-width="2"/>
<text x="382" y="147" text-anchor="middle" font-family="monospace" font-size="21" font-weight="400" fill="#17233c">&quot;flint&quot;</text>
<text x="382" y="203" text-anchor="middle" font-family="monospace" font-size="18" font-weight="400" fill="#17233c">-2</text>
<text x="574" y="91" text-anchor="middle" font-family="monospace" font-size="18" font-weight="400" fill="#17233c">2</text>
<rect x="499" y="108" width="150" height="65" rx="12" fill="#e5f6ea" stroke="#5874a0" stroke-width="2"/>
<text x="574" y="147" text-anchor="middle" font-family="monospace" font-size="21" font-weight="400" fill="#17233c">&quot;lens&quot;</text>
<text x="574" y="203" text-anchor="middle" font-family="monospace" font-size="18" font-weight="400" fill="#17233c">-1</text>
<text x="95" y="203" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="400" fill="#455777">From end</text>
<path d="M574 213 V232" fill="none" stroke="#5874a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="210" y="255" width="380" height="62" rx="12" fill="#fff1d6" stroke="#5874a0" stroke-width="2"/>
<text x="400" y="279" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#17233c">gear[-1]  →  &quot;lens&quot;</text>
<text x="400" y="303" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="400" fill="#17233c">-1 always selects the last item.</text>
</svg>
