<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">A Name Refers to a Value</title>
  <desc id="desc">The Python name room points from its card to a separate card containing the string Spawn Camp.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#394b76"/></marker></defs>
  <rect width="720" height="250" fill="#f8fafc" rx="18"/>
  <text x="360" y="44" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#14213d">A Name Refers to a Value</text>
  <rect x="55" y="95" width="225" height="95" rx="14" fill="#dceeff" stroke="#394b76" stroke-width="3"/>
  <text x="167.5" y="143" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="25" fill="#14213d">room</text>
  <path d="M 280 142.5 L 430 142.5" fill="none" stroke="#394b76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="430" y="95" width="235" height="95" rx="14" fill="#d9f5e5" stroke="#394b76" stroke-width="3"/>
  <text x="547.5" y="143" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="25" fill="#14213d">"Spawn Camp"</text>
  <text x="360" y="220" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#394b76">room = "Spawn Camp"</text>
</svg>
