<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img"><title>Operation-specific worked trace for binary node in Binary trees and search trees. Show concrete values and state before/after, actual pointers/indices/frontier when relevant, edge case where it reveals invariant. Peek MUST show unchanged structure and returned value; insert/delete show head/tail updates, including empty/singleton transitions. Do not use generic process boxes or repeat prior art without a distinct mechanism.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="900" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Binary node</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Worked trace • original illustrative values</text><path d="M 300 170 L 165 220" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 300 170 L 435 220" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><g><rect x="267.0" y="120" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="153.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">18</text></g><g><rect x="132.0" y="220" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="165.0" y="253.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">9</text></g><g><rect x="402.0" y="220" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="435.0" y="253.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">27</text></g><text x="300" y="405" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">root.value = 18</text><text x="300" y="435" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">root.left → 9     root.right → 27</text><g><rect x="267.0" y="525" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="558.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">9</text></g><text x="300" y="645" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Leaf 9: left = None; right = None</text><text x="300" y="675" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Empty tree: root = None</text><text x="300" y="878" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
