<svg xmlns="http://www.w3.org/2000/svg" width="600" height="670" viewBox="0 0 600 670" role="img"><title>One small tree with computed preorder,inorder,postorder sequences.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="670" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Three walks, one binary tree</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Left child is drawn to the left of its parent</text><path d="M 300 175 L 160 235" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 175 L 440 235" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 160 285 L 80 345" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 160 285 L 240 345" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 440 285 L 380 345" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="267.0" y="125" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="158.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">11</text></g><g><rect x="127.0" y="235" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="160.0" y="268.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">4</text></g><g><rect x="407.0" y="235" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="440.0" y="268.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">18</text></g><g><rect x="47.0" y="345" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="80.0" y="378.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">2</text></g><g><rect x="207.0" y="345" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="240.0" y="378.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">7</text></g><g><rect x="347.0" y="345" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="380.0" y="378.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">15</text></g><text x="300" y="465" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Pre: root, left, right</text><text x="300" y="492" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">11 → 4 → 2 → 7 → 18 → 15</text><text x="300" y="525" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">In: left, root, right</text><text x="300" y="552" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">2 → 4 → 7 → 11 → 15 → 18</text><text x="300" y="585" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Post: left, right, root</text><text x="300" y="612" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">2 → 7 → 4 → 15 → 18 → 11</text><text x="300" y="648" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
