<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img"><title>Two queued records for same vertex; discard outdated distance instead of processing twice.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="720" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Dijkstra skips an outdated record</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Nonnegative weights • lazy duplicate heap entries</text><g><rect x="67.0" y="135" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="168.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">S</text></g><g><rect x="267.0" y="135" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="168.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">U</text></g><g><rect x="467.0" y="135" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="500.0" y="168.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">V</text></g><path d="M 133 160 L 267 160" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 333 160 L 467 160" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 100 185 L 100 270 L 500 270 L 500 185" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><text x="300" y="320" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Weights: S→U = 3; U→V = 2; S→V = 11.</text><text x="300" y="350" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Direct discovery queues (11,V). Via U finds 5.</text><g><rect x="45" y="425" width="235" height="65" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="162.5" y="465.55" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">(5, V): current</text></g><g><rect x="320" y="425" width="235" height="65" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="437.5" y="465.55" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">(11, V): stale</text></g><text x="300" y="545" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Distance table: d[V] = 5.</text><text x="300" y="575" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Pop (5,V): relax its outgoing edges.</text><text x="300" y="605" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Later pop (11,V): 11 ≠ d[V], so skip.</text><text x="300" y="635" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Heap records are not unique vertex objects.</text><text x="300" y="698" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
