<svg xmlns="http://www.w3.org/2000/svg" width="500" height="430" viewBox="0 0 500 430" role="img" aria-labelledby="title desc"><title id="title">Count work, not elapsed time</title><desc id="desc">Exact operation counts for input sizes 4, 8, 16, and 32: one visit per item, repeated integer halving until 1, and one visit per distinct unordered pair.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="430" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Count work, not elapsed time</text><text x="30" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Input n</text><text x="152" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Visits</text><text x="255" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Halvings</text><text x="381" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Pairs</text><g><rect x="28" y="103" width="111" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="83.5" y="128.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><g><rect x="143" y="103" width="111" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="198.5" y="128.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><g><rect x="258" y="103" width="111" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="313.5" y="128.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="373" y="103" width="111" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="428.5" y="128.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">6</text></g><g><rect x="28" y="153" width="111" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="83.5" y="178.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">8</text></g><g><rect x="143" y="153" width="111" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="198.5" y="178.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">8</text></g><g><rect x="258" y="153" width="111" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="313.5" y="178.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="373" y="153" width="111" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="428.5" y="178.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">28</text></g><g><rect x="28" y="203" width="111" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="83.5" y="228.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">16</text></g><g><rect x="143" y="203" width="111" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="198.5" y="228.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">16</text></g><g><rect x="258" y="203" width="111" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="313.5" y="228.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><g><rect x="373" y="203" width="111" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="428.5" y="228.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">120</text></g><g><rect x="28" y="253" width="111" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="83.5" y="278.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">32</text></g><g><rect x="143" y="253" width="111" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="198.5" y="278.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">32</text></g><g><rect x="258" y="253" width="111" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="313.5" y="278.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">5</text></g><g><rect x="373" y="253" width="111" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="428.5" y="278.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">496</text></g><text x="28" y="330" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Visits: n     Halvings: stop when n = 1</text><text x="28" y="354" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Pairs: count each i &lt; j once; n(n − 1)/2</text><text x="24" y="388" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Equal-cost counted steps; these are not timings.</text><text x="24" y="410" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
