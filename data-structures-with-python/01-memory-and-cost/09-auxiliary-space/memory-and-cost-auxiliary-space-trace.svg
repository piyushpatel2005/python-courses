<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Extremes scan over unchanged input [4,7,2,9] keeps low/high pairs (4,4), (4,7), (2,7), (2,9)</title><desc id="desc">Extremes scan over unchanged input [4,7,2,9] keeps low/high pairs (4,4), (4,7), (2,7), (2,9). It returns (2,9) without copying the input; empty input returns None and a singleton returns its value twice.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Auxiliary space</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Input: four existing values (not auxiliary storage)</text><g><rect x="220" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="276.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="396.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="516.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">9</text></g><text x="636.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><text x="620" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">One-pass extremes: working state after each value (low, high)</text><g><rect x="145" y="360" width="190" height="85" rx="8" fill="#ede9fe" stroke="#172554" stroke-width="1.5"/><text x="240.0" y="396.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">value = 4</text><text x="240.0" y="422.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">(4, 4)</text></g><path data-connector="true" d="M 335 402 L 390 402" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="390" y="360" width="190" height="85" rx="8" fill="#ede9fe" stroke="#172554" stroke-width="1.5"/><text x="485.0" y="396.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">value = 7</text><text x="485.0" y="422.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">(4, 7)</text></g><path data-connector="true" d="M 580 402 L 635 402" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="635" y="360" width="190" height="85" rx="8" fill="#ede9fe" stroke="#172554" stroke-width="1.5"/><text x="730.0" y="396.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">value = 2</text><text x="730.0" y="422.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">(2, 7)</text></g><path data-connector="true" d="M 825 402 L 880 402" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="880" y="360" width="190" height="85" rx="8" fill="#ede9fe" stroke="#172554" stroke-width="1.5"/><text x="975.0" y="396.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">value = 9</text><text x="975.0" y="422.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">(2, 9)</text></g><g><rect x="350" y="530" width="540" height="75" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="620.0" y="574.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Return (2, 9); no copied input or growing output</text></g><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Only low, high, seen and the current value are retained: O(1) working slots.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Bounded-size value model. Empty input returns None; a singleton 4 returns (4, 4).</text></svg>
