<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Shallow copy: outer lists a and b point to the same inner lists X and Y</title><desc id="desc">Shallow copy: outer lists a and b point to the same inner lists X and Y. Appending 9 through b changes X to [3, 8, 9], visible through a too; outer lists remain distinct.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Shallow copies</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">After b = a.copy(): different outer lists, shared inner lists</text><g><rect x="150" y="180" width="300" height="70" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="300.0" y="222.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">a outer: slot 0 | slot 1</text></g><path data-connector="true" d="M 225 250 L 225 300 L 420 300 L 420 340" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 375 250 L 375 280 L 870 280 L 870 340" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="650" y="180" width="300" height="70" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="800.0" y="222.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">b outer: slot 0 | slot 1</text></g><path data-connector="true" d="M 725 250 L 725 300 L 420 300 L 420 340" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 875 250 L 875 280 L 870 280 L 870 340" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="320" y="340" width="200" height="70" rx="8" fill="#ede9fe" stroke="#172554" stroke-width="1.5"/><text x="420.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">inner X: [3, 8]</text></g><g><rect x="770" y="340" width="200" height="70" rx="8" fill="#ede9fe" stroke="#172554" stroke-width="1.5"/><text x="870.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">inner Y: [5]</text></g><path data-connector="true" d="M 420 410 L 420 485" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="270" y="485" width="300" height="85" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="420.0" y="521.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">b[0].append(9)</text><text x="420.0" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">X becomes [3, 8, 9]</text></g><g><rect x="700" y="485" width="350" height="85" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="875.0" y="521.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">a[0] is b[0]: True</text><text x="875.0" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">both see the same change</text></g><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Copying an empty list creates a distinct empty outer list.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Outer-slot arrows are references; the downward arrow below X shows a mutation, not a new object.</text></svg>
