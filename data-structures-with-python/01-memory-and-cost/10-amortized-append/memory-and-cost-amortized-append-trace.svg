<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">An explicit doubling model starts empty</title><desc id="desc">An explicit doubling model starts empty. Eight appends cost 1, 2, 3, 1, 5, 1, 1, 1 writes, totaling 15. Only full-capacity appends copy existing references.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Amortized append</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Append number (start empty)</text><g><rect x="130" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="186.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="186.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="250" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="306.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="306.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="370" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="426.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">3</text></g><text x="426.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="490" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="546.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="546.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="610" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="666.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">5</text></g><text x="666.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><g><rect x="730" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="786.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">6</text></g><text x="786.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">5</text><g><rect x="850" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="906.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="906.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">6</text><g><rect x="970" y="170" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="1026.0" y="207.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">8</text></g><text x="1026.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">7</text><text x="620" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Cost = copied references + one new write</text><g><rect x="130" y="350" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="186.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="186.0" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="250" y="350" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="306.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="306.0" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="370" y="350" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="426.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">3</text></g><text x="426.0" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="490" y="350" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="546.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="546.0" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="610" y="350" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="666.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">5</text></g><text x="666.0" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><g><rect x="730" y="350" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="786.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="786.0" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">5</text><g><rect x="850" y="350" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="906.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="906.0" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">6</text><g><rect x="970" y="350" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="1026.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="1026.0" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">7</text><g><rect x="200" y="520" width="380" height="85" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="390.0" y="556.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">8 appends: 15 total writes</text><text x="390.0" y="582.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">average = 15 / 8 = 1.875</text></g><g><rect x="660" y="520" width="380" height="85" rx="8" fill="#ffedd5" stroke="#172554" stroke-width="1.5"/><text x="850.0" y="556.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">capacity: 0 → 1 → 2 → 4 → 8</text><text x="850.0" y="582.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">resize copies: 0 + 1 + 2 + 4</text></g><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Illustrative doubling model, NOT the exact Python-list growth policy.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">A resize is expensive; the cost spread over many appends stays bounded per append.</text></svg>
