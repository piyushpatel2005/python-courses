<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="title desc"><title id="title">Splice after a known node</title><desc id="desc">Initially A links to C. First save C by setting new node B.next to A.next while A still links to C. Then set A.next to B, creating A to B to C.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="590" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Splice after a known node</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: A.next is C</text><g><rect x="40" y="95" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="320" y="95" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 125,116 L 320,116" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="194" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">1. B.next = A.next   (preserve C)</text><g><rect x="40" y="219" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="245.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="320" y="219" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="245.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><g><rect x="180" y="300" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="326.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><path data-connector="true" d="M 125,240 L 320,240" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 265,321 L 362,321 L 362,261" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="407" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">2. A.next = B</text><g><rect x="40" y="434" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="460.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="180" y="434" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="460.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><path data-connector="true" d="M 125,455 L 180,455" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="320" y="434" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="460.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 265,455 L 320,455" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="511" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">C.next is unchanged in every panel.</text><text x="24" y="548" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">New node B exists before either link assignment.</text><text x="24" y="570" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
