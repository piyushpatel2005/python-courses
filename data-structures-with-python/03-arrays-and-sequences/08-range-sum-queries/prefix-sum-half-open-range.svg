<svg xmlns="http://www.w3.org/2000/svg" width="500" height="405" viewBox="0 0 500 405" role="img" aria-labelledby="title desc"><title id="title">Prefix sums subtract a boundary</title><desc id="desc">Values [3, 8, 2, 6] have prefix sums [0, 3, 11, 13, 19]. Range [1, 3) includes values 8 and 2. Subtract prefix[1] from prefix[3] to get 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="405" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Prefix sums subtract a boundary</text><text x="25" y="75" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Values: select [1, 3)</text><g><rect x="45" y="110" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="93.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="93.0" y="101" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="145" y="110" width="96" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">8</text></g><text x="193.0" y="101" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="245" y="110" width="96" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="293.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><text x="293.0" y="101" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="345" y="110" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="393.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">6</text></g><text x="393.0" y="101" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="25" y="205" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Prefix: sum of values strictly before index</text><g><rect x="25" y="240" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><text x="68.0" y="231" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="115" y="240" width="86" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="158.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="158.0" y="231" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="205" y="240" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">11</text></g><text x="248.0" y="231" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="295" y="240" width="86" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="338.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="338.0" y="231" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><g><rect x="385" y="240" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="428.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">19</text></g><text x="428.0" y="231" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">4</text><text x="35" y="324" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#172033">prefix[3] − prefix[1] = 13 − 3 = 10</text><text x="24" y="363" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Left included, right excluded; prefix[0] = 0.</text><text x="24" y="385" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
