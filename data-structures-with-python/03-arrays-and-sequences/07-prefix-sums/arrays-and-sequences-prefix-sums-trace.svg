<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Building prefix sums for [4,1,7,2] gives [0,4,5,12,14]</title><desc id="desc">Building prefix sums for [4,1,7,2] gives [0,4,5,12,14]. Query [1,4) subtracts prefix[1] from prefix[4] to obtain 10; an empty range subtracts the same boundary from itself.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Prefix sums</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Input values: original array stays unchanged</text><g><rect x="280" y="165" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="336.0" y="202.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="336.0" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="400" y="165" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="456.0" y="202.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="456.0" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="520" y="165" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="576.0" y="202.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="576.0" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="640" y="165" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="696.0" y="202.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="696.0" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><text x="620" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Build prefix: prefix[0] = 0; prefix[i + 1] = prefix[i] + a[i]</text><g><rect x="220" y="345" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">0</text></g><text x="276.0" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="345" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="396.0" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="345" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">5</text></g><text x="516.0" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="345" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">12</text></g><text x="636.0" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="700" y="345" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="756.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">14</text></g><text x="756.0" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><g><rect x="290" y="530" width="660" height="75" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="620.0" y="574.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Query [1, 4): prefix[4] − prefix[1] = 14 − 4 = 10</text></g><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">The half-open query includes indices 1, 2, 3: 1 + 7 + 2 = 10.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Empty range [i, i) sums to 0; empty input has prefix [0]. Static prefixes must be updated after mutation.</text></svg>
