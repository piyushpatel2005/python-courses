<svg xmlns="http://www.w3.org/2000/svg" width="500" height="535" viewBox="0 0 500 535" role="img" aria-labelledby="title desc"><title id="title">Make room without losing a value</title><desc id="desc">Insert 19 at index 1 into a capacity-four buffer containing 13, 27, 41. First copy index 2 to 3, then 1 to 2, then write 19 at 1 and increase size from 3 to 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="535" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Make room without losing a value</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: size 3, capacity 4</text><g><rect x="45" y="100" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="93.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="93.0" y="91" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="145" y="100" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">27</text></g><text x="193.0" y="91" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="245" y="100" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="293.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><text x="293.0" y="91" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="345" y="100" width="96" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="393.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">·</text></g><text x="393.0" y="91" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="30" y="170" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">1. Copy index 2 to 3</text><g><rect x="45" y="200" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="93.0" y="226.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="93.0" y="191" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="145" y="200" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="226.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">27</text></g><text x="193.0" y="191" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="245" y="200" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="293.0" y="226.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><text x="293.0" y="191" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="345" y="200" width="96" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="393.0" y="226.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><text x="393.0" y="191" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="30" y="270" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">2. Copy index 1 to 2</text><g><rect x="45" y="300" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="93.0" y="326.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="93.0" y="291" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="145" y="300" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="326.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">27</text></g><text x="193.0" y="291" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="245" y="300" width="96" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="293.0" y="326.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">27</text></g><text x="293.0" y="291" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="345" y="300" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="393.0" y="326.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><text x="393.0" y="291" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="30" y="370" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">3. Write 19 at 1; size becomes 4</text><g><rect x="45" y="400" width="96" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="93.0" y="426.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="93.0" y="391" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="145" y="400" width="96" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="426.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">19</text></g><text x="193.0" y="391" font-family