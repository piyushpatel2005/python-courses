<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Reverse [3,7,4,8,2] by swapping indices 0 and 4, then 1 and 3</title><desc id="desc">Reverse [3,7,4,8,2] by swapping indices 0 and 4, then 1 and 3. States are [2,7,4,8,3] and [2,8,4,7,3]. Pointers meet at the unchanged middle value.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Reverse two pointers</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Before: left = 0, right = 4</text><g><rect x="220" y="155" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">3</text></g><text x="276.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="155" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="396.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="155" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="516.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="155" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">8</text></g><text x="636.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="700" y="155" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="756.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="756.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><text x="620" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Swap endpoints; left = 1, right = 3</text><g><rect x="220" y="315" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="276.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="315" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="396.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="315" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="516.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="315" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">8</text></g><text x="636.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="700" y="315" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="756.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">3</text></g><text x="756.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><text x="620" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Swap inner pair; left = right = 2 → stop</text><g><rect x="220" y="475" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="276.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="475" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">8</text></g><text x="396.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="475" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="516.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="475" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="636.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="700" y="475" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="756.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">3</text></g><text x="756.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Each swap fixes two positions; the middle value stays in place.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Empty: (left, right) = (0, -1). Singleton: (0, 0). Both perform zero swaps.</text></svg>
