<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Segment build</title><desc id="desc">Segment build 11 3 8 6 [0,1) -3 [1,2) 8 [2,3) 0 [3,4) [0,4) Before build: internal nodes are all 0. Build 3 = 8 + 0; then 2 = 6 + (−3). Build 1 = 3 + 8 = 11; return None. Empty build: root 0; padding stays 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Segment build</text><g><rect x="210" y="100" width="70" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="245.0" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">11</text></g><g><rect x="95" y="190" width="85" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="137.5" y="215.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="320" y="190" width="85" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="215.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">8</text></g><path data-connector="true" d="M 227,140 L 137,190" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 263,140 L 362,190" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="25" y="290" width="85" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="67.5" y="315.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">6</text></g><text x="67" y="356" font-family="Arial, sans-serif" font-size="14" text-anchor="mi