text x="366.0" y="379.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">9</text></g><text x="300" y="430" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">tree[6] covers [5, 6] → sum 9</text><g><rect x="30.0" y="445" width="267.0" height="52" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="163.5" y="479.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">14</text></g><text x="300" y="530" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">tree[4] covers [1, 4] → sum 14</text><text x="300" y="610" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Query indices: 7 → 6 → 4 → 0.</text><text x="300" y="640" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Each step subtracts lowbit(i) = i &amp; −i.</text><text x="300" y="670" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">5 + 9 + 14 = 28 = sum of positions 1…7.</text><text x="300" y="758" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
