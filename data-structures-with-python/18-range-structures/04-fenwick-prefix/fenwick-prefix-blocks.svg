<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img"><title>1-based tree cells intervals; prefix query decomposes index via subtract lowbit, arithmetic checked.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="780" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Fenwick: prefix(7) uses three blocks</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">1-based indices • intervals below are inclusive</text><g><rect x="30.0" y="110" width="64.5" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="62.25" y="142.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">4</text></g><text x="62.25" y="185" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#183153">1</text><g><rect x="97.5" y="110" width="64.5" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="129.75" y="142.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">1</text></g><text x="129.75" y="185" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#183153">2</text><g><rect x="165.0" y="110" width="64.5" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="197.25" y="142.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">7</text></g><text x="197.25" y="185" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#183153">3</text><g><rect x="232.5" y="110" width="64.5" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="264.75" y="142.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">2</text></g>