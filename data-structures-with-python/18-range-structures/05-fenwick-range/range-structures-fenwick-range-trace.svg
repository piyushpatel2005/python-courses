<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Fenwick range</title><desc id="desc">Fenwick range Values: select [1,3); exclude index 3 6 -3 8 2 tree indices 0 … 4 0 6 3 8 13 prefix(3): tree[3] + tree[2] = 8 + 3 = 11 prefix(1): tree[1] = 6 Return 11 − 6 = 5; state unchanged. [2,2) → 0; [0,4) → 13; [0,0) → 0</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Fenwick range</text><text x="24" y="84" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Values: select [1,3); exclude index 3</text><g><rect x="26" y="100" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">6</text></g><g><rect x="114" y="100" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">-3</text></g><g><rect x="202" y="100" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">8</text></g><g><rect x="290" y="100" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><text x="24" y="199" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">tree indices 0 … 4</text><g><rect x="26" y="215" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="114" y="215" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">6</text></g><g><rect x="202" y="215" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="290" y="215" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">8</text></g><g><rect x="378" y="215" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="420.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="24" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">prefix(3): tree[3] + tree[2] = 8 + 3 = 11</text><text x="24" y="369" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">prefix(1): tree[1] = 6</text><text x="24" y="398" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return 11 − 6 = 5; state unchanged.</text><text x="24" y="427" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">[2,2) → 0; [0,4) → 13; [0,0) → 0</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">All data intervals are half-open: [left,right).</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
