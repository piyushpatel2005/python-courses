<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">Return the first matching index</title><desc id="desc">Before: search target 7: [18, 7, 25, 7]. Unsorted input; scan from index 0. Index 0: 18 != 7; index 1: 7 == 7: [18, 7, 25, 7]. Return index 1; index 3 need not be read. After: the original list is unchanged: [18, 7, 25, 7]. Missing target 99 examines all 4; returns -1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Return the first matching index</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: search target 7</text><g><rect x="30.0" y="99" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="83.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="193.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">25</text></g><text x="303.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fi