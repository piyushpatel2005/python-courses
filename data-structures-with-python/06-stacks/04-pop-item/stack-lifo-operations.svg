<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-labelledby="title desc"><title id="title">The most recent value leaves first</title><desc id="desc">A stack initially contains bottom 14 and top 28. Pushing 35 puts it above 28. Popping returns 35 and restores top 28.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="450" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">The most recent value leaves first</text><text x="30" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before</text><text x="190" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">push(35)</text><text x="350" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">pop()</text><g><rect x="30" y="300" width="120" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="90.0" y="326.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">14</text></g><g><rect x="30" y="248" width="120" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="90.0" y="274.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">28</text></g><text x="30" y="233" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">top</text><g><rect x="190" y="300" width="120" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="250.0" y="326.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">14</text></g><g><rect x="190" y="248" width="120" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="250.0" y="274.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">28</text></g><g><rect x="190" y="196" width="120" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="250.0" y="222.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">35</text></g><text x="190" y="181" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">top</text><g><rect x="350" y="300" width="120" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="410.0" y="326.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">14</text></g><g><rect x="350" y="248" width="120" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="410.0" y="274.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">28</text></g><text x="350" y="233" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">top</text><text x="30" y="382" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">pop() returns 35; stored order is restored.</text><text x="24" y="408" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Bottom drawn low; only the top is added/removed.</text><text x="24" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
