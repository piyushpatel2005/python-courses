<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">Separate stacks, separate storage</title><desc id="desc">Before: new A and new B each own []: []. No top exists; len(A) = len(B) = 0. After A.push(17): A.items: [17]. A top = index 0; len(A) = 1. B.items remains empty: []. B has no top; len(B) = 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Separate stacks, separate storage</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: new A and new B each own []</text><g><rect x="40" y="92" width="120" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="117.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">No top exists; len(A) = len(B) = 0.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After A.push(17): A.items</text><g><rect x="30" y="211" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">17</text></g><text x="98.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">A top = index 0; len(A) = 1.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">B.items remains empty</text><g><rect x="40" y="316" width="120" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="341.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">B has no top; len(B) = 0.</text><text x="24" y="404" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">The list end is the top; there are no head/tail fields.</text><text x="24" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
