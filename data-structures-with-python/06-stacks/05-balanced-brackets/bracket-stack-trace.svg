<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="title desc"><title id="title">Store the closer you expect</title><desc id="desc">For ([ ]), scanning opening parenthesis and opening bracket pushes expected closers ) then ]. Closing bracket pops ], and closing parenthesis pops ), leaving empty. For ([), the closing parenthesis mismatches top ], so reject immediately.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="590" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Store the closer you expect</text><text x="24" y="75" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#172033">Valid input: ([])</text><text x="30" y="112" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Read</text><text x="170" y="112" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Expected closers (top at right)</text><g><rect x="30" y="130" width="70" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="65.0" y="155.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(</text></g><g><rect x="175" y="130" width="61" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="205.5" y="155.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">)</text></g><g><rect x="30" y="195" width="70" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="65.0" y="220.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[</text></g><g><rect x="175" y="195" width="61" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="205.5" y="220.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">)</text></g><g><rect x="240" y="195" width="61" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="270.5" y="220.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">]</text></g><g><rect x="30" y="260" width="70" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="65.0" y="285.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">]</text></g><g><rect x="175" y="260" width="61" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="205.5" y="285.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">)</text></g><g><rect x="30" y="325" width="70" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="65.0" y="350.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">)</text></g><text x="175" y="352" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">empty: balanced</text><text x="24" y="430" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#172033">Mismatch input: ([)</text><g><rect x="30" y="451" width="70" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="65.0" y="476.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">)</text></g><g><rect x="175" y="451" width="61" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="205.5" y="476.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">)</text></g><g><rect x="240" y="451" width="61" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="270.5" y="476.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">]</text></g><text x="24" y="524" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Read ) but top expects ]: reject, do not pop.</text><text x="24" y="548" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Only bracket characters shown; stack stores closers.</text><text x="24" y="570" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
