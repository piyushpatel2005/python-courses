<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">A minimum saved at each depth</title><desc id="desc">Before: (value, minimum so far): [&#x27;9,9&#x27;, &#x27;4,4&#x27;, &#x27;4,4&#x27;]. Each pair summarizes its entire prefix. push(7): store (7, 4): [&#x27;9,9&#x27;, &#x27;4,4&#x27;, &#x27;4,4&#x27;, &#x27;7,4&#x27;]. minimum() returns 4; push returns None. Pop 7, then pop one 4: [&#x27;9,9&#x27;, &#x27;4,4&#x27;]. The other 4 remains; minimum() is still 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">A minimum saved at each depth</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: (value, minimum so far)</text><g><rect x="30" y="99" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">9,9</text></g><text x="98.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="170" y="99" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4,4</text></g><text x="238.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="310" y="99" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="378.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4,4</text></g><text 