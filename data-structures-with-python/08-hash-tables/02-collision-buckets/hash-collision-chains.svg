<svg xmlns="http://www.w3.org/2000/svg" width="500" height="470" viewBox="0 0 500 470" role="img" aria-labelledby="title desc"><title id="title">A collision does not merge keys</title><desc id="desc">Using sum of Unicode code points modulo four, keys ab and ba both hash to bucket 3. The bucket keeps separate entries ab:12 and ba:90; equality checks distinguish them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="470" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">A collision does not merge keys</text><text x="24" y="74" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Teaching hash: sum(ord(c) for c in key) % 4</text><text x="24" y="107" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">&quot;ab&quot;: (97 + 98) % 4 = 3</text><text x="24" y="136" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">&quot;ba&quot;: (98 + 97) % 4 = 3</text><g><rect x="30" y="177" width="55" height="38" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="57.5" y="201.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><text x="115" y="203" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">empty</text><g><rect x="30" y="232" width="55" height="38" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="57.5" y="256.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><text x="115" y="258" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">empty</text><g><rect x="30" y="287" width="55" height="38" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="57.5" y="311.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><text x="115" y="313" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">empty</text><g><rect x="30" y="342" width="55" height="38" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="57.5" y="366.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="180" y="342" width="105" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="232.5" y="366.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">ab : 12</text></g><g><rect x="355" y="342" width="110" height="38" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="410.0" y="366.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">ba : 90</text></g><path data-connector="true" d="M 85,361 L 180,361" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 285,361 L 355,361" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="411" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Lookup &quot;ba&quot;: skip unequal &quot;ab&quot;, then match.</text><text x="24" y="428" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Illustrative hash only; not Python’s string hash.</text><text x="24" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
