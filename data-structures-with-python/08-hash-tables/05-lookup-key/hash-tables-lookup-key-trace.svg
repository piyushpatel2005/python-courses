<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">Lookup compares keys, not hashes</title><desc id="desc">get(E): bucket 1 of 4: [&#x27;A:7&#x27;, &#x27;E:9&#x27;]. A != E: skip first pair; E == E: match. Returned value: [9]. Do not return the first value, 7. After: bucket 1 is unchanged: [&#x27;A:7&#x27;, &#x27;E:9&#x27;]. size stays 2; pair order and values stay intact.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Lookup compares keys, not hashes</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">get(E): bucket 1 of 4</text><g><rect x="30" y="99" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A:7</text></g><g><rect x="170" y="99" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">E:9</text></g><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">A != E: skip first pair; E == E: match.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Returned value</text><g><rect x="30" y="211" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">9</text></g><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Do not return the first value, 7.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After: bucket 1 is unchanged</text><g><rect x="30" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A:7</text></g><g><rect x="170" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">E:9</text></g><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">size stays 2; pair order and values stay intact.</text><text x="24" y="404" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">get(I): same bucket, no equal key → KeyError.</text><text x="24" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
