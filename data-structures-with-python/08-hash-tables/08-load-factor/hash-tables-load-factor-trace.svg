<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">Load counts keys, not busy buckets</title><desc id="desc">Before: n = 2 keys, m = 4 buckets: [&#x27;[]&#x27;, &#x27;A:7 E:9&#x27;, &#x27;[]&#x27;, &#x27;[]&#x27;]. Only bucket 1 is occupied; load = 2 / 4 = 0.5. Insert I:12 into the same bucket: [&#x27;A:7&#x27;, &#x27;E:9&#x27;, &#x27;I:12&#x27;]. n = 3; m = 4; load = 3 / 4 = 0.75. Update E:9 to E:20: [&#x27;A:7&#x27;, &#x27;E:20&#x27;, &#x27;I:12&#x27;]. n stays 3; load remains 0.75.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Load counts keys, not busy buckets</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: n = 2 keys, m = 4 buckets</text><g><rect x="30.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[]</text></g><text x="83.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="99" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A:7 E:9</text></g><text x="193.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[]</text></g><text x="303.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="360.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="413.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[]</text></g><text x="413.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Only bucket 1 is occupied; load = 2 / 4 = 0.5.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Insert I:12 into the same bucket</text><g><rect x="30" y="211" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A:7</text></g><g><rect x="170" y="211" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">E:9</text></g><g><rect x="310" y="211" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="378.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">I:12</text></g><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">n = 3; m = 4; load = 3 / 4 = 0.75.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Update E:9 to E:20</text><g><rect x="30" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A:7</text></g><g><rect x="170" y="323" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">E:20</text></g><g><rect x="310" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="378.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">I:12</text></g><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">n stays 3; load remains 0.75.</text><text x="24" y="404" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Reading load_factor() never triggers a resize.</text><text x="24" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
