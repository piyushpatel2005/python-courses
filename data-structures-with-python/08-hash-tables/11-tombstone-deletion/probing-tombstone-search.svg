<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">A tombstone keeps the probe alive</title><desc id="desc">With capacity five, linear probing, and integer hash k modulo five, keys 7, 12, and 17 occupy slots 2, 3, and 4. Deleting 12 leaves a tombstone in slot 3. Lookup of 17 checks 2, continues through 3, and matches 4. A miss for 22 continues to never-used slot 0 and stops.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">A tombstone keeps the probe alive</text><text x="24" y="75" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">h(k) = k % 5; linear probing; capacity 5</text><text x="24" y="112" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before deletion</text><g><rect x="25" y="147" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="173.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="68.0" y="138" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="115" y="147" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="158.0" y="173.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="158.0" y="138" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="205" y="147" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="173.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="248.0" y="138" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="295" y="147" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="338.0" y="173.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">12</text></g><text x="338.0" y="138" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><g><rect x="385" y="147" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="428.0" y="173.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">17</text></g><text x="428.0" y="138" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">4</text><text x="24" y="238" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After deleting key 12</text><g><rect x="25" y="273" width="86" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="299.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="68.0" y="264" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="115" y="273" width="86" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="158.0" y="299.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="158.0" y="264" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="205" y="273" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="299.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="248.0" y="264" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="295" y="273" width="86" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="338.0" y="299.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">DEL</text></g><text x="338.0" y="264" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><g><rect x="385" y="273" width="86" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="428.0" y="299.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">17</text></g><text x="428.0" y="264" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">4</text><text x="24" y="364" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Find 17: slot 2 → slot 3 → slot 4: found</text><text x="24" y="407" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Find 22: 2 → 3 → 4 → 0: stop at empty</text><text x="24" y="462" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">DEL: continue. Never-used empty: stop.</text><text x="24" y="495" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Replacing DEL with empty would hide key 17.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Empty means never used; DEL means deleted.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
