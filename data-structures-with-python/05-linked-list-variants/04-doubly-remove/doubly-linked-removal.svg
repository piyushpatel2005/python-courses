<svg xmlns="http://www.w3.org/2000/svg" width="500" height="460" viewBox="0 0 500 460" role="img" aria-labelledby="title desc"><title id="title">Reconnect both directions</title><desc id="desc">Before deletion, A and B and C have reciprocal next and prev links. Removing middle node B sets A.next to C and C.prev to A; B is detached by clearing both of its links.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="460" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Reconnect both directions</text><text x="24" y="74" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: next → above; ← prev below</text><g><rect x="40" y="100" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="180" y="100" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><path data-connector="true" d="M 125,115 L 180,115" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 180,129 L 125,129" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="320" y="100" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 265,115 L 320,115" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 320,129 L 265,129" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="209" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After: A.next = C; C.prev = A</text><g><rect x="40" y="238" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="264.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="320" y="238" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="264.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 125,253 L 320,253" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 320,267 L 125,267" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="180" y="332" width="85" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="358.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><text x="24" y="399" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Detached B: prev = next = None</text><text x="24" y="418" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Middle-node case; head and tail stay unchanged.</text><text x="24" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
