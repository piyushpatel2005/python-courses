153" stroke-width="1.5"/><text x="440.0" y="248.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">4</text></g><g><rect x="37.0" y="300" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="70.0" y="333.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">9</text></g><g><rect x="207.0" y="300" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="240.0" y="333.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">7</text></g><g><rect x="332.0" y="300" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="365.0" y="333.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">8</text></g><text x="300" y="400" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">2. Swap with smaller child 4</text><path d="M 300 470 L 160 505" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 470 L 440 505" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 160 555 L 70 590" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 160 555 L 240 590" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 440 555 L 365 590" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="267.0" y="420" width="66" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="453.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">4</text></g><g><rect x="127.0" y="505" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="160.0" y="538.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle