<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Union by size</title><desc id="desc">Union by size Before parent; root sizes: 2 → 3, 3 → 2 1 2 2 3 3 After compression and linking smaller root 2 2 2 2 3 find_compressed(0): 0 → 1 → 2 Rewrite parent[0] = 2 (1 already points to 2). Root 3 (size 2) links to root 2 (size 3). Return True; size[2] = 5; 4 still points to 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Union by size</text><text x="24" y="79" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before parent; root sizes: 2 → 3, 3 → 2</text><g><rect x="26" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="114" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="202" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="290" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="378" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="420.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="24" y="224" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After compression and linking smaller root</text><g><rect x="26" y="240" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="114" y="240" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="202" y="240" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="290" y="240" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="378" y="240" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="420.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="24" y="365" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">find_compressed(0): 0 → 1 → 2</text><text x="24" y="394" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Rewrite parent[0] = 2 (1 already points to 2).</text><text x="24" y="423" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Root 3 (size 2) links to root 2 (size 3).</text><text x="24" y="452" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return True; size[2] = 5; 4 still points to 3.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Parent links encode components, not original edges.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
