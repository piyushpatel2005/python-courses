<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Dsu state</title><desc id="desc">Dsu state parent: each item is its own root 0 1 2 3 size: valid at roots 1 1 1 1 Four singleton components; no links shared. DSU(0): parent = []; size = []. IDs outside [0,4) are invalid.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Dsu state</text><text x="24" y="94" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">parent: each item is its own root</text><g><rect x="26" y="110" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="114" y="110" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="202" y="110" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="290" y="110" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="24" y="224" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">size: valid at roots</text><g><rect x="26" y="240" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="114" y="240" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="202" y="240" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="290" y="240" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="266.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><text x="24" y="380" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Four singleton components; no links shared.</text><text x="24" y="409" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">DSU(0): parent = []; size = [].</text><text x="24" y="438" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">IDs outside [0,4) are invalid.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Parent links encode components, not original edges.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
