<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Detect redundant edge</title><desc id="desc">Detect redundant edge 1 3 2 closing edge (2,1) (1,3): merge → True (3,2): merge → True (2,1): same root → False; stop here Return edge (2,1); (0,4) is not processed. No redundant edge / empty edges → None</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Detect redundant edge</text><g><rect x="35" y="110" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="80.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="190" y="110" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="235.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><path data-connector="true" d="M 125,131 L 190,131" fill="none" stroke="#526279" stroke-width="1.8"/><g><rect x="345" y="110" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="390.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><path data-connector="true" d="M 280,131 L 345,131" fill="none" stroke="#526279" stroke-width="1.8"/><path data-connector="true" d="M 390,152 L 390,220 L 80,220 L 80,152" fill="none" stroke="#526279" stroke-width="1.8"/><text x="170" y="248" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">closing edge (2,1)</text><text x="24" y="310" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">(1,3): merge → True</text><text x="24" y="339" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">(3,2): merge → True</text><text x="24" y="368" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">(2,1): same root → False; stop here</text><text x="24" y="397" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return edge (2,1); (0,4) is not processed.</text><text x="24" y="426" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">No redundant edge / empty edges → None</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Lines are undirected cables, not parent links.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
