<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Union components</title><desc id="desc">Union components Before parent 0 1 2 3 After union(1,3): root 1 links to root 3 0 3 2 3 size[3] becomes 2; others are unchanged 1 1 1 2 Return True; repeated union → False. Only root sizes are authoritative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Union components</text><text x="24" y="79" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before parent</text><g><rect x="26" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="114" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="202" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="290" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="24" y="199" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After union(1,3): root 1 links to root 3</text><g><rect x="26" y="215" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="114" y="215" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="202" y="215" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="290" y="215" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="241.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="24" y="319" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">size[3] becomes 2; others are unchanged</text><g><rect x="26" y="335" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="361.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="114" y="335" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="361.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="202" y="335" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="361.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="290" y="335" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="361.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><text x="24" y="445" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return True; repeated union → False.</text><text x="24" y="474" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Only root sizes are authoritative.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Parent links encode components, not original edges.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
