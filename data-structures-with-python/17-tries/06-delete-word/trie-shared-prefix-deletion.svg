<svg xmlns="http://www.w3.org/2000/svg" width="600" height="910" viewBox="0 0 600 910" role="img"><title>Two words sharing prefix; clear terminal flag/prune only unused suffix without deleting other word.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="910" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Delete “map”, preserve “mat”</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Node labels are edge characters • ★ marks a word</text><text x="110" y="120" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">Before</text><path d="M 300 175 L 300 210" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 260 L 300 295" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 345 L 190 380" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 345 L 410 380" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="257.5" y="125" width="85" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="158.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">root</text></g><g><rect x="257.5" y="210" width="85" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="243.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">m</text></g><g><rect x="257.5" y="295" width="85" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="328.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">a</text></g><g><rect x="147.5" y="380" width="85" height="50" rx="8" fill="#fee2e2" stroke="#183153" stroke-width="1.5"/><text x="190.0" y="413.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">p ★</text></g><g><rect x="367.5" y="380" width="85" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="410.0" y="413.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">t ★</text></g><text x="110" y="480" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">After deleting map</text><path d="M 300 535 L 300 570" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 620 L 300 655" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 705 L 410 740" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="257.5" y="485" width="85" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="518.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">root</text></g><g><rect x="257.5" y="570" width="85" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="603.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">m</text></g><g><rect x="257.5" y="655" width="85" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="688.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">a</text></g><g><rect x="367.5" y="740" width="85" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="410.0" y="773.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">t ★</text></g><text x="300" y="825" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Prune unused p only; m and a still lead to mat.</text><text x="300" y="888" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
