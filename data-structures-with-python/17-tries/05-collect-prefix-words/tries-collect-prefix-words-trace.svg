<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Collect prefix words</title><desc id="desc">Collect prefix words root b e e * t * * collect(&quot;be&quot;): visit terminal be first Then sorted child e; then sorted child t Return [&#x27;be&#x27;, &#x27;bee&#x27;, &#x27;bet&#x27;] collect(&quot;bo&quot;) → []; collect(&quot;&quot;) → all words No trie links or terminal flags change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Collect prefix words</text><g><rect x="25" y="100" width="75" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="62.5" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">root</text></g><g><rect x="145" y="100" width="75" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="182.5" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">b</text></g><g><rect x="265" y="100" width="75" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="302.5" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">e</text></g><path data-connector="true" d="M 100,120 L 145,120" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 220,120 L 265,120" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="385" y="100" width="85" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="427.5" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">e *</text></g><path data-connector="true" d="M 340,120 L 385,120" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="385" y="185" width="85" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="427.5" y="210.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">t *</text></g><path data-connector="true" d="M 302,140 L 302,205 L 385,205" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270" y="86" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">*</text><text x="24" y="300" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">collect(&quot;be&quot;): visit terminal be first</text><text x="24" y="329" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Then sorted child e; then sorted child t</text><text x="24" y="358" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return [&#x27;be&#x27;, &#x27;bee&#x27;, &#x27;bet&#x27;]</text><text x="24" y="387" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">collect(&quot;bo&quot;) → []; collect(&quot;&quot;) → all words</text><text x="24" y="416" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">No trie links or terminal flags change.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Edges are characters; * marks a stored whole word.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
