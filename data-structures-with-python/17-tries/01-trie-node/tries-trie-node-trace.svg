<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Trie node</title><desc id="desc">Trie node node A node B child b A.children = {&quot;b&quot;: child}; terminal = False B.children = {}; terminal = False Each node owns a distinct child dictionary. A fresh node does not mark a complete word.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Trie node</text><g><rect x="35" y="110" width="150" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="110.0" y="138.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">node A</text></g><g><rect x="300" y="110" width="150" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="375.0" y="138.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">node B</text></g><g><rect x="35" y="230" width="150" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="110.0" y="258.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">child b</text></g><path data-connector="true" d="M 110,155 L 110,230" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="350" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">A.children = {&quot;b&quot;: child}; terminal = False</text><text x="24" y="379" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">B.children = {}; terminal = False</text><text x="24" y="408" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Each node owns a distinct child dictionary.</text><text x="24" y="437" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">A fresh node does not mark a complete word.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Edges are characters; * marks a stored whole word.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
