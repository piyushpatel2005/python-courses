 x="24" y="450" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return None; * marks a terminal node.</text><text x="24" y="479" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">insert(&quot;&quot;) marks root; duplicate is idempotent.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Edges are characters; * marks a stored whole word.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
