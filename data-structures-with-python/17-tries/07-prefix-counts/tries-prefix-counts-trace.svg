<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Prefix counts</title><desc id="desc">Prefix counts root b e e * t * * count_prefix(&quot;be&quot;): count terminal nodes be: +1; bee: +1; bet: +1 → return 3 Duplicate insert(&quot;bee&quot;) adds no word. Missing prefix → 0; empty prefix → 3 State unchanged; root is not terminal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Prefix counts</text><g><rect x="25" y="100" width="75" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="62.5" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">root</text></g><g><rect x="145" y="100" width="75" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="182.5" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">b</text></g><g><rect x="265" y="100" width="75" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="302.5" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">e</text></g><path data-connector="true" d="M 100,120 L 145,120" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 220,120 L 265,120" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="385" y="100" width="85" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="427.5" y="125.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">e *</text></g><path data-connector="true" d="M 340,120 L 385,120" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="385" y="185" width="85" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="427.5" y="210.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">t *</text></g><path data-connector="true" d="M 302,140 L 302,205 L 385,205" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270" y="86" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">*</text><text x="24" y="300" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">count_prefix(&quot;be&quot;): count terminal nodes</text><text x="24" y="329" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">be: +1; bee: +1; bet: +1 → return 3</text><text x="24" y="358" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Duplicate insert(&quot;bee&quot;) adds no word.</text><text x="24" y="387" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Missing prefix → 0; empty prefix → 3</text><text x="24" y="416" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">State unchanged; root is not terminal.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Edges are characters; * marks a stored whole word.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
