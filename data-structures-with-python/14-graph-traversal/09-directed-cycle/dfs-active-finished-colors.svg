<svg xmlns="http://www.w3.org/2000/svg" width="600" height="790" viewBox="0 0 600 790" role="img"><title>Directed back edge to active ancestor versus edge to finished node, separate cases.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="790" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">DFS: active is not finished</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Directed edges • active = orange; finished = green</text><text x="300" y="115" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">Case A: back edge proves a directed cycle</text><g><rect x="67.0" y="165" width="66" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="198.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">U</text></g><g><rect x="267.0" y="165" width="66" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="198.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">V</text></g><g><rect x="467.0" y="165" width="66" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="500.0" y="198.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">W</text></g><path d="M 133 190 L 267 190" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 333 190 L 467 190" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 500 215 L 500 290 L 100 290 L 100 215" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><text x="300" y="335" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Active recursion path: U → V → W.</text><text x="300" y="365" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">W → U reaches an active ancestor.</text><text x="300" y="440" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">Case B: edge to a finished node is not enough</text><g><rect x="67.0" y="495" width="66" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="528.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">U</text></g><g><rect x="267.0" y="495" width="66" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="528.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">V</text></g><g><rect x="467.0" y="495" width="66" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="500.0" y="528.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">X</text></g><path d="M 133 520 L 267 520" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 333 520 L 467 520" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 100 495 L 100 465 L 500 465 L 500 495" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><text x="300" y="635" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">U explored X first; X has already returned.</text><text x="300" y="665" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Now U explores V; V → X is not a back edge.</text><text x="300" y="695" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Case B is acyclic: U→V, U→X, V→X.</text><text x="300" y="768" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
