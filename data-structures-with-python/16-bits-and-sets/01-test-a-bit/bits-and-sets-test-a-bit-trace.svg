<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Test a bit</title><desc id="desc">Test a bit value = 45; bit positions 5 … 0 1 0 1 1 0 1 position 3: mask = 1 &lt;&lt; 3 0 0 1 0 0 0 45 &gt;&gt; 3 = 5; 5 &amp; 1 = 1 read_bit(45, 3) returns integer 1 position 1 returns 0; position 6 returns 0 Input integer remains 45; zero reads as 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Test a bit</text><text x="24" y="84" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">value = 45; bit positions 5 … 0</text><g><rect x="26.0" y="100" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="61.333333333333336" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="100.66666666666667" y="100" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="136.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="175.33333333333334" y="100" width="70.66666666666667" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="210.66666666666669" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="250.0" y="100" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="285.3333333333333" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="324.6666666666667" y="100" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="360.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="399.33333333333337" y="100" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="434.6666666666667" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><text x="24" y="189" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">position 3: mask = 1 &lt;&lt; 3</text><g><rect x="26.0" y="205" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="61.333333333333336" y="231.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="100.66666666666667" y="205" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="136.0" y="231.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="175.33333333333334" y="205" width="70.66666666666667" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="210.66666666666669" y="231.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="250.0" y="205" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="285.3333333333333" y="231.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="324.6666666666667" y="205" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="360.0" y="231.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="399.33333333333337" y="205" width="70.66666666666667" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="434.6666666666667" y="231.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><text x="24" y="330" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">45 &gt;&gt; 3 = 5; 5 &amp; 1 = 1</text><text x="24" y="359" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">read_bit(45, 3) returns integer 1</text><text x="24" y="388" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">position 1 returns 0; position 6 returns 0</text><text x="24" y="417" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Input integer remains 45; zero reads as 0.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Queries return values; state is shown separately.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
