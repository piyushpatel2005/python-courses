<svg xmlns="http://www.w3.org/2000/svg" width="500" height="558" viewBox="0 0 500 558" role="img" aria-labelledby="title desc"><title id="title">Selection sort grows a final prefix</title><desc id="desc">Before: unsorted input: [18, 7, 13, 4]. Select a minimum for each prefix boundary. i = 0: swap positions 0 and 3: [4, 7, 13, 18]. Prefix [0, 1) is now final. i = 1: swap positions 1 and 1: [4, 7, 13, 18]. Prefix [0, 2) is now final. i = 2: swap positions 2 and 2: [4, 7, 13, 18]. Prefix [0, 3) is now final.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="558" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Selection sort grows a final prefix</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: unsorted input</text><g><rect x="30.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="83.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="193.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="303.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="360.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="413.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="413.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Select a minimum for each prefix boundary.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">i = 0: swap positions 0 and 3</text><g><rect x="30.0" y="211" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="83.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="211" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="193.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="211" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="303.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="360.0" y="211" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="413.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="413.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Prefix [0, 1) is now final.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">i = 1: swap positions 1 and 1</text><g><rect x="30.0" y="323" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="83.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="323" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="193.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="323" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="303.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="360.0" y="323" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="413.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="413.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Prefix [0, 2) is now final.</text><text x="24" y="408" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">i = 2: swap positions 2 and 2</text><g><rect x="30.0" y="435" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="83.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="435" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="193.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="435" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="303.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="360.0" y="435" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="413.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="413.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="24" y="496" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Prefix [0, 3) is now final.</text><text x="24" y="516" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Even a self-swap leaves the invariant intact.</text><text x="24" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
