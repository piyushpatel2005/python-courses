<svg xmlns="http://www.w3.org/2000/svg" width="500" height="558" viewBox="0 0 500 558" role="img" aria-labelledby="title desc"><title id="title">A sorted prefix can still shift later</title><desc id="desc">Before: prefix [0, 1) is sorted: [18, 7, 13, 4]. Insert each next value into the sorted prefix. Insert saved key 7 from index 1: [7, 18, 13, 4]. Prefix [0, 2) is sorted, not necessarily final. Insert saved key 13 from index 2: [7, 13, 18, 4]. Prefix [0, 3) is sorted, not necessarily final. Insert saved key 4 from index 3: [4, 7, 13, 18]. Prefix [0, 4) is sorted, not necessarily final.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="558" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">A sorted prefix can still shift later</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: prefix [0, 1) is sorted</text><g><rect x="30.0" y="99" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="83.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="193.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="303.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="360.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="413.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="413.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Insert each next value into the sorted prefix.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Insert saved key 7 from index 1</text><g><rect x="30.0" y="211" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="83.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="211" width="106.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="193.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="211" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="303.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="360.0" y="211" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="413.0" y="235.6" font-family="Aria