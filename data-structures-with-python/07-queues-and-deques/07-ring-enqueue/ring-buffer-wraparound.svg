<svg xmlns="http://www.w3.org/2000/svg" width="500" height="480" viewBox="0 0 500 480" role="img" aria-labelledby="title desc"><title id="title">Wrap the index, not the FIFO order</title><desc id="desc">A ring buffer of capacity five has head 3 and size 3, storing 41 at index 3, 52 at 4, and 63 at 0. Enqueue 74 writes index (3+3) modulo 5 = 1, and size becomes 4. Logical order is 41, 52, 63, 74.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="480" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Wrap the index, not the FIFO order</text><text x="24" y="74" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: head = 3, size = 3, capacity = 5</text><g><rect x="25" y="115" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="141.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">63</text></g><text x="68.0" y="106" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="115" y="115" width="86" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="158.0" y="141.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">·</text></g><text x="158.0" y="106" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="205" y="115" width="86" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="141.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">·</text></g><text x="248.0" y="106" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="295" y="115" width="86" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="338.0" y="141.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><text x="338.0" y="106" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><g><rect x="385" y="115" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="428.0" y="141.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">52</text></g><text x="428.0" y="106" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">4</text><text x="24" y="201" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Write index = (head + size) % capacity</text><text x="24" y="232" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#172033">(3 + 3) % 5 = 1; enqueue 74</text><g><rect x="25" y="280" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="306.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">63</text></g><text x="68.0" y="271" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="115" y="280" width="86" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="158.0" y="306.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">74</text></g><text x="158.0" y="271" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="205" y="280" width="86" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="306.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">·</text></g><text x="248.0" y="271" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="295" y="280" width="86" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="338.0" y="306.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><text x="338.0" y="271" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><g><rect x="385" y="280" width="86" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="428.0" y="306.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">52</text></g><text x="428.0" y="271" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">4</text><text x="24" y="363" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After: head = 3, size = 4</text><text x="24" y="400" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#172033">FIFO order: 41 → 52 → 63 → 74</text><text x="24" y="438" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">· = unused slot; head marks the next removal.</text><text x="24" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
