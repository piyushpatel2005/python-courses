<svg xmlns="http://www.w3.org/2000/svg" width="500" height="558" viewBox="0 0 500 558" role="img" aria-labelledby="title desc"><title id="title">Enqueue links the old rear first</title><desc id="desc">Before enqueue(41): [23]. head = tail = node 23; size = 1. 1. old_tail.next = new node: [23, 41]. head = 23; tail still = 23; new.next = None. 2. tail = new; size += 1: [23, 41]. head = 23; tail = 41; size = 2; return None. Empty case: enqueue(41): [41]. head = tail = new node; size 0 → 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="558" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Enqueue links the old rear first</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before enqueue(41)</text><g><rect x="40" y="92" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="118.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">23</text></g><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">head = tail = node 23; size = 1.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">1. old_tail.next = new node</text><g><rect x="40" y="204" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="230.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">23</text></g><g><rect x="180" y="204" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="230.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><path data-connector="true" d="M 125,225 L 180,225" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">head = 23; tail still = 23; new.next = None.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">2. tail = new; size += 1</text><g><rect x="40" y="316" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="342.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">23</text></g><g><rect x="180" y="316" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="342.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><path data-connector="true" d="M 125,337 L 180,337" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">head = 23; tail = 41; size = 2; return None.</text><text x="24" y="408" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Empty case: enqueue(41)</text><g><rect x="40" y="428" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="454.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">41</text></g><text x="24" y="496" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">head = tail = new node; size 0 → 1.</text><text x="24" y="516" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Preserve the old tail until its next link is assigned.</text><text x="24" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
