<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img"><title>Same small graph as vertex/edge figure, adjacency lists and matrix, consistent undirected symmetry.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="820" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Same graph, three representations</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Undirected • unweighted • no self-loops</text><path d="M 203 145 L 397 145" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 170 170 L 170 275" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 430 170 L 430 275" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 203 300 L 397 300" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="137.0" y="120" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="170.0" y="153.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">P</text></g><g><rect x="397.0" y="120" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="430.0" y="153.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">Q</text></g><g><rect x="137.0" y="275" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="170.0" y="308.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">R</text></g><g><rect x="397.0" y="275" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="430.0" y="308.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">S</text></g><text x="145" y="390" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">Adjacency lists</text><text x="420" y="390" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">Matrix: P Q R S</text><text x="145" y="450" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">P: Q, R</text><text x="300" y="450" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">P</text><g><rect x="325" y="420" width="52" height="48" rx="8" fill="#f1f5f9" stroke="#183153" stroke-width="1.5"/><text x="351.0" y="451.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">0</text></g><g><rect x="382" y="420" width="52" height="48" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="408.0" y="451.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">1</text></g><g><rect x="439" y="420" width="52" height="48" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="465.0" y="451.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">1</text></g><g><rect x="496" y="420" width="52" height="48" rx="8" fill="#f1f5f9" stroke="#183153" stroke-width="1.5"/><text x="522.0" y="451.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">0</text></g><text x="145" y="515" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">Q: P, S</text><text x="300" y="515" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">Q</text><g><rect x="325" y="485" width="52" height="48" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="351.0" y="516.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">1</text></g><g><rect x="382" y="485" width="52