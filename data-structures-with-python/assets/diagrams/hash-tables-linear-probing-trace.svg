<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">A lookup follows the wrapped probe</title><desc id="desc">Before get(K): capacity 4: [&#x27;G:8&#x27;, &#x27;K:6&#x27;, None, &#x27;C:4&#x27;]. Home = ord(K) % 4 = 3. Probe 3 → 0 → 1: [&#x27;G:8&#x27;, &#x27;K:6&#x27;, None, &#x27;C:4&#x27;]. C != K; G != K; K matches → return 6. After: slots remain unchanged: [&#x27;G:8&#x27;, &#x27;K:6&#x27;, None, &#x27;C:4&#x27;]. Missing O probes 3, 0, 1, 2; None ends search.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">A lookup follows the wrapped probe</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before get(K): capacity 4</text><g><rect x="30.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">G:8</text></g><text x="83.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">K:6</text></g><text x="193.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">None<