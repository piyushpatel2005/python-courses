<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Complete nine-call naive Fibonacci tree for F(4), returning 3</title><desc id="desc">Complete nine-call naive Fibonacci tree for F(4), returning 3. F(3) returns 2 and F(2) returns 1. Two orange F(2) subtrees repeat the same base-case work.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Fibonacci tree</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><path data-connector="true" d="M 625 190 L 375 245" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 625 190 L 875 245" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 375 310 L 225 370" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 375 310 L 525 370" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 875 310 L 775 370" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 875 310 L 1025 370" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 225 435 L 125 505" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 225 435 L 325 505" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="550" y="125" width="150" height="65" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="625.0" y="164.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(4) = 3</text></g><g><rect x="300" y="245" width="150" height="65" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="375.0" y="284.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(3) = 2</text></g><g><rect x="800" y="245" width="150" height="65" rx="8" fill="#ffedd5" stroke="#172554" stroke-width="1.5"/><text x="875.0" y="284.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(2) = 1</text></g><g><rect x="150" y="370" width="150" height="65" rx="8" fill="#ffedd5" stroke="#172554" stroke-width="1.5"/><text x="225.0" y="409.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(2) = 1</text></g><g><rect x="450" y="370" width="150" height="65" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="525.0" y="409.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(1) = 1</text></g><g><rect x="700" y="370" width="150" height="65" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="775.0" y="409.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(1) = 1</text></g><g><rect x="950" y="370" width="150" height="65" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="1025.0" y="409.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(0) = 0</text></g><g><rect x="50" y="505" width="150" height="65" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="125.0" y="544.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(1) = 1</text></g><g><rect x="250" y="505" width="150" height="65" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="325.0" y="544.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(0) = 0</text></g><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">F(0) = 0; F(1) = 1. Both orange F(2) calls repeat the same work.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Value lane shown. fibonacci_tree(4) returns (3, 9): value 3 and nine calls, including base cases.</text></svg>
