<svg xmlns="http://www.w3.org/2000/svg" width="500" height="530" viewBox="0 0 500 530" role="img" aria-labelledby="title desc"><title id="title">Reverse one link; keep the suffix</title><desc id="desc">Before one reversal iteration, prev is A, current is B, and saved next is C. A.next is None and B.next is C. After setting B.next to A and advancing, prev is B and current is C; the suffix beginning at C remains reachable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="530" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Reverse one link; keep the suffix</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: save next = current.next</text><text x="40" y="112" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">prev</text><text x="180" y="112" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">current</text><text x="320" y="112" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">next</text><g><rect x="40" y="130" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="156.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="180" y="130" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="156.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><g><rect x="320" y="130" width="85" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="156.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 265,151 L 320,151" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="40" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">A.next = None</text><text x="180" y="232" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">B.next = C</text><text x="24" y="294" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After: B.next = A; advance both pointers</text><text x="180" y="336" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">prev</text><text x="320" y="336" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">current</text><g><rect x="40" y="353" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="379.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="180" y="353" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="379.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><g><rect x="320" y="353" width="85" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="379.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 180,374 L 125,374" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="40" y="425" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">A.next = None</text><text x="24" y="463" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Saved C is now current; its links are untouched.</text><text x="24" y="488" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Only the current node’s next link changes this turn.</text><text x="24" y="510" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
