<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">A teaching array buffer with capacity four contains 4 and 9</title><desc id="desc">A teaching array buffer with capacity four contains 4 and 9. Appending 6 writes unused index 2 and changes size from two to three, leaving capacity and prior cells unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Append with capacity</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Before: size = 2, capacity = 4</text><g><rect x="220" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="276.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">9</text></g><text x="396.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">unused</text></g><text x="516.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">unused</text></g><text x="636.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><path data-connector="true" d="M 516 265 L 516 350" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><text x="820" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">write slot[size] = 6; then size += 1</text><text x="620" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">After append(6): size = 3, capacity = 4</text><g><rect x="220" y="410" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="447.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="276.0" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="410" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="447.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">9</text></g><text x="396.0" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="410" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="447.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">6</text></g><text x="516.0" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="410" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="447.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">unused</text></g><text x="636.0" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Only one slot is written; existing values do not move.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Teaching buffer model. Empty with spare capacity writes index 0; a full buffer must grow first.</text></svg>
