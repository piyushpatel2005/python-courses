<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">List state</title><desc id="desc">List state. Before: empty. After: A: 4. Empty → first node: head and tail both reference A; size: 0 → 1. Singleton: head is tail; tail.next is None. Empty: both endpoints are None.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">List state</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">BEFORE</text><g><rect x="440" y="190" width="360" height="70" rx="8" fill="#ffedd5" stroke="#172554" stroke-width="1.5"/><text x="620.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">head = tail = None</text></g><text x="620" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">AFTER</text><g><rect x="240" y="440" width="150" height="70" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="315.0" y="482.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">A: 4</text></g><text x="315" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">head</text><path data-connector="true" d="M 315 425 L 315 440" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><text x="315" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">tail</text><path data-connector="true" d="M 315 536 L 315 510" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 390 463 L 435 463" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">None</text><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Empty → first node: head and tail both reference A; size: 0 → 1.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Singleton: head is tail; tail.next is None. Empty: both endpoints are None.</text></svg>
