<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Fenwick lowbit</title><desc id="desc">Fenwick lowbit index 12 = 01100 0 1 1 0 0 lowbit(12) = 4 = 00100 0 0 1 0 0 12 8 0 Prefix walk: subtract lowbit at each step. Blocks: [8,12) then [0,8); stop at 0. lowbit(0) = 0; never update from index 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Fenwick lowbit</text><text x="24" y="79" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">index 12 = 01100</text><g><rect x="26" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="114" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="202" y="95" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="290" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="378" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="420.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><text x="24" y="179" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">lowbit(12) = 4 = 00100</text><g><rect x="26" y="195" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="221.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="114" y="195" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="221.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="202" y="195" width="84" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="221.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="290" y="195" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="221.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="378" y="195" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="420.0" y="221.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="35" y="315" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="80.0" y="341.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">12</text></g><g><rect x="190" y="315" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="235.0" y="341.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">8</text></g><path data-connector="true" d="M 125,336 L 190,336" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="345" y="315" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="390.0" y="341.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><path data-connector="true" d="M 280,336 L 345,336" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="415" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Prefix walk: subtract lowbit at each step.</text><text x="24" y="444" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Blocks: [8,12) then [0,8); stop at 0.</text><text x="24" y="473" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">lowbit(0) = 0; never update from index 0.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">All data intervals are half-open: [left,right).</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
