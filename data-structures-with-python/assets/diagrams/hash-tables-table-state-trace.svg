<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">Each bucket is a distinct list</title><desc id="desc">New HashTable(4): buckets: [&#x27;[]&#x27;, &#x27;[]&#x27;, &#x27;[]&#x27;, &#x27;[]&#x27;]. size = 0; capacity = 4; no stored pairs. Illustrative later state: put(A, 7): [&#x27;[]&#x27;, &#x27;A:7&#x27;, &#x27;[]&#x27;, &#x27;[]&#x27;]. A hashes to 1; size = 1. A second new table remains empty: [&#x27;[]&#x27;, &#x27;[]&#x27;, &#x27;[]&#x27;, &#x27;[]&#x27;]. Its bucket 1 is a different list object.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Each bucket is a distinct list</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">New HashTable(4): buckets</text><g><rect x="30.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="83.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[]</text></g><text x="83.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="140.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[]</text></g><text x="193.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="250.0" y="99" width="106.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="303.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-an