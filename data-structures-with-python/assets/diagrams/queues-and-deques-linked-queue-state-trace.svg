<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">Empty and singleton queue states</title><desc id="desc">New queue: no reachable nodes: []. head = tail = None; size = 0. Illustrative later state: enqueue(23): [23]. head = tail = this node; size = 1. After removing that only node: []. Return 23; head = tail = None; size = 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Empty and singleton queue states</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">New queue: no reachable nodes</text><g><rect x="40" y="92" width="120" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="117.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">head = tail = None; size = 0.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Illustrative later state: enqueue(23)</text><g><rect x="40" y="204" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="230.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">23</text></g><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">head = tail = this node; size = 1.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After removing that only node</text><g><rect x="40" y="316" width="120" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="341.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Return 23; head = tail = None; size = 0.</text><text x="24" y="404" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">A nonempty tail always has next = None.</text><text x="24" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
