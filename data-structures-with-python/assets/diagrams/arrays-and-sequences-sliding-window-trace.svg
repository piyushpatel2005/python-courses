<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Three width-three windows over [4,1,7,2,6] have sums 12,10,15</title><desc id="desc">Three width-three windows over [4,1,7,2,6] have sums 12,10,15. Shifting subtracts 4 and adds 2, then subtracts 1 and adds 6. The maximum is 15; the array does not change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Sliding window</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Window [0, 3): 4 + 1 + 7 = 12</text><g><rect x="220" y="155" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="276.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="155" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="396.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="155" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="516.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="155" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="636.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="700" y="155" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="756.0" y="192.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">6</text></g><text x="756.0" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><text x="620" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Slide to [1, 4): 12 − 4 + 2 = 10</text><g><rect x="220" y="315" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="276.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="315" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="396.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="315" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="516.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="315" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="636.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="700" y="315" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="756.0" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">6</text></g><text x="756.0" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><text x="620" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Slide to [2, 5): 10 − 1 + 6 = 15</text><g><rect x="220" y="475" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="276.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">4</text></g><text x="276.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="340" y="475" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="396.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1</text></g><text x="396.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="460" y="475" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="516.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">7</text></g><text x="516.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="580" y="475" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="636.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="636.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="700" y="475" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="756.0" y="512.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">6</text></g><text x="756.0" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Width k = 3: subtract the leaving value, add the entering value. Best sum = 15.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Input is unchanged. Require 1 ≤ k ≤ len(values); empty input has no valid positive-width window.</text></svg>
