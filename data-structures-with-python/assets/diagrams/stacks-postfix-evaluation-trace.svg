<svg xmlns="http://www.w3.org/2000/svg" width="500" height="670" viewBox="0 0 500 670" role="img" aria-labelledby="title desc"><title id="title">Postfix: operand order matters</title><desc id="desc">Read token 12: [12]. Bottom → top; last slot is top. Read token 5: [12, 5]. Bottom → top; last slot is top. Read token -: [7]. Pop right 5, then left 12; push 7. Read token 3: [7, 3]. Bottom → top; last slot is top. Read token *: [21]. Pop right 3, then left 7; push 21.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="670" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Postfix: operand order matters</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Read token 12</text><g><rect x="30" y="99" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">12</text></g><text x="98.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Bottom → top; last slot is top.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Read token 5</text><g><rect x="30" y="211" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">12</text></g><text x="98.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="170" y="211" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">5</text></g><text x="238.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Bottom → top; last slot is top.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Read token -</text><g><rect x="30" y="323" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="98.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Pop right 5, then left 12; push 7.</text><text x="24" y="408" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Read token 3</text><g><rect x="30" y="435" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="98.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="170" y="435" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="238.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><text x="24" y="496" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Bottom → top; last slot is top.</text><text x="24" y="520" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Read token *</text><g><rect x="30" y="547" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="571.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">21</text></g><text x="98.0" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><text x="24" y="608" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Pop right 3, then left 7; push 21.</text><text x="24" y="628" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Final one-item stack gives result 21.</text><text x="24" y="650" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
