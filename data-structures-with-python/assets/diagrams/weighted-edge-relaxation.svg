<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img"><title>Compare old distance with distance[u]+weight, update predecessor only for improved path.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="610" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Relax an edge only when better</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Directed weighted graph • strict improvement rule</text><g><rect x="67.0" y="155" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="188.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">S</text></g><g><rect x="267.0" y="155" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="188.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">U</text></g><g><rect x="467.0" y="155" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="500.0" y="188.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">V</text></g><path d="M 133 180 L 267 180" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 333 180 L 467 180" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><text x="300" y="270" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Edge weights: S→U is 6; U→V is 3.</text><text x="300" y="300" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Known d[U] = 6; old d[V] = 13.</text><g><rect x="60" y="365" width="210" height="70" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="165.0" y="408.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">6 + 3 = 9</text></g><g><rect x="330" y="365" width="210" height="70" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="435.0" y="408.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">9 &lt; 13</text></g><text x="300" y="490" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Update d[V] = 9 and predecessor[V] = U.</text><text x="300" y="520" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">If candidate ≥ old distance, keep both unchanged.</text><text x="300" y="588" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
