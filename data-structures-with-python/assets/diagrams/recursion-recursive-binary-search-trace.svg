<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Recursive binary search for 17 in [2,5,8,11,14,17,20] probes index 3 in [0,7), then index 5 in [4,7), and returns 5</title><desc id="desc">Recursive binary search for 17 in [2,5,8,11,14,17,20] probes index 3 in [0,7), then index 5 in [4,7), and returns 5. Empty intervals return None without reading a cell.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Recursive binary search</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">Sorted array; target = 17; indices below</text><g><rect x="190" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="246.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2</text></g><text x="246.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">0</text><g><rect x="310" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="366.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">5</text></g><text x="366.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">1</text><g><rect x="430" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="486.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">8</text></g><text x="486.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">2</text><g><rect x="550" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="606.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">11</text></g><text x="606.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">3</text><g><rect x="670" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="726.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">14</text></g><text x="726.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">4</text><g><rect x="790" y="180" width="112" height="60" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="846.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">17</text></g><text x="846.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">5</text><g><rect x="910" y="180" width="112" height="60" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="966.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">20</text></g><text x="966.0" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">6</text><g><rect x="180" y="355" width="410" height="90" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="385.0" y="394.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Frame 1: [lo, hi) = [0, 7)</text><text x="385.0" y="420.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">mid = 3; a[3] = 11 &lt; 17</text></g><g><rect x="680" y="355" width="400" height="90" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="880.0" y="394.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Frame 2: [lo, hi) = [4, 7)</text><text x="880.0" y="420.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">mid = 5; a[5] = 17</text></g><path data-connector="true" d="M 590 400 L 680 400" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="410" y="535" width="420" height="70" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="620.0" y="577.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Return index 5 through both frames</text></g><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Half-open bounds; right recursion uses mid + 1, never mid.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Empty interval lo == hi: return None. Empty input begins [0, 0); no array access.</text></svg>
