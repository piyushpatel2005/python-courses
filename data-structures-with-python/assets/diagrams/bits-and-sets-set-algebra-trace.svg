<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Set algebra</title><desc id="desc">Set algebra Left input: duplicates collapse 3 7 7 Right input 7 11 either: {3, 7, 11}     both: {7} left_only: {3}     exclusive: {3, 11} Return a dict of sets; inputs unchanged. Empty vs empty: all four sets are empty.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Set algebra</text><text x="24" y="79" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Left input: duplicates collapse</text><g><rect x="26" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="114" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><g><rect x="202" y="95" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="24" y="179" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Right input</text><g><rect x="26" y="195" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="221.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><g><rect x="114" y="195" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="221.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">11</text></g><text x="24" y="310" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">either: {3, 7, 11}     both: {7}</text><text x="24" y="339" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">left_only: {3}     exclusive: {3, 11}</text><text x="24" y="368" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return a dict of sets; inputs unchanged.</text><text x="24" y="397" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Empty vs empty: all four sets are empty.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Queries return values; state is shown separately.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
