<svg xmlns="http://www.w3.org/2000/svg" width="500" height="430" viewBox="0 0 500 430" role="img" aria-labelledby="title desc"><title id="title">Alias or rebind?</title><desc id="desc">Before rebinding, names a and b both refer to list [17]. After a is rebound to [29], b still refers to the original list [17].</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="430" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Alias or rebind?</text><text x="24" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: b = a</text><g><rect x="40" y="92" width="65" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="72.5" y="117.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">a</text></g><g><rect x="40" y="153" width="65" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="72.5" y="178.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">b</text></g><g><rect x="285" y="112" width="150" height="55" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="360.0" y="145.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[17]</text></g><path data-connector="true" d="M 105,112 L 190,112 L 190,130 L 285,130" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 105,173 L 218,173 L 218,150 L 285,150" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="231" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After: a = [29]</text><g><rect x="40" y="253" width="65" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="72.5" y="278.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">a</text></g><g><rect x="40" y="314" width="65" height="40" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="72.5" y="339.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">b</text></g><g><rect x="285" y="253" width="150" height="40" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="360.0" y="278.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[29]</text></g><g><rect x="285" y="314" width="150" height="40" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="360.0" y="339.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[17]</text></g><path data-connector="true" d="M 105,273 L 285,273" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 105,334 L 285,334" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="388" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Arrows mean references, not copied values.</text><text x="24" y="410" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
