<svg xmlns="http://www.w3.org/2000/svg" width="500" height="446" viewBox="0 0 500 446" role="img" aria-labelledby="title desc"><title id="title">Swap only an inverted adjacent pair</title><desc id="desc">Before: compare indices 0 and 1: [11, 7, 19]. 11 &gt; 7: this adjacent pair is inverted. After: exchange the two values: [7, 11, 19]. Index 2 stays 19; the multiset is unchanged. Compare indices 1 and 2: [7, 11, 19]. 11 &lt;= 19: no swap; keep this state.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="446" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Swap only an inverted adjacent pair</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: compare indices 0 and 1</text><g><rect x="30" y="99" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">11</text></g><text x="98.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="170" y="99" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="238.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="310" y="99" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="378.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">19</text></g><text x="378.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">11 &gt; 7: this adjacent pair is inverted.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After: exchange the two values</text><g><rect x="30" y="211" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="98.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="170" y="211" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">11</text></g><text x="238.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="310" y="211" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="378.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">19</text></g><text x="378.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Index 2 stays 19; the multiset is unchanged.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Compare indices 1 and 2</text><g><rect x="30" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="98.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="170" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">11</text></g><text x="238.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="310" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="378.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">19</text></g><text x="378.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">11 &lt;= 19: no swap; keep this state.</text><text x="24" y="404" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Illustrative ascending adjacent-swap rule.</text><text x="24" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
