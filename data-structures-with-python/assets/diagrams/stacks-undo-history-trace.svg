<svg xmlns="http://www.w3.org/2000/svg" width="500" height="558" viewBox="0 0 500 558" role="img" aria-labelledby="title desc"><title id="title">Undo restores a saved state</title><desc id="desc">Before: current text = ink+line+dot: [&#x27;ink&#x27;, &#x27;ink+line&#x27;]. Saved text states, oldest → newest. undo() returns True; text = ink+line: [&#x27;ink&#x27;]. Pop the latest saved state; do not save again. undo() returns True; text = ink: []. History is now empty. Next undo() returns False: []. Current text remains ink; no mutation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="558" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Undo restores a saved state</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: current text = ink+line+dot</text><g><rect x="30" y="99" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">ink</text></g><text x="98.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="170" y="99" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">ink+line</text></g><text x="238.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Saved text states, oldest → newest.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">undo() returns True; text = ink+line</text><g><rect x="30" y="211" width="136" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">ink</text></g><text x="98.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Pop the latest saved state; do not save again.</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">undo() returns True; text = ink</text><g><rect x="40" y="316" width="120" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="341.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">History is now empty.</text><text x="24" y="408" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Next undo() returns False</text><g><rect x="40" y="428" width="120" height="40" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="453.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">empty</text></g><text x="24" y="496" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Current text remains ink; no mutation.</text><text x="24" y="516" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">A saved empty string is valid, not an empty stack.</text><text x="24" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
