<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img"><title>Operation-specific worked trace for undirected cycle in Breadth-first and depth-first traversal. Show concrete values and state before/after, actual pointers/indices/frontier when relevant, edge case where it reveals invariant. Peek MUST show unchanged structure and returned value; insert/delete show head/tail updates, including empty/singleton transitions. Do not use generic process boxes or repeat prior art without a distinct mechanism.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="900" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Undirected cycle</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Worked trace • original illustrative values</text><path d="M 133.0 155.0 L 277.0 155.0" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 100.0 180.0 L 100.0 275.0" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 310.0 180.0 L 310.0 275.0" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 133.0 300.0 L 277.0 300.0" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="67.0" y="130" width="66" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="163.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">A</text></g><g><rect x="277.0" y="130" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="310.0" y="163.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">B</text></g><g><rect x="67.0" y="275" width="66" height="50" rx="8" fill="#fee2e2" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="308.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">C</text></g><g><rect x="277.0" y="275" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="310.0" y="308.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">D</text></g><text x="300" y="440" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">DFS active path (root at left)</text><g><rect x="30.0" y="458" width="132.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="96.0" y="490.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">A</text></g><text x="96.0" y="533" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#183153">0</text><g><rect x="165.0" y="458" width="132.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="231.0" y="490.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">B</text></g><text x="231.0" y="533" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#183153">1</text><g><rect x="300.0" y="458" width="132.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="366.0" y="490.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">D</text></g><text x="366.0" y="533" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#183153">2</text><g><rect x="435.0" y="458" width="132.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="501.0" y="490.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">C</text></g><text x="501.0" y="533" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#183153">3</text><text x="300" y="620" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">At C: D is its parent, so ignore C—D.</text><text x="300" y="650" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">A is visited and is NOT the parent of C.</text><text x="300" y="680" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">C—A closes cycle A—B—D—C—A.</text><text x="300" y="710" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">A single edge to a parent is not a cycle.</text><text x="300" y="878" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
