<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img"><title>Operation-specific worked trace for directed edges in Represent and build graphs. Show concrete values and state before/after, actual pointers/indices/frontier when relevant, edge case where it reveals invariant. Peek MUST show unchanged structure and returned value; insert/delete show head/tail updates, including empty/singleton transitions. Do not use generic process boxes or repeat prior art without a distinct mechanism.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="900" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Directed edges</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Worked trace • original illustrative values</text><path d="M 133.0 155.0 L 277.0 155.0" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><path d="M 310.0 180.0 L 310.0 275.0" data-connector="true" data-arrow="true" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#tip)"/><g><rect x="67.0" y="130" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="163.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">A</text></g><g><rect x="277.0" y="130" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="310.0" y="163.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">B</text></g><g><rect x="67.0" y="275" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="308.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">