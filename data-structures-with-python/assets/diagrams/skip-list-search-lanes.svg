<svg xmlns="http://www.w3.org/2000/svg" width="500" height="460" viewBox="0 0 500 460" role="img" aria-labelledby="title desc"><title id="title">Search along lanes, then drop</title><desc id="desc">A skip list has sorted base keys 7, 18, 31, 46. Search for 26 begins at the head on level 1, moves right to 18, rejects the forward key 46 as too large, then drops to level 0. The next key 31 is too large, so the predecessor is 18 on both levels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="460" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Search along lanes, then drop</text><text x="24" y="73" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Target 26: advance only to keys &lt; 26</text><text x="24" y="110" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Level 1</text><g><rect x="30" y="130" width="62" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="61.0" y="156.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">head</text></g><g><rect x="200" y="130" width="62" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="231.0" y="156.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><g><rect x="390" y="130" width="62" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="421.0" y="156.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">46</text></g><path data-connector="true" d="M 92,151 L 200,151" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 262,151 L 390,151" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 231,172 L 231,272" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="252" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Level 0</text><g><rect x="30" y="272" width="62" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="61.0" y="298.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">head</text></g><g><rect x="115" y="272" width="62" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="146.0" y="298.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><path data-connector="true" d="M 92,293 L 115,293" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="200" y="272" width="62" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="231.0" y="298.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><path data-connector="true" d="M 177,293 L 200,293" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="295" y="272" width="62" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="326.0" y="298.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">31</text></g><path data-connector="true" d="M 262,293 L 295,293" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="390" y="272" width="62" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="421.0" y="298.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">46</text></g><path data-connector="true" d="M 357,293 L 390,293" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="356" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Trace: head → 18; drop; stop before 31.</text><text x="24" y="393" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Predecessors: level 1 = 18, level 0 = 18</text><text x="24" y="418" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Fixed illustrative levels; vertical move keeps key.</text><text x="24" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
