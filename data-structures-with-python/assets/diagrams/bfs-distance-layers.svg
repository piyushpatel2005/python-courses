<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img"><title>Small graph with cycles, discovery layers and FIFO frontier; visited on enqueue.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="760" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">BFS discovers distance layers</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Undirected cycle • scan neighbors alphabetically</text><path d="M 133 260 L 267 160" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 133 260 L 267 360" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 333 160 L 467 260" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 333 360 L 467 260" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="67.0" y="235" width="66" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="268.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">P</text></g><g><rect x="267.0" y="135" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="168.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">Q</text></g><g><rect x="267.0" y="335" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="368.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">R</text></g><g><rect x="467.0" y="235" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="500.0" y="268.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">S</text></g><text x="100" y="110" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#183153">distance 0</text><text x="300" y="110" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#183153">distance 1</text><text x="500" y="110" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#183153">distance 2</text><text x="300" y="435" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Front of FIFO queue is at the left.</text><text x="300" y="485" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">After processing P:  [Q, R]</text><text x="300" y="530" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">After processing Q:  [R, S]</text><text x="300" y="575" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">After processing R:  [S]</text><text x="300" y="620" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">After processing S:  []</text><text x="300" y="690" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Mark on enqueue: S is not queued twice.</text><text x="300" y="738" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
