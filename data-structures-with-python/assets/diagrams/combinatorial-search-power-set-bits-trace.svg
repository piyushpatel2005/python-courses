<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Power set bits</title><desc id="desc">Power set bits 00 () 01 (&#x27;K&#x27;,) 10 (&#x27;M&#x27;,) 11 (&#x27;K&#x27;, &#x27;M&#x27;) bit 0 chooses K; bit 1 chooses M.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Power set bits</text><g><rect x="35" y="95" width="100" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="85.0" y="123.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">00</text></g><g><rect x="230" y="95" width="230" height="45" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="345.0" y="123.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">()</text></g><path data-connector="true" d="M 135,117 L 230,117" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="35" y="180" width="100" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="85.0" y="208.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">01</text></g><g><rect x="230" y="180" width="230" height="45" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="345.0" y="208.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;K&#x27;,)</text></g><path data-connector="true" d="M 135,202 L 230,202" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="35" y="265" width="100" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="85.0" y="293.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">10</text></g><g><rect x="230" y="265" width="230" height="45" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="345.0" y="293.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;M&#x27;,)</text></g><path data-connector="true" d="M 135,287 L 230,287" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="35" y="350" width="100" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="85.0" y="378.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">11</text></g><g><rect x="230" y="350" width="230" height="45" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="345.0" y="378.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;K&#x27;, &#x27;M&#x27;)</text></g><path data-connector="true" d="M 135,372 L 230,372" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="470" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">bit 0 chooses K; bit 1 chooses M.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Empty input returns [()], not []. Inputs unchanged.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
