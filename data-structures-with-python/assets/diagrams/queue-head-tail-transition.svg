<svg xmlns="http://www.w3.org/2000/svg" width="500" height="540" viewBox="0 0 500 540" role="img" aria-labelledby="title desc"><title id="title">Dequeue at head; clear the last tail</title><desc id="desc">Initially queue nodes 16 and 24 are head and tail. Dequeue returns 16, leaving both head and tail pointing to 24. A second dequeue returns 24 and sets both pointers to None.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="540" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Dequeue at head; clear the last tail</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: 16 was enqueued first</text><text x="40" y="111" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">head</text><text x="320" y="111" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">tail</text><g><rect x="40" y="130" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="156.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">16</text></g><g><rect x="320" y="130" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="156.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">24</text></g><path data-connector="true" d="M 125,151 L 320,151" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="236" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">dequeue() returns 16</text><g><rect x="40" y="261" width="100" height="40" rx="5" fill="#ede9fe" stroke="#526279" stroke-width="1.5"/><text x="90.0" y="286.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">head</text></g><g><rect x="350" y="261" width="100" height="40" rx="5" fill="#ede9fe" stroke="#526279" stroke-width="1.5"/><text x="400.0" y="286.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">tail</text></g><g><rect x="210" y="325" width="80" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="250.0" y="351.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">24</text></g><path data-connector="true" d="M 90,301 L 90,346 L 210,346" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 400,301 L 400,346 L 290,346" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="425" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Next dequeue returns 24: queue is empty.</text><text x="24" y="467" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#172033">head = tail = None; size = 0</text><text x="24" y="498" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Linked queue: the last remaining node has next=None.</text><text x="24" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
