<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Doubly prepend</title><desc id="desc">Doubly prepend. Before: A: 4 → B: 9. After: N: 2 → A: 4 → B: 9. 1. N.next = old head; 2. old head.prev = N; 3. head = N. Empty prepend: head = tail = N; N.prev = N.next = None.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Doubly prepend</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="620" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">BEFORE</text><g><rect x="240" y="190" width="150" height="70" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="315.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">A: 4</text></g><path data-connector="true" d="M 390 213 L 470 213" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 470 240 L 390 240" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="470" y="190" width="150" height="70" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="545.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">B: 9</text></g><text x="315" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">head</text><path data-connector="true" d="M 315 175 L 315 190" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><text x="545" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">tail</text><path data-connector="true" d="M 545 286 L 545 260" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 620 213 L 665 213" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">None</text><path data-connector="true" d="M 240 240 L 180 240" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="140" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">None</text><text x="620" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">AFTER</text><g><rect x="240" y="440" width="150" height="70" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="315.0" y="482.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">N: 2</text></g><path data-connector="true" d="M 390 463 L 470 463" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 470 490 L 390 490" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="470" y="440" width="150" height="70" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="545.0" y="482.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">A: 4</text></g><path data-connector="true" d="M 620 463 L 700 463" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 700 490 L 620 490" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="700" y="440" width="150" height="70" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="775.0" y="482.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">B: 9</text></g><text x="315" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">head</text><path data-connector="true" d="M 315 425 L 315 440" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><text x="775" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">tail</text><path data-connector="true" d="M 775 536 L 775 510" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 850 463 L 895 463" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><text x="925" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">None</text><path data-connector="true" d="M 240 490 L 180 490" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="140" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">None</text><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">1. N.next = old head; 2. old head.prev = N; 3. head = N.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Empty prepend: head = tail = N; N.prev = N.next = None.</text></svg>
