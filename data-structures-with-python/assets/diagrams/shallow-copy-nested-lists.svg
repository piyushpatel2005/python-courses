<svg xmlns="http://www.w3.org/2000/svg" width="500" height="480" viewBox="0 0 500 480" role="img" aria-labelledby="title desc"><title id="title">Where a shallow copy stops</title><desc id="desc">Two distinct outer lists point to the same inner list [17, 23]. Copying each inner list creates independent inner lists; changing the copied inner list does not alter the original.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="480" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Where a shallow copy stops</text><text x="24" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Shallow: two outer lists, one inner list</text><g><rect x="35" y="95" width="130" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="123.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">outer[0]</text></g><g><rect x="35" y="165" width="130" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="193.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">copy[0]</text></g><g><rect x="300" y="130" width="155" height="45" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="377.5" y="158.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[17, 23]</text></g><path data-connector="true" d="M 165,117 L 225,117 L 225,144 L 300,144" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 165,187 L 250,187 L 250,162 L 300,162" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="258" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Copy the inner list as well</text><g><rect x="35" y="285" width="130" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="313.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">outer[0]</text></g><g><rect x="300" y="285" width="155" height="45" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="377.5" y="313.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[17, 23]</text></g><path data-connector="true" d="M 165,307 L 300,307" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="35" y="355" width="130" height="45" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="100.0" y="383.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">copy[0]</text></g><g><rect x="300" y="355" width="155" height="45" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="377.5" y="383.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">[17, 99]</text></g><path data-connector="true" d="M 165,377 L 300,377" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="438" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Lower panel: change only copy[0][1] to 99.</text><text x="24" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
