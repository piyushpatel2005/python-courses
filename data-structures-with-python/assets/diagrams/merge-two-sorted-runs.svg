<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690" role="img"><title>Two read cursors and output prefix, stable equal-key choice and remaining tail.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="690" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Merge: equal keys take left first</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">L / R tags show origin, not part of the sort key</text><text x="300" y="115" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">Snapshot: 3L and 4R already emitted</text><g><rect x="35" y="145" width="172" height="50" rx="8" fill="#f1f5f9" stroke="#183153" stroke-width="1.5"/><text x="121.0" y="177.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">3L</text></g><g><rect x="210" y="145" width="172" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="296.0" y="177.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">7L</text></g><g><rect x="385" y="145" width="172" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="471.0" y="177.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">10L</text></g><text x="300" y="225" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Left cursor: index 1 (7L)</text><g><rect x="35" y="260" width="172" height="50" rx="8" fill="#f1f5f9" stroke="#183153" stroke-width="1.5"/><text x="121.0" y="292.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">4R</text></g><g><rect x="210" y="260" width="172" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="296.0" y="292.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">7R</text></g><g><rect x="385" y="260" width="172" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="471.0" y="292.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">12R</text></g><text x="300" y="340" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Right cursor: index 1 (7R)</text><text x="300" y="390" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">Output prefix</text><g><rect x="35" y="410" width="172" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="121.0" y="442.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">3L</text></g><g><rect x="210" y="410" width="172" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="296.0" y="442.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">4R</text></g><g><rect x="385" y="410" width="172" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="471.0" y="442.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">7L</text></g><text x="300" y="500" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Tie 7 = 7: emit 7L, advance only left.</text><text x="300" y="530" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Then emit 7R, 10L; copy remaining tail 12R.</text><g><rect x="30.0" y="580" width="87.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="73.5" y="612.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">3L</text></g><g><rect x="120.0" y="580" width="87.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="163.5" y="612.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">4R</text></g><g><rect x="210.0" y="580" width="87.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="253.5" y="612.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">7L</text></g><g><rect x="300.0" y="580" width="87.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="343.5" y="612.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">7R</text></g><g><rect x="390.0" y="580" width="87.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="433.5" y="612.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">10L</text></g><g><rect x="480.0" y="580" width="87.0" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="523.5" y="612.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">12R</text></g><text x="300" y="668" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
