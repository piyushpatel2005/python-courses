<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img"><title>Before/after two-child deletion replacing with smallest right subtree key; reattach successor child.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="850" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Delete 20: transplant successor 26</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Distinct keys • successor has a right child, 28</text><path d="M 290 180 L 100 225" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 290 180 L 470 225" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 470 275 L 360 320" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 360 370 L 425 410" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="257.0" y="130" width="66" height="50" rx="8" fill="#fee2e2" stroke="#183153" stroke-width="1.5"/><text x="290.0" y="163.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">20</text></g><g><rect x="67.0" y="225" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="258.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">9</text></g><g><rect x="437.0" y="225" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="470.0" y="258.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">35</text></g><g><rect x="327.0" y="320" width="66" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="360.0" y="353.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">26</text></g><g><rect x="392.0" y="410" width="66" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="425.0" y="443.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">28</text></g><text x="92" y="155" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">Before</text><text x="300" y="490" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">26 is the minimum of the right subtree.</text><text x="300" y="520" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Detach 26: set 35.left to 28. Then replace 20.</text><path d="M 290 630 L 100 675" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 290 630 L 470 675" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 470 725 L 385 760" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="257.0" y="580" width="66" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="290.0" y="613.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">26</text></g><g><rect x="67.0" y="675" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="100.0" y="708.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">9</text></g><g><rect x="437.0" y="675" width="66" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="470.0" y="708.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">35</text></g><g><rect x="352.0" y="760" width="66" height="50" rx="8" fill="#ffedd5" stroke="#183153" stroke-width="1.5"/><text x="385.0" y="793.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">28</text></g><text x="92" y="605" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">After</text><text x="300" y="828" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
