<svg xmlns="http://www.w3.org/2000/svg" width="500" height="558" viewBox="0 0 500 558" role="img" aria-labelledby="title desc"><title id="title">Three-way quicksort keeps equal keys</title><desc id="desc">Input: choose pivot value 13: [18, 7, 13, 4, 13]. Illustrative allocating three-way variant. Partition: less | equal | greater: [7, 4, 13, 13, 18]. [7, 4] | [13, 13] | [18] Recurse only on less and greater: [4, 7, 18]. Sort [7, 4] → [4, 7]; [18] is a base case. Concatenate sorted less + equal + greater: [4, 7, 13, 13, 18]. Both copies of 13 remain; all values preserved.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="558" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Three-way quicksort keeps equal keys</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Input: choose pivot value 13</text><g><rect x="30.0" y="99" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="72.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="72.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="118.0" y="99" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="160.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="160.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="206.0" y="99" width="84.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="248.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="294.0" y="99" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="336.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="336.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><g><rect x="382.0" y="99" width="84.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="424.0" y="123.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="424.0" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">4</text><text x="24" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Illustrative allocating three-way variant.</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Partition: less | equal | greater</text><g><rect x="30.0" y="211" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="72.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="72.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="118.0" y="211" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="160.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="160.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="206.0" y="211" width="84.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="248.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="294.0" y="211" width="84.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="336.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="336.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><g><rect x="382.0" y="211" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="424.0" y="235.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="424.0" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">4</text><text x="24" y="272" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">[7, 4] | [13, 13] | [18]</text><text x="24" y="296" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Recurse only on less and greater</text><g><rect x="30" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="98.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="98.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="170" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="238.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="238.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="310" y="323" width="136" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="378.0" y="347.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="378.0" y="314" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><text x="24" y="384" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Sort [7, 4] → [4, 7]; [18] is a base case.</text><text x="24" y="408" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Concatenate sorted less + equal + greater</text><g><rect x="30.0" y="435" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="72.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="72.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="118.0" y="435" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="160.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="160.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="206.0" y="435" width="84.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="248.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="294.0" y="435" width="84.0" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="336.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">13</text></g><text x="336.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><g><rect x="382.0" y="435" width="84.0" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="424.0" y="459.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">18</text></g><text x="424.0" y="426" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">4</text><text x="24" y="496" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Both copies of 13 remain; all values preserved.</text><text x="24" y="516" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">New lists are used; this is not in-place partitioning.</text><text x="24" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
