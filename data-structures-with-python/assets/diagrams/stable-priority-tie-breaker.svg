<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img"><title>Entries ordered by priority then insertion counter, payload never compared.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="620" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Stable priority: counter breaks ties</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Lower priority number wins • counter increases</text><text x="300" y="115" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Heap entries: (priority, counter, payload)</text><path d="M 300 200 L 150 275" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 200 L 450 275" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="225.0" y="150" width="150" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="183.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">1,1,elm</text></g><g><rect x="75.0" y="275" width="150" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="150.0" y="308.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">2,0,oak</text></g><g><rect x="375.0" y="275" width="150" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="450.0" y="308.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">2,2,ash</text></g><text x="300" y="385" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">Pop order</text><g><rect x="35" y="410" width="172" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="121.0" y="442.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">elm</text></g><g><rect x="210" y="410" width="172" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="296.0" y="442.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">oak</text></g><g><rect x="385" y="410" width="172" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="471.0" y="442.7" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183153">ash</text></g><text x="300" y="510" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">oak precedes ash: same priority, 0 &lt; 2.</text><text x="300" y="540" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Unique counters prevent payload comparison.</text><text x="300" y="598" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
