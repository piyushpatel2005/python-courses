<svg xmlns="http://www.w3.org/2000/svg" width="500" height="580" viewBox="0 0 500 580" role="img" aria-labelledby="title desc"><title id="title">A deque keeps only useful candidates</title><desc id="desc">For values 9, 4, 6, 7 and window size 3, the first window has candidate indices 0 and 2. Advancing the window expires index 0 from the front. Incoming 7 removes weaker 6 at index 2 from the back. Append index 3, which is the new maximum.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="580" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">A deque keeps only useful candidates</text><text x="24" y="74" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Window width 3; store indices, not values</text><g><rect x="45" y="110" width="96" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="93.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">9</text></g><text x="93.0" y="101" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">0</text><g><rect x="145" y="110" width="96" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="193.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">4</text></g><text x="193.0" y="101" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">1</text><g><rect x="245" y="110" width="96" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="293.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">6</text></g><text x="293.0" y="101" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">2</text><g><rect x="345" y="110" width="96" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="393.0" y="136.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">7</text></g><text x="393.0" y="101" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">3</text><text x="24" y="208" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Before: window [0, 3), candidates</text><g><rect x="55" y="230" width="106" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="108.0" y="256.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0:9</text></g><g><rect x="165" y="230" width="106" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="218.0" y="256.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2:6</text></g><text x="55" y="294" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">front = maximum</text><text x="24" y="341" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Advance to [1, 4): expire 0 from front</text><g><rect x="55" y="363" width="106" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="108.0" y="389.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2:6</text></g><text x="24" y="443" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">7 removes 2:6 at back; append index 3</text><g><rect x="55" y="465" width="106" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="108.0" y="491.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3:7</text></g><text x="24" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Cells read index:value; remove ties from back too.</text><text x="24" y="560" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
