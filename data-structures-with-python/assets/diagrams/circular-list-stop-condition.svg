<svg xmlns="http://www.w3.org/2000/svg" width="500" height="510" viewBox="0 0 500 510" role="img" aria-labelledby="title desc"><title id="title">A ring stops on identity, not None</title><desc id="desc">A circular list has head A, then B, then C whose next points back to A. Visit A, B, C once and stop before revisiting head A. A conventional linear list instead ends at None.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="510" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">A ring stops on identity, not None</text><text x="40" y="82" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">head</text><path data-connector="true" d="M 68,91 L 68,120" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="40" y="120" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="146.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="180" y="120" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="146.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><path data-connector="true" d="M 125,141 L 180,141" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="320" y="120" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="146.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 265,141 L 320,141" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 405,141 L 451,141 L 451,226 L 68,226 L 68,162" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="280" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">One lap: visit A, B, C; stop at A again.</text><text x="24" y="327" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Linear list: None ends traversal</text><g><rect x="40" y="352" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="378.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="180" y="352" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="378.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><path data-connector="true" d="M 125,373 L 180,373" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="320" y="352" width="85" height="42" rx="5" fill="#f1f5f9" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="378.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">None</text></g><path data-connector="true" d="M 265,373 L 320,373" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="468" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Nonempty ring; compare node identity to head.</text><text x="24" y="490" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
