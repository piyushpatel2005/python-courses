<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">Recursive sum: sum_at(0): wait for 6 + sum_at(1); sum_at(1): wait for 2 + sum_at(2); sum_at(2): wait for 5 + sum_at(3); sum_at(3): return 0 (i = length)</title><desc id="desc">Recursive sum: sum_at(0): wait for 6 + sum_at(1); sum_at(1): wait for 2 + sum_at(2); sum_at(2): wait for 5 + sum_at(3); sum_at(3): return 0 (i = length). Unwind: return 0, 5 + 0 = 5, 2 + 5 = 7, 6 + 7 = 13. Input [6, 2, 5] is unchanged. Index-based recursion: no slices are copied.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172554"/></marker></defs><rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="620" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">Recursive sum</text><text x="620" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Original illustrative data • values are independent of the lesson exercise</text><text x="400" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">CALL DESCENT: suspended frames</text><text x="970" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554">RETURN / UNWIND</text><g><rect x="160" y="170" width="550" height="75" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="435.0" y="214.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">sum_at(0): wait for 6 + sum_at(1)</text></g><g><rect x="865" y="170" width="220" height="75" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="975.0" y="214.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">6 + 7 = 13</text></g><path data-connector="true" d="M 220 245 L 220 285" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 1085 322 L 1130 322 L 1130 207 L 1085 207" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="195" y="285" width="550" height="75" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="470.0" y="329.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">sum_at(1): wait for 2 + sum_at(2)</text></g><g><rect x="865" y="285" width="220" height="75" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="975.0" y="329.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">2 + 5 = 7</text></g><path data-connector="true" d="M 255 360 L 255 400" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 1085 437 L 1130 437 L 1130 322 L 1085 322" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="230" y="400" width="550" height="75" rx="8" fill="#dbeafe" stroke="#172554" stroke-width="1.5"/><text x="505.0" y="444.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">sum_at(2): wait for 5 + sum_at(3)</text></g><g><rect x="865" y="400" width="220" height="75" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="975.0" y="444.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">5 + 0 = 5</text></g><path data-connector="true" d="M 290 475 L 290 515" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#arrow)"/><path data-connector="true" d="M 1085 552 L 1130 552 L 1130 437 L 1085 437" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="265" y="515" width="550" height="75" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="540.0" y="559.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">sum_at(3): return 0 (i = length)</text></g><g><rect x="865" y="515" width="220" height="75" rx="8" fill="#dcfce7" stroke="#172554" stroke-width="1.5"/><text x="975.0" y="559.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">return 0</text></g><text x="620" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554">Input [6, 2, 5] is unchanged. Index-based recursion: no slices are copied.</text><text x="620" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172554">Each suspended Python call has a frame; reaching the base case begins the return phase.</text></svg>
