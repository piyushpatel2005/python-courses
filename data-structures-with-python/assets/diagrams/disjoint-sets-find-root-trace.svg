<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Find root</title><desc id="desc">Find root parent indices 0 … 3 0 2 3 3 1 2 3 find(1): 1 → 2 → 3; parent[3] = 3 Return root ID 3, not size or component. This find does not compress: array unchanged. find(0) → 0 (singleton root).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Find root</text><text x="24" y="84" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">parent indices 0 … 3</text><g><rect x="26" y="100" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="114" y="100" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="202" y="100" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="244.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="290" y="100" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="332.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><g><rect x="35" y="245" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="80.0" y="271.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="190" y="245" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="235.0" y="271.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><path data-connector="true" d="M 125,266 L 190,266" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="345" y="245" width="90" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="390.0" y="271.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><path data-connector="true" d="M 280,266 L 345,266" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="365" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">find(1): 1 → 2 → 3; parent[3] = 3</text><text x="24" y="394" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return root ID 3, not size or component.</text><text x="24" y="423" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">This find does not compress: array unchanged.</text><text x="24" y="452" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">find(0) → 0 (singleton root).</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Parent links encode components, not original edges.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
