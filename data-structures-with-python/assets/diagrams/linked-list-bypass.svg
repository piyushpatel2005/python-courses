<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650" role="img" aria-labelledby="title desc"><title id="title">Bypass; then fix boundary pointers</title><desc id="desc">Removing middle B changes A.next to C. If removing the head, head becomes its next node. If removing the tail, tail becomes its predecessor. Removing the only node sets both head and tail to None.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="650" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Bypass; then fix boundary pointers</text><text x="24" y="72" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Middle removal: target B</text><g><rect x="40" y="95" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="180" y="95" width="85" height="42" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="222.5" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">B</text></g><path data-connector="true" d="M 125,116 L 180,116" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="320" y="95" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="121.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 265,116 L 320,116" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="180" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">After: A.next = C</text><g><rect x="40" y="202" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="228.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><g><rect x="320" y="202" width="85" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="228.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 125,223 L 320,223" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="300" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Head case: remove A from A → C</text><g><rect x="40" y="323" width="85" height="42" rx="5" fill="#ede9fe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="349.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">head</text></g><g><rect x="320" y="323" width="85" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="349.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">C</text></g><path data-connector="true" d="M 125,344 L 320,344" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="421" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Tail case: remove C from A → C</text><g><rect x="40" y="444" width="85" height="42" rx="5" fill="#ede9fe" stroke="#526279" stroke-width="1.5"/><text x="82.5" y="470.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">tail</text></g><g><rect x="320" y="444" width="85" height="42" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="362.5" y="470.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">A</text></g><path data-connector="true" d="M 125,465 L 320,465" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="553" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Only node removed: head = tail = None</text><text x="24" y="608" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Nonempty tail must have next = None.</text><text x="24" y="630" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
