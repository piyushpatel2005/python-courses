e="16" text-anchor="start" fill="#172033">Return list of tuples above; inputs unchanged.</text><text x="24" y="476" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">r = 0 → [()]; empty options, r &gt; 0 → [].</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Queries return values; state is shown separately.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
