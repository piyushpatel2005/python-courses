<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Cartesian product</title><desc id="desc">Cartesian product K (&#x27;K&#x27;, 4) (&#x27;K&#x27;, 9) M (&#x27;M&#x27;, 4) (&#x27;M&#x27;, 9) Left outer loop: finish K before M. Return list of four ordered tuples. Either factor empty → []; inputs unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Cartesian product</text><text x="35" y="150" font-family="Arial, sans-serif" font-size="20" text-anchor="start" fill="#172033">K</text><g><rect x="105" y="115" width="145" height="55" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="177.5" y="148.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;K&#x27;, 4)</text></g><g><rect x="285" y="115" width="145" height="55" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="357.5" y="148.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;K&#x27;, 9)</text></g><text x="35" y="250" font-family="Arial, sans-serif" font-size="20" text-anchor="start" fill="#172033">M</text><g><rect x="105" y="215" width="145" height="55" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="177.5" y="248.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;M&#x27;, 4)</text></g><g><rect x="285" y="215" width="145" height="55" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="357.5" y="248.1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;M&#x27;, 9)</text></g><text x="24" y="365" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Left outer loop: finish K before M.</text><text x="24" y="394" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Return list of four ordered tuples.</text><text x="24" y="423" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Either factor empty → []; inputs unchanged.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Queries return values; state is shown separately.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
