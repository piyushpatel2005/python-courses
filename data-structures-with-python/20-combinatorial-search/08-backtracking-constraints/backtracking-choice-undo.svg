<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img"><title>Small decision tree with pruned branch; state push/recurse/pop and correct complete outcomes.</title><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183153"/></marker></defs><rect x="0" y="0" width="600" height="760" fill="#ffffff"/><text x="300" y="37" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183153">Choose, recurse, undo</text><text x="300" y="69" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#183153">Length-2 bit strings with exactly one 1</text><path d="M 300 175 L 150 245" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 300 175 L 450 245" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 150 295 L 75 385" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 150 295 L 225 385" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 450 295 L 375 385" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><path d="M 450 295 L 525 385" data-connector="true" data-arrow="false" fill="none" stroke="#183153" stroke-width="2"/><g><rect x="241.0" y="125" width="118" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="300.0" y="158.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">[]</text></g><g><rect x="91.0" y="245" width="118" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="150.0" y="278.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">[0]</text></g><g><rect x="391.0" y="245" width="118" height="50" rx="8" fill="#dbeafe" stroke="#183153" stroke-width="1.5"/><text x="450.0" y="278.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">[1]</text></g><g><rect x="16.0" y="385" width="118" height="50" rx="8" fill="#fee2e2" stroke="#183153" stroke-width="1.5"/><text x="75.0" y="418.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">[0,0]</text></g><g><rect x="166.0" y="385" width="118" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="225.0" y="418.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">[0,1]</text></g><g><rect x="316.0" y="385" width="118" height="50" rx="8" fill="#dcfce7" stroke="#183153" stroke-width="1.5"/><text x="375.0" y="418.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">[1,0]</text></g><g><rect x="466.0" y="385" width="118" height="50" rx="8" fill="#fee2e2" stroke="#183153" stroke-width="1.5"/><text x="525.0" y="418.05" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183153">[1,1]</text></g><text x="75" y="465" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">reject</text><text x="225" y="465" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">emit</text><text x="375" y="465" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">emit</text><text x="525" y="465" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">prune</text><text x="300" y="535" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">[1,1] has too many ones: prune immediately.</text><text x="300" y="565" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">[0,0] reaches length 2 without one: reject.</text><text x="300" y="595" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">At [0]: push 1 → recurse [0,1] → pop 1.</text><text x="300" y="625" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">The undo restores [0] before returning to [].</text><text x="300" y="655" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Complete outputs: 01 and 10.</text><text x="300" y="738" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183153">Independent example • not an exercise fixture</text></svg>
