<svg xmlns="http://www.w3.org/2000/svg" width="500" height="570" viewBox="0 0 500 570" role="img" aria-labelledby="title desc"><title id="title">Power set iteration</title><desc id="desc">Power set iteration Start result () Add K: old + copies with K () (&#x27;K&#x27;,) Add M: append copies of previous result (&#x27;M&#x27;,) (&#x27;K&#x27;,&#x27;M&#x27;) Final order: (), (K,), (M,), (K,M) Snapshot additions before extending result.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="570" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Power set iteration</text><text x="24" y="84" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Start result</text><g><rect x="26" y="100" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="126.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">()</text></g><text x="24" y="194" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Add K: old + copies with K</text><g><rect x="26" y="210" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="236.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">()</text></g><g><rect x="114" y="210" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="236.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;K&#x27;,)</text></g><text x="24" y="304" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Add M: append copies of previous result</text><g><rect x="26" y="320" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="346.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;M&#x27;,)</text></g><g><rect x="114" y="320" width="84" height="42" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="156.0" y="346.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">(&#x27;K&#x27;,&#x27;M&#x27;)</text></g><text x="24" y="435" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Final order: (), (K,), (M,), (K,M)</text><text x="24" y="464" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Snapshot additions before extending result.</text><text x="24" y="528" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Empty input returns [()], not []. Inputs unchanged.</text><text x="24" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
