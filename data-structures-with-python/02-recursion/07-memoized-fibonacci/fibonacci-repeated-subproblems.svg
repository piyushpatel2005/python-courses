<svg xmlns="http://www.w3.org/2000/svg" width="500" height="580" viewBox="0 0 500 580" role="img" aria-labelledby="title desc"><title id="title">Repeated calls versus cached values</title><desc id="desc">The naive Fibonacci call tree for f(4) has nine calls, including two f(2) calls. With base values f(0)=0 and f(1)=1 cached, compute f(2)=1, f(3)=2, and f(4)=3 once each.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="580" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Repeated calls versus cached values</text><text x="24" y="66" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Naive tree: f(n), not return values</text><path data-connector="true" d="M 250,123 L 145,165" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 250,123 L 390,165" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 145,203 L 80,245" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 145,203 L 230,245" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 390,203 L 350,245" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 390,203 L 450,245" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 80,283 L 50,325" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 80,283 L 140,325" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="220" y="85" width="60" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="250.0" y="109.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(4)</text></g><g><rect x="115" y="165" width="60" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="145.0" y="189.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(3)</text></g><g><rect x="360" y="165" width="60" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="390.0" y="189.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(2)</text></g><g><rect x="50" y="245" width="60" height="38" rx="5" fill="#ffedd5" stroke="#526279" stroke-width="1.5"/><text x="80.0" y="269.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(2)</text></g><g><rect x="200" y="245" width="60" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="230.0" y="269.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(1)</text></g><g><rect x="320" y="245" width="60" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="350.0" y="269.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(1)</text></g><g><rect x="420" y="245" width="60" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="450.0" y="269.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(0)</text></g><g><rect x="20" y="325" width="60" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="50.0" y="349.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(1)</text></g><g><rect x="110" y="325" width="60" height="38" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="140.0" y="349.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(0)</text></g><text x="24" y="411" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">Memoized: reuse stored f(2) = 1</text><g><rect x="25" y="435" width="86" height="34" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="457.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(0)</text></g><g><rect x="115" y="435" width="86" height="34" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="158.0" y="457.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(1)</text></g><g><rect x="205" y="435" width="86" height="34" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="457.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(2)</text></g><g><rect x="295" y="435" width="86" height="34" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="338.0" y="457.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(3)</text></g><g><rect x="385" y="435" width="86" height="34" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="428.0" y="457.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">f(4)</text></g><g><rect x="25" y="474" width="86" height="34" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="68.0" y="496.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0</text></g><g><rect x="115" y="474" width="86" height="34" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="158.0" y="496.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="205" y="474" width="86" height="34" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="248.0" y="496.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1</text></g><g><rect x="295" y="474" width="86" height="34" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="338.0" y="496.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2</text></g><g><rect x="385" y="474" width="86" height="34" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="428.0" y="496.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">3</text></g><text x="24" y="538" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Bases: f(0)=0, f(1)=1; recurrence adds two children.</text><text x="24" y="560" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
