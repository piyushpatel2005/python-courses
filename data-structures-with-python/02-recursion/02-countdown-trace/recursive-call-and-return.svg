<svg xmlns="http://www.w3.org/2000/svg" width="500" height="470" viewBox="0 0 500 470" role="img" aria-labelledby="title desc"><title id="title">Calls descend; returns unwind</title><desc id="desc">A countdown called with 2 calls 1, then 0. Zero is the base case. All calls return None, unwinding from 0 to 1 to 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/></marker></defs><rect width="500" height="470" fill="#ffffff"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033">Calls descend; returns unwind</text><text x="40" y="78" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">CALLS</text><text x="300" y="78" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">RETURNS</text><g><rect x="35" y="100" width="145" height="48" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="107.5" y="129.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">count(2)</text></g><g><rect x="285" y="100" width="180" height="48" rx="5" fill="#ede9fe" stroke="#526279" stroke-width="1.5"/><text x="375.0" y="129.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">2 returns None</text></g><path data-connector="true" d="M 107,148 L 107,190" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 375,190 L 375,148" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="35" y="190" width="145" height="48" rx="5" fill="#dbeafe" stroke="#526279" stroke-width="1.5"/><text x="107.5" y="219.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">count(1)</text></g><g><rect x="285" y="190" width="180" height="48" rx="5" fill="#ede9fe" stroke="#526279" stroke-width="1.5"/><text x="375.0" y="219.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">1 returns None</text></g><path data-connector="true" d="M 107,238 L 107,280" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><path data-connector="true" d="M 375,280 L 375,238" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="35" y="280" width="145" height="48" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="107.5" y="309.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">count(0)</text></g><g><rect x="285" y="280" width="180" height="48" rx="5" fill="#dcfce7" stroke="#526279" stroke-width="1.5"/><text x="375.0" y="309.6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#172033">0 returns None</text></g><path data-connector="true" d="M 180,304 L 285,304" fill="none" stroke="#526279" stroke-width="1.8" marker-end="url(#arrow)"/><text x="35" y="368" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#172033">At 0: no child call; start returning.</text><text x="24" y="428" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#172033">Definition: recurse only while n &gt; 0.</text><text x="24" y="450" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#475569">Illustrative data • not the exercise input</text></svg>
