<svg xmlns="http://www.w3.org/2000/svg" width="600" height="590" viewBox="0 0 600 590" role="img" aria-labelledby="title desc">
<title id="title">A Service Uses Another Object</title><desc id="desc">A local MatchService keeps an injected ScoreRule object and delegates score(points) to it. Standard and fake rules share the score method. This is local game logic, not a network service.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#40566f"/></marker></defs>
<rect width="600" height="590" rx="18" fill="#f8fafd"/>
<rect x="24" y="24" width="552" height="5" rx="2" fill="#3974bd"/>
<text x="300" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#172c46">A Service Uses Another Object</text>
<text x="300" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#40566f">CONCEPTUAL MODEL · ILLUSTRATIVE EXAMPLE</text>
<g data-card="true"><rect x="65" y="120" width="470" height="92" rx="12" fill="#e8f1ff" stroke="#91a7bd" stroke-width="1.5"/>
<text x="300.0" y="159.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172c46">MatchService</text>
<text x="300.0" y="187.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172c46">self.rule = rule</text>
</g>
<path data-connector="true" d="M300 212 L300 282" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="432" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#172c46">Delegates score</text>
<g data-card="true"><rect x="65" y="282" width="470" height="92" rx="12" fill="#ddf5ee" stroke="#91a7bd" stroke-width="1.5"/>
<text x="300.0" y="321.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172c46">Injected ScoreRule Object</text>
<text x="300.0" y="349.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172c46">self.rule.score(points)</text>
</g>
<text x="300" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172c46">Choose the rule when constructing the match service</text>
<g data-card="true"><rect x="35" y="438" width="250" height="76" rx="12" fill="#eee8ff" stroke="#91a7bd" stroke-width="1.5"/>
<text x="160.0" y="469.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172c46">Standard Rule</text>
<text x="160.0" y="497.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172c46">Local game scoring</text>
</g>
<g data-card="true"><rect x="315" y="438" width="250" height="76" rx="12" fill="#fff1d7" stroke="#91a7bd" stroke-width="1.5"/>
<text x="440.0" y="469.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172c46">Fake Rule</text>
<text x="440.0" y="497.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#172c46">Used in tests</text>
</g>
<text x="300" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#40566f">The service has a rule; it is not a rule.</text>
</svg>
