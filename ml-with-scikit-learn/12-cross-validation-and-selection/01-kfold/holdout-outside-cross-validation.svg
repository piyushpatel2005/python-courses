<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="480" height="620" role="img" aria-labelledby="title desc"><title id="title">Keep the Final Test Outside CV</title><desc id="desc">Separate 120-row illustration: 90 development observations form three 30-row folds; 30 final test rows remain unused while choosing settings.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="480" height="620" fill="#f8fafc"/><text x="240" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172033">Keep the Final Test Outside CV</text><text x="240" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Separate illustration: 120 rows</text><rect x="40" y="80" width="400" height="55" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="240" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">Split Before Learning Any Statistics</text><polyline points="240,135 240,151" fill="none" stroke="#334155" stroke-width="2"/><polyline points="240,151 160,151 160,175" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#tip)"/><polyline points="240,151 390,151 390,175" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#tip)"/><rect x="20" y="175" width="280" height="70" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="160" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">90 Development Rows</text><text x="160" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">A = 30, B = 30, C = 30</text><rect x="320" y="175" width="140" height="310" rx="8" fill="#ffedd5" stroke="#334155" stroke-width="2"/><text x="390" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">30 Final</text><text x="390" 