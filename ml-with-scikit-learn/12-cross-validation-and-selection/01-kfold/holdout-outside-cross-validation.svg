#172033">C (T)</text><rect x="30" y="416" width="80" height="47" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="70" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">A (T)</text><rect x="118" y="416" width="80" height="47" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="158" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">B (T)</text><rect x="206" y="416" width="80" height="47" rx="8" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="246" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">C (V)</text><rect x="20" y="505" width="440" height="85" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="240" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">Each Fold: Fit on 60, Validate on 30</text><text x="240" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">Fit a fresh whole pipeline in every row above</text></svg>