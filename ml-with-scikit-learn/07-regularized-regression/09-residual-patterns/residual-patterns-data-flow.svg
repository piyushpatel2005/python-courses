<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">Residuals Keep Their Row Pairing</title><desc id="desc">Actual demo predictions and observed-minus-predicted residuals form a curved scatter around zero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="520" height="440" fill="#f8fafc"/><text x="260" y="45.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">Residuals Keep Their Row Pairing</text><polyline points="70.0,85.0 70.0,345.0 455.0,345.0" fill="none" stroke="#334155" stroke-width="2"/><polyline points="70.0,225.0 455.0,225.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/><circle cx="85" cy="133" r="5" fill="#2563eb"/><text x="85" y="121.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">(10, +4)</text><circle cx="165" cy="248" r="5" fill="#2563eb"/><text x="165" y="274.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">(20, -1)</text><circle cx="245" cy="294" r="5" fill="#2563eb"/><text x="245" y="320.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">(30, -3)</text><circle cx="325" cy="248" r="5" fill="#2563eb"/><text x="325" y="274.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">(40, -1)</text><circle cx="405" cy="133" r="5" fill="#2563eb"/><text x="405" y="121.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">(50, +4)</text><text x="265" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Predicted Price (USD)</text><text x="260" y="78.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Observed - Predicted (USD)</text><text x="