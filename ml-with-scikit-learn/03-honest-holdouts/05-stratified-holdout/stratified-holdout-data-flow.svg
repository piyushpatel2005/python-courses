<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
<title id="title">Stratified Holdout: concrete data flow</title>
<desc id="desc">Original Class Counts. 64 zeros + 16 ones = 80 rows. Positive share: 16 / 80 = 0.20. Training: 60 Rows. 48 zeros + 12 ones. Each row ID occurs once. Holdout: 20 Rows. 16 zeros + 4 ones. Class shares retained, not time safety</desc>
<rect width="560" height="700" fill="#ffffff"/>
<text x="280" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243247">Stratified Holdout</text>
<rect x="30" y="70" width="500" height="166" rx="12" fill="#dbeafe" stroke="#243247" stroke-width="2"/>
<text x="280" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Original Class Counts</text>
<text x="280" y="159" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">64 zeros + 16 ones = 80 rows</text>
<text x="280" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Positive share: 16 / 80 = 0.20</text>
<path d="M280 236 V277" fill="none" stroke="#243247" stroke-width="2"/><path d="M274 268 L280 277 L286 268" fill="none" stroke="#243247" stroke-width="2"/>
<rect x="30" y="277" width="500" height="166" rx="12" fill="#ede9fe" stroke="#243247" stroke-width="2"/>
<text x="280" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Training: 60 Rows</text>
<text x="280" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">48 zeros + 12 ones</text>
<text x="280" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Each row ID occurs once</text>
<rect x="30" y="484" width="500" height="166" rx="12" fill="#dcfce7" stroke="#243247" stroke-width="2"/>
<text x="280" y="549" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Holdout: 20 Rows</text>
<text x="280" y="573" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">16 zeros + 4 ones</text>
<text x="280" y="597" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Class shares retained, not time safety</text>
<path d="M30 153 H15 V567 H30" fill="none" stroke="#243247" stroke-width="2"/><path d="M21 561 L30 567 L21 573" fill="none" stroke="#243247" stroke-width="2"/>
<text x="280" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243247">Original teaching figure; rows and states shown explicitly</text>
</svg>
