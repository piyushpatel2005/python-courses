<title id="title">Preprocessing Leakage: concrete data flow</title>
<desc id="desc">Small Worked Example (8 Rows). [2, 4, 6, 8, 10, 12, 14, 16] kg. Only these 8 rows reach fit. Learned Training State. mean_ = 9 kg; n_samples_seen_ = 8. Validation cannot alter this state. Validation: [100, 120] kg. transform with saved mean and scale. 2 rows out; no fit on this branch</desc>
<rect width="560" height="700" fill="#ffffff"/>
