<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
<title id="title">Synthetic Data: concrete data flow</title>
<desc id="desc">Generator Configuration. n_samples=80; n_features=2. n_informative=2; noise=3.0. Explicit random_state. 17 reproduces fixture A. 29 produces a different fixture B. Synthetic Outputs. X: (80, 2); y: (80,). Unitless teaching data, not orders</desc>
