<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1130" viewBox="0 0 560 1130" role="img" aria-labelledby="title desc">
<title id="title">Robust Scaling: concrete data flow</title>
<desc id="desc">Small Worked Example (8 Rows). 2, 4, 6, 8, 10, 12, 14, 100 kg. Both scalers see identical rows. Median And IQR. Median = 9; Q1 = 5.5; Q3 = 12.5. Robust scale = 7 kg. Queries: 8 kg And 100 kg. Robust outputs: -0.143 and 13. No row is removed or clipped</desc>
<rect width="560" height="1130" fill="#ffffff"/>
<text x="280" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243247">Robust Scaling</text>
