<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1130" viewBox="0 0 560 1130" role="img" aria-labelledby="title desc">
<title id="title">Minmax Scaling: concrete data flow</title>
<desc id="desc">Separate Training Interval. Minimum 2 kg; maximum 6 kg. Fit stores these two endpoints. Map Raw Values. 2 -&gt; 0; 4 -&gt; 0.5; 6 -&gt; 1. Preserve position within the interval. Outside Query: 8 kg. (8 - 2) / (6 - 2) = 1.5. clip=False preserves the extrapolation</desc>
<rect width="560" height="1130" fill="#ffffff"/>
<text x="280" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243247">Minmax Scaling</text>
<rect x="30" y="70" width="500" height="166" rx="12" fill="#dbeafe" stroke="#243247" stroke-width="2"/>
<text x="280" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Separate Training Interval</text>
<text x="280" y="159" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Minimum 2 kg; maximum 6 kg</text>
<text x="280" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Fit stores these two endpoints</text>
<path d="M280 236 V277" fill="none" stroke="#243247" stroke-width="2"/><path d="M274 268 L280 277 L286 268" fill="none" stroke="#243247" stroke-width="2"/>
<rect x="30" y="277" width="500" height="166" rx="12" fill="#ede9fe" stroke="#243247" stroke-width="2"/>
<text x="280" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Map Raw Values</text>
<text x="280" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">2 -&gt; 0; 4 -&gt; 0.5; 6 -&gt; 1</text>
<text x="280" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Preserve position within the interval</text>
<path d="M280 443 V484" fill="none" stroke="#243247" stroke-width="2"/><path d="M274 475 L280 484 L286 475" fill="none" stroke="#243247" stroke-width="2"/>
<rect x="30" y="484" width="500" height="166" rx="12" fill="#dcfce7" stroke="#243247" stroke-width="2"/>
<text x="280" y="549" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Outside Query: 8 kg</text>
<text x="280" y="573" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">(8 - 2) / (6 - 2) = 1.5</text>
<text x="280" y="597" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">clip=False preserves the extrapolation</text>
<text x="280" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">Min-Max Value</text>
<path d="M90 760 L90 1000" fill="none" stroke="#243247" stroke-width="2"/>
<path d="M90 1000 L490 1000" fill="none" stroke="#243247" stroke-width="2"/>
<circle cx="105.0" cy="985.0" r="5" fill="#2563eb"/>
<path d="M105.0 985.0 L228.33333333333331 915.0" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="228.33333333333331" cy="915.0" r="5" fill="#2563eb"/>
<path d="M228.33333333333331 915.0 L351.66666666666663 845.0" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="351.66666666666663" cy="845.0" r="5" fill="#2563eb"/>
<path d="M351.66666666666663 845.0 L475.0 775.0" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="475.0" cy="775.0" r="5" fill="#2563eb"/>
<text x="78" y="991" text-anchor="end" font-family="Arial" font-size="16" fill="#243247">0</text>
<text x="78" y="781" text-anchor="end" font-family="Arial" font-size="16" fill="#243247">1.5</text>
<text x="105" y="1028" text-anchor="middle" font-family="Arial" font-size="16" fill="#243247">2</text>
<text x="475" y="1028" text-anchor="middle" font-family="Arial" font-size="16" fill="#243247">8</text>
<text x="280" y="1060" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Raw Weight (kg): Example</text>
<text x="280" y="1086" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243247">Points follow the displayed fitted rule</text>
<text x="280" y="1112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243247">Original teaching figure; rows and states shown explicitly</text>
</svg>
