<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">A Signed Linear Decision Boundary</title><desc id="desc">Illustrative two-dimensional scaled coordinates. A central decision line is flanked by margin reference lines.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="520" height="440" fill="#f8fafc"/><text x="260" y="45.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">A Signed Linear Decision Boundary</text><text x="260" y="77.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Illustrative Scaled Feature Plane</text><polyline points="70.0,320.0 455.0,320.0" fill="none" stroke="#334155" stroke-width="2"/><polyline points="70.0,105.0 70.0,320.0" fill="none" stroke="#334155" stroke-width="2"/><polyline points="260.0,105.0 260.0,320.0" fill="none" stroke="#334155" stroke-width="2"/><polyline points="210.0,105.0 210.0,320.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/><polyline points="310.0,105.0 310.0,320.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/><circle cx="110" cy="145" r="7" fill="#2563eb"/><circle cx="155" cy="215" r="7" fill="#2563eb"/><circle cx="190" cy="280" r="7" fill="#2563eb"/><circle cx="330" cy="145" r="7" fill="#7c3aed"/><circle cx="390" cy="220" r="7" fill="#7c3aed"/><circle cx="440" cy="280" r="7" fill="#7c3aed"/><text x="145" y="353.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">z &lt; 0</text><text x="260" y="353.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">z = 0</text><text x="380" y="353.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">z &gt; 0</text><rect x="30" y="378" width="460" h