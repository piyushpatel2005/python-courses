<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" width="480" height="680" role="img" aria-labelledby="title desc"><title id="title">Projection Keeps a Direction, Not a Column</title><desc id="desc">Separate centered four-point example: (-3,-1), (-1,-3), (1,3), (3,1). The first principal direction is diagonal, explains 80 percent of variance, and projects (3,1) onto (2,2). This is not the digits fit.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="480" height="680" fill="#f8fafc"/><text x="240" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172033">A Component Combines Columns</text><text x="240" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Separate 2D illustration, not the digits fit</text><polyline points="90,240 390,240" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#tip)"/><polyline points="240,390 240,90" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#tip)"/><text x="407" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">x</text><text x="241" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">y</text><polyline points="120,360 360,120" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#tip)"/><circle cx="135" cy="275" r="5" fill="#2563eb" stroke="#334155"/><circle cx="205" cy="345" r="5" fill="#2563eb" stroke="#334155"/><circle cx="275" cy="135" r="5" fill="#2563eb" stroke="#334155"/><circle cx="345" cy="205" r="5" fill="#2563eb" stroke="#334155"/><circle cx="310" cy="170" r="6" fill="#16a34a" stroke="#334155"/><polyline points="345,205 310,170" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/><text x="385" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">(3, 1)</text><text x="356" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">(2, 2)</text><text x="135" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">(-3, -1)</text><text x="154" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">(-1, -3)</text><text x="292" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">(1, 3)</text><rect x="20" y="415" width="440" height="125" rx="8" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="240" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">PC1 coordinate = (x + y) / sqrt(2)</text><text x="240" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">(3, 1) becomes 2 sqrt(2)</text><text x="240" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">Reconstruction: (2, 2)</text><text x="240" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">The discarded offset is (1, -1)</text><text x="240" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">Variance in This Four-Point Example</text><rect x="30" y="587" width="336" height="35" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="366" y="587" width="84" height="35" rx="8" fill="#ffedd5" stroke="#334155" stroke-width="2"/><text x="198" y="611" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">80% retained</text><text x="408" y="611" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">20%</text><text x="240" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">Retained variance is not prediction accuracy</text></svg>