<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" role="img" aria-labelledby="title desc">
<title id="title">Build the regression pipeline</title><desc id="desc">Raw project row through imputed scaled and predicted states</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs>
<rect width="520" height="390" fill="#f8fafc"/>
<text x="260.0" y="32.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">Build the regression pipeline</text>
<rect x="26" y="76" width="468" height="76" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="260.0" y="107.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Raw Training Matrix</text>
<text x="260.0" y="130.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">weight_kg | volume_l | material cost</text>
<path d="M260 152 V176" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="26" y="176" width="468" height="76" rx="10" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="260.0" y="207.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Learn On Training</text>
<text x="260.0" y="230.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">median impute → standard scale</text>
<path d="M260 252 V276" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="26" y="276" width="468" height="76" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="260.0" y="307.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Ridge Prediction</text>
<text x="260.0" y="330.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">reuse statistics for missing queries</text>
