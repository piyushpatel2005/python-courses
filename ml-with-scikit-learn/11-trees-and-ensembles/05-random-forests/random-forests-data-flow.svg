<text x="240" y="202.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#172033">8, 11, 11 USD</text>
<path d="M240 235 L240 268" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/>
