<text x="240" y="302.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#172033">Mean = 10 USD</text>
<text x="240" y="327.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#172033">Editor Uses 10 Trees</text>
