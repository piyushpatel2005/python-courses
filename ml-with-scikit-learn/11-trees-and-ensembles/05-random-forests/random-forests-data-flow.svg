<rect x="55" y="20" width="370" height="90" rx="10" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="240" y="52.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#172033">Bootstrap Rows Per Tree</text>
<text x="240" y="77.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#172033">[A, A, C] / [B, C, C]</text>
<path d="M240 110 L240 143" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#head)"/>
