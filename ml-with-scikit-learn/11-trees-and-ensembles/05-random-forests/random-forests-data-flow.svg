<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc"><title id="title">Average randomized trees</title><desc id="desc">Bootstrap Rows Per Tree
[A, A, C] / [B, C, C]. Then Illustrative Tree Outputs
8, 11, 11 USD. Then Mean = 10 USD
