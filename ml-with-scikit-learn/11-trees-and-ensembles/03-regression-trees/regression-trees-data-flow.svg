<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc"><title id="title">Predict leaf means</title><desc id="desc">Sorted Inputs: 1, 2, 7, 8
