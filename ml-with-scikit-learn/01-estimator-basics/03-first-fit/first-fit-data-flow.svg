<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1130" viewBox="0 0 560 1130" role="img" aria-labelledby="title desc">
<title id="title">First Fit: concrete data flow</title>
<desc id="desc">Training Observations. X: [1, 2, 3, 4] kg, shape (4, 1). y: [5, 7, 9, 11] USD. fit(X, y). fit_intercept=True; one feature. Training rows determine the line. Learned State. coef_ = [2]; intercept_ = 3. 5 kg gives 3 + 2 x 5 = 13 USD</desc>
