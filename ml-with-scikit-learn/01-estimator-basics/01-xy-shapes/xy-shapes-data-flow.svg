<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
<title id="title">Xy Shapes: concrete data flow</title>
<desc id="desc">Paired Rows: X | y. r0: [1, 4] | 5    r1: [2, 7] | 7. r2: [3, 8] | 9    r3: [4, 12] | 11. Feature Slice: First Two Columns. X: 4 rows x 2 features. Target column excluded. Target Slice: Last Column. y: [5, 7, 9, 11]   shape (4,). Row order stays r0, r1, r2, r3</desc>
