<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 550" width="480" height="550" role="img" aria-labelledby="title desc"><title id="title">One Row, Two Transformations</title><desc id="desc">The corrected demo scales weight 1 using training mean 3 and population variance 2.5, and encodes wood in glass, steel, wood order. IDs remain outside features.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="480" height="550" fill="#f8fafc"/><text x="240" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#172033">One Row, Two Transformations</text><text x="240" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">A row from the corrected demo</text><rect x="35" y="80" width="410" height="80" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="240" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">A: weight = 1 kg, material = wood</text><text x="240" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">product_id is an audit key, not a feature</text><polyline points="240,160 240,182" fill="none" stroke="#334155" stroke-width="2"/><polyline points="240,182 120,182 120,210" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#tip)"/><polyline points="240,182 360,182 360,210" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#tip)"/><rect x="20" y="210" width="200" height="150" rx="8" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="120" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">Numeric Branch</text><text x="120" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">mean = 3</text><text x="120" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">scale = sqrt(2.5)</text><text x="120" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">(1 - 3) / scale</text><rect x="260" y="210" width="200" height="150" rx="8" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="360" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">Category Branch</text><text x="360" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">glass | steel | wood</text><text x="360" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">wood becomes</text><text x="360" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">[0, 0, 1]</text><polyline points="120,360 120,383 240,383 240,410" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#tip)"/><polyline points="360,360 360,383 240,383" fill="none" stroke="#334155" stroke-width="2"/><rect x="25" y="410" width="430" height="105" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="240" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">Combined Row</text><text x="240" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">[-1.2649, 0, 0, 1]</text><text x="240" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">1 numeric + 3 category columns = 4</text></svg>