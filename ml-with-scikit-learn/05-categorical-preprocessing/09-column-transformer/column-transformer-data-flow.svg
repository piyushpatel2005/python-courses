<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">Named Columns, Separate Branches</title><desc id="desc">One clean numeric feature and one nominal feature follow different branches. IDs are dropped.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="520" height="440" fill="#f8fafc"/><text x="260" y="45.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">Named Columns, Separate Branches</text><rect x="80" y="65" width="360" height="60" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="260.0" y="99.95" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">weight_kg | material | product_id</text><polyline points="260.0,125.0 260.0,148.0" fill="none" stroke="#334155" stroke-width="2"/><polyline points="260.0,148.0 130.0,148.0 130.0,175.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><polyline points="260.0,148.0 390.0,148.0 390.0,175.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="175" width="210" height="85" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="130.0" y="200.35" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Numeric Branch</text><text x="130.0" y="222.45" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">StandardScaler</text><text x="130.0" y="244.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">1 output column</text><rect x="285" y="175" width="210" height="85" rx="8" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="390.0" y="200.35" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Category Branch</text><text x="390.0" y="222.45" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">OneHotEncoder</text><text x="390.0" y="244.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">3 output columns</text><polyline points="130.0,260.0 130.0,290.0 260.0,290.0" fill="none" stroke="#334155" stroke-width="2"/><polyline points="390.0,260.0 390.0,290.0 260.0,290.0" fill="none" stroke="#334155" stroke-width="2"/><polyline points="260.0,290.0 260.0,320.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="320" width="430" height="70" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="260.0" y="348.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Join In Branch Order</text><text x="260.0" y="371.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">1 scaled + 3 indicators = 4 columns</text><text x="260" y="422.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">product_id is not selected: remainder=&quot;drop&quot;</text></svg>