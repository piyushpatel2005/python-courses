<svg xmlns="http://www.w3.org/2000/svg" width="560" height="610" viewBox="0 0 560 610" role="img" aria-labelledby="title desc"><title id="title">Training And Inference</title><desc id="desc">Two separate stages: training builds a model from labeled examples; inference applies it to new inputs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="610" fill="#fff"/><text x="280" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">Training And Inference</text><text x="280" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Training: answers are known</text><rect x="130" y="104" width="300" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="148.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Past inputs + labels</text><line x1="280" y1="176" x2="280" y2="212" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="212" width="300" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="256.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Learning algorithm</text><line x1="280" y1="284" x2="280" y2="320" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="320" width="300" height="64" rx="12" fill="#dcf4e8" stroke="#152c40" stroke-width="2"/><text x="280.0" y="360.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Fitted model</text><text x="280" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Inference: answer is not known</text><rect x="20" y="466" width="155" height="82" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="97.5" y="501.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">New</text><text x="97.5" y="529.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">inputs</text><rect x="203" y="466" width="154" height="82" rx="12" fill="#dcf4e8" stroke="#152c40" stroke-width="2"/><text x="280.0" y="501.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Fitted</text><text x="280.0" y="529.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">model</text><rect x="385" y="466" width="155" height="82" rx="12" fill="#fff0d8" stroke="#152c40" stroke-width="2"/><text x="462.5" y="501.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Predicted</text><text x="462.5" y="529.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">answer</text><line x1="175" y1="507" x2="203" y2="507" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><line x1="357" y1="507" x2="385" y2="507" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="588" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Inference need not update the model.</text></svg>