<svg xmlns="http://www.w3.org/2000/svg" width="560" height="850" viewBox="0 0 560 850" role="img" aria-labelledby="title desc"><title id="title">The Machine Learning Process</title><desc id="desc">Seven stages show a split before learned preparation, validation-based selection, a separate final test, and monitoring after deployment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="850" fill="#fff"/><text x="280" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#152c40">The Machine Learning Process</text><rect x="24" y="65" width="512" height="80" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">1. Define The Task</text><text x="280" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Output, prediction moment, useful result</text><line x1="280" y1="145" x2="280" y2="173" stroke="#152c40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="173" width="512" height="80" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">2. Collect And Check Data</text><text x="280" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Definitions, coverage, labels, permissions</text><line x1="280" y1="253" x2="280" y2="281" stroke="#152c40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="281" width="512" height="80" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">3. Split Before Learning Preparation</text><text x="280" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Training / validation / untouched test</text><line x1="280" y1="361" x2="280" y2="389" stroke="#152c40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="389" width="512" height="80" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="419" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">4. Train And Validate</text><text x="280" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Fit on training; select using validation</text><line x1="280" y1="469" x2="280" y2="497" stroke="#152c40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="497" width="512" height="80" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">5. Test The Fixed Choice</text><text x="280" y="556" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">One final assessment; no tuning here</text><line x1="280" y1="577" x2="280" y2="605" stroke="#152c40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="605" width="512" height="80" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">6. Deploy With A Fallback</text><text x="280" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Apply the fitted system to new inputs</text><line x1="280" y1="685" x2="280" y2="713" stroke="#152c40" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="713" width="512" height="80" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="743" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">7. Monitor And Review</text><text x="280" y="772" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">New development needs fresh evaluation</text></svg>