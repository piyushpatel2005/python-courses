<svg xmlns="http://www.w3.org/2000/svg" width="560" height="495" viewBox="0 0 560 495" role="img" aria-labelledby="title desc"><title id="title">Counting Classification Outcomes</title><desc id="desc">Rows show actual class and columns predicted class. Actual late: 6 predicted late, 2 predicted on time. Actual on time: 3 predicted late, 9 predicted on time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="495" fill="#fff"/><text x="280" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">Counting Classification Outcomes</text><text x="340" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Predicted class</text><text x="247" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Late</text><text x="434" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">On time</text><text x="82" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Actual</text><text x="82" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Late</text><text x="82" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">On time</text><rect x="164" y="156" width="166" height="120" rx="12" fill="#dcf4e8" stroke="#152c40" stroke-width="2"/><text x="247.0" y="196.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">6</text><text x="247.0" y="224.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Correct</text><text x="247.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">warning</text><rect x="351" y="156" width="185" height="120" rx="12" fill="#fff0d8" stroke="#152c40" stroke-width="2"/><text x="443.5" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">2</text><text x="443.5" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Missed late</text><rect x="164" y="296" width="166" height="120" rx="12" fill="#fff0d8" stroke="#152c40" stroke-width="2"/><text x="247.0" y="350.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">3</text><text x="247.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">False alarm</text><rect x="351" y="296" width="185" height="120" rx="12" fill="#dcf4e8" stroke="#152c40" stroke-width="2"/><text x="443.5" y="350.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">9</text><text x="443.5" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Correct on time</text><text x="280" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">20 invented trips • Positive class: late</text></svg>