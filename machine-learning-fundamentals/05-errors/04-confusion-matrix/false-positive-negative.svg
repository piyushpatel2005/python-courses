<svg xmlns="http://www.w3.org/2000/svg" width="560" height="600" viewBox="0 0 560 600" role="img" aria-labelledby="title desc"><title id="title">Two Different Classification Errors</title><desc id="desc">Of the same 20 observations used in the confusion matrix, three on-time deliveries are falsely flagged and two late deliveries are missed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="600" fill="#fff"/><text x="280" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#152c40">Two Different Classification Errors</text><text x="280" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Positive class = late</text><rect x="24" y="105" width="512" height="164" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">False Positive</text><text x="280" y="171" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Actually on time; predicted late</text><circle cx="200.0" cy="208" r="9" fill="#a64b13"/><circle cx="240.0" cy="208" r="9" fill="#a64b13"/><circle cx="280.0" cy="208" r="9" fill="#a64b13"/><text x="280" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">3 of the 20 examples</text><rect x="24" y="295" width="512" height="164" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">False Negative</text><text x="280" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Actually late; predicted on time</text><circle cx="220.0" cy="398" r="9" fill="#1765a3"/><circle cx="260.0" cy="398" r="9" fill="#1765a3"/><text x="280" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">2 of the 20 examples</text><text x="280" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">The other 15 predictions are correct.</text><text x="280" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Counts describe types, not delay sizes.</text></svg>