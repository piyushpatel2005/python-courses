<svg xmlns="http://www.w3.org/2000/svg" width="560" height="710" viewBox="0 0 560 710" role="img" aria-labelledby="title desc"><title id="title">Absolute Versus Squared Error</title><desc id="desc">Absolute penalties of 1,2,4 minutes correspond to squared penalties of 1,4,16 squared minutes. The panels use different units and scales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="710" fill="#fff"/><text x="280" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#152c40">Absolute Versus Squared Error</text><text x="280" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Miss sizes: 1, 2, and 4 minutes</text><rect x="22" y="95" width="516" height="240" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Absolute Penalty</text><text x="67" y="156" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#152c40">Minutes</text><line x1="65" y1="276" x2="505" y2="276" stroke="#526575" stroke-width="2"/><rect x="90" y="252.75" width="50" height="23.25" rx="8" fill="#d3e6f4" stroke="#1765a3"/><text x="115" y="242.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">1</text><text x="115" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">1</text><rect x="225" y="229.5" width="50" height="46.5" rx="8" fill="#d3e6f4" stroke="#1765a3"/><text x="250" y="219.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">2</text><text x="250" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">2</text><rect x="360" y="183.0" width="50" height="93.0" rx="8" fill="#d3e6f4" stroke="#1765a3"/><text x="385" y="173.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">4</text><text x="385" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">4</text><rect x="22" y="355" width="516" height="240" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Squared Penalty</text><text x="67" y="416" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#152c40">Squared minutes</text><line x1="65" y1="536" x2="505" y2="536" stroke="#526575" stroke-width="2"/><rect x="90" y="530.1875" width="50" height="5.8125" rx="8" fill="#d3e6f4" stroke="#1765a3"/><text x="115" y="520.1875" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">1</text><text x="115" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">1</text><rect x="225" y="512.75" width="50" height="23.25" rx="8" fill="#d3e6f4" stroke="#1765a3"/><text x="250" y="502.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">4</text><text x="250" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">2</text><rect x="360" y="443.0" width="50" height="93.0" rx="8" fill="#d3e6f4" stroke="#1765a3"/><text x="385" y="433.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">16</text><text x="385" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">4</text><text x="280" y="643" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Horizontal labels: original miss in minutes</text><text x="280" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Bar heights use different vertical units.</text></svg>