<svg xmlns="http://www.w3.org/2000/svg" width="560" height="580" viewBox="0 0 560 580" role="img" aria-labelledby="title desc"><title id="title">Signed Numerical Errors</title><desc id="desc">Actual targets are 18 and 25 minutes; predictions are 20 and 21 minutes. Vertical gaps have residuals minus two and plus four minutes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="580" fill="#fff"/><text x="280" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#152c40">Signed Numerical Errors</text><text x="280" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Residual = actual − predicted</text><line x1="175" y1="305" x2="175" y2="325" stroke="#a64b13" stroke-width="4"/><circle cx="175" cy="325" r="9" fill="#1765a3"/><rect x="167" y="297" width="16" height="16" fill="#a64b13"/><text x="195" y="321.0" text-anchor="start" font-family="Arial,sans-serif" font-size="23" fill="#152c40">-2</text><text x="175" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Example 1</text><line x1="390" y1="295" x2="390" y2="255" stroke="#a64b13" stroke-width="4"/><circle cx="390" cy="255" r="9" fill="#1765a3"/><rect x="382" y="287" width="16" height="16" fill="#a64b13"/><text x="410" y="281.0" text-anchor="start" font-family="Arial,sans-serif" font-size="23" fill="#152c40">4</text><text x="390" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Example 2</text><line x1="75" y1="405" x2="500" y2="405" stroke="#526575" stroke-width="2"/><line x1="75" y1="405" x2="75" y2="160" stroke="#526575" stroke-width="2"/><text x="75" y="123" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Minutes</text><text x="56" y="412" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#152c40">10</text><text x="56" y="362" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#152c40">15</text><text x="56" y="312" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#152c40">20</text><text x="56" y="262" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#152c40">25</text><text x="56" y="212" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#152c40">30</text><circle cx="95" cy="500" r="8" fill="#1765a3"/><text x="175" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Actual</text><rect x="315" y="492" width="16" height="16" fill="#a64b13"/><text x="415" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Predicted</text><text x="280" y="547" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">First: −2 minutes   Second: +4 minutes</text></svg>