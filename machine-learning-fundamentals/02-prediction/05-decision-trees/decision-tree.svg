<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-labelledby="title desc"><title id="title">Following One Tree Path</title><desc id="desc">Toy distance and queue questions send each trip down one path to a predicted class.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="560" fill="#fff"/><text x="280" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">Following One Tree Path</text><rect x="155" y="75" width="250" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="119.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Distance ≤ 3 km?</text><line x1="155" y1="111" x2="90" y2="111" stroke="#152c40" stroke-width="3"/><line x1="90" y1="111" x2="90" y2="218" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><text x="57" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Yes</text><rect x="20" y="218" width="140" height="76" rx="12" fill="#dcf4e8" stroke="#152c40" stroke-width="2"/><text x="90.0" y="264.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">On time</text><line x1="405" y1="111" x2="440" y2="111" stroke="#152c40" stroke-width="3"/><line x1="440" y1="111" x2="440" y2="185" stroke="#152c40" stroke-width="3"/><line x1="440" y1="185" x2="412.5" y2="185" stroke="#152c40" stroke-width="3"/><line x1="412.5" y1="185" x2="412.5" y2="218" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">No</text><rect x="285" y="218" width="255" height="76" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="412.5" y="264.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Long queue?</text><line x1="412.5" y1="294" x2="412.5" y2="332" stroke="#152c40" stroke-width="3"/><line x1="340" y1="332" x2="480" y2="332" stroke="#152c40" stroke-width="3"/><line x1="340" y1="332" x2="340" y2="386" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><text x="301" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Yes</text><line x1="480" y1="332" x2="480" y2="493" stroke="#152c40" stroke-width="3"/><line x1="480" y1="493" x2="430" y2="493" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><text x="510" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">No</text><rect x="250" y="386" width="180" height="62" rx="12" fill="#fff0d8" stroke="#152c40" stroke-width="2"/><text x="340.0" y="425.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Late</text><rect x="250" y="462" width="180" height="62" rx="12" fill="#dcf4e8" stroke="#152c40" stroke-width="2"/><text x="340.0" y="501.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">On time</text></svg>