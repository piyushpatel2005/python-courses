<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img" aria-labelledby="title desc"><title id="title">Successive Corrections</title><desc id="desc">Toy boosted predictions start at 20 minutes, add 2, then subtract 1 to reach 21 minutes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="500" fill="#fff"/><text x="280" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">Successive Corrections</text><rect x="130" y="75" width="300" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="119.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Current: 20 min</text><line x1="280" y1="147" x2="280" y2="225" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><text x="392" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Add 2 min</text><rect x="130" y="225" width="300" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="269.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Updated: 22 min</text><line x1="280" y1="297" x2="280" y2="375" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><text x="397" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Subtract 1 min</text><rect x="130" y="375" width="300" height="72" rx="12" fill="#dcf4e8" stroke="#152c40" stroke-width="2"/><text x="280.0" y="419.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Updated: 21 min</text><text x="280" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Toy corrections, not measured results</text></svg>