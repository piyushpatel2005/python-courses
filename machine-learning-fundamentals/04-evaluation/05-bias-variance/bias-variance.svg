<svg xmlns="http://www.w3.org/2000/svg" width="560" height="680" viewBox="0 0 560 680" role="img" aria-labelledby="title desc"><title id="title">Bias And Variance Intuition</title><desc id="desc">Illustrative predictions at one fixed input are tightly grouped below an underlying mean in the first panel and spread widely in the second.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="680" fill="#fff"/><text x="280" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#152c40">Bias And Variance Intuition</text><text x="280" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">One input; three fitted-model predictions</text><rect x="24" y="95" width="512" height="217" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Systematic Mismatch</text><line x1="85" y1="242" x2="485" y2="242" stroke="#526575" stroke-width="2"/><text x="85.0" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">0</text><text x="285.0" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">6</text><text x="485.0" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">12</text><line x1="285.0" y1="150" x2="285.0" y2="250" stroke="#286953" stroke-width="3" stroke-dasharray="6 5"/><circle cx="168.33333333333334" cy="197" r="8" fill="#1765a3"/><circle cx="185.0" cy="197" r="8" fill="#1765a3"/><circle cx="201.66666666666669" cy="197" r="8" fill="#1765a3"/><text x="280" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Predicted value</text><rect x="24" y="335" width="512" height="217" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Sensitivity To The Sample</text><line x1="85" y1="482" x2="485" y2="482" stroke="#526575" stroke-width="2"/><text x="85.0" y="517" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">0</text><text x="285.0" y="517" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">6</text><text x="485.0" y="517" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">12</text><line x1="285.0" y1="390" x2="285.0" y2="490" stroke="#286953" stroke-width="3" stroke-dasharray="6 5"/><circle cx="151.66666666666666" cy="437" r="8" fill="#1765a3"/><circle cx="285.0" cy="437" r="8" fill="#1765a3"/><circle cx="418.33333333333337" cy="437" r="8" fill="#1765a3"/><text x="280" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Predicted value</text><text x="280" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Dashed line: assumed underlying average</text><text x="280" y="653" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Dots: fits from different training samples</text></svg>