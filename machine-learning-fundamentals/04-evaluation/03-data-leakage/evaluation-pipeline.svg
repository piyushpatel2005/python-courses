<svg xmlns="http://www.w3.org/2000/svg" width="560" height="630" viewBox="0 0 560 630" role="img" aria-labelledby="title desc"><title id="title">Fit Once, Then Apply</title><desc id="desc">Preparation and prediction model are fitted on training data. Held-out features use those fitted steps unchanged; labels are reserved for scoring.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="630" fill="#fff"/><text x="280" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">Fit Once, Then Apply</text><text x="280" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Training data</text><rect x="115" y="100" width="330" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="144.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Fit preparation</text><line x1="280" y1="172" x2="280" y2="206" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><rect x="115" y="206" width="330" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="250.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Fit prediction model</text><text x="280" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Held-out data: no fitting</text><rect x="115" y="347" width="330" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="391.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Apply fitted preparation</text><line x1="280" y1="419" x2="280" y2="451" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><rect x="115" y="451" width="330" height="72" rx="12" fill="#e8f3fd" stroke="#152c40" stroke-width="2"/><text x="280.0" y="495.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Use fitted model</text><line x1="280" y1="523" x2="280" y2="555" stroke="#152c40" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="555" width="430" height="58" rx="12" fill="#dcf4e8" stroke="#152c40" stroke-width="2"/><text x="280.0" y="592.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Score against held-out labels</text></svg>