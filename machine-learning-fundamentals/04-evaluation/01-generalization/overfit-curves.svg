<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" role="img" aria-labelledby="title desc"><title id="title">Fit Versus Generalization</title><desc id="desc">Schematic error curves: training error decreases with complexity; validation error eventually increases.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="460" fill="#fff"/><text x="280" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">Fit Versus Generalization</text><text x="70" y="78" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Prediction error (schematic)</text><line x1="76" y1="345" x2="506" y2="345" stroke="#152c40" stroke-width="3"/><line x1="76" y1="345" x2="76" y2="100" stroke="#152c40" stroke-width="3"/><text x="290" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Increasing model complexity →</text><polyline points="80,130 150,198 230,246 310,286 390,310 500,322" fill="none" stroke="#1765a3" stroke-width="4"/><polyline points="80,118 150,181 230,208 310,197 390,159 500,108" fill="none" stroke="#a64b13" stroke-width="4" stroke-dasharray="8 6"/><line x1="100" y1="432" x2="134" y2="432" stroke="#1765a3" stroke-width="3"/><text x="146" y="440" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Training</text><line x1="292" y1="432" x2="326" y2="432" stroke="#a64b13" stroke-width="3" stroke-dasharray="8 6"/><text x="338" y="440" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Validation</text></svg>