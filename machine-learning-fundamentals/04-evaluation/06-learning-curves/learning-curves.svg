<svg xmlns="http://www.w3.org/2000/svg" width="560" height="735" viewBox="0 0 560 735" role="img" aria-labelledby="title desc"><title id="title">Learning Curves</title><desc id="desc">Two schematic error-versus-training-size plots show persistent high errors or a generalization gap narrowing as training examples increase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="735" fill="#fff"/><text x="280" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#152c40">Learning Curves</text><text x="280" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Fixed procedure within each panel</text><rect x="22" y="95" width="516" height="242" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">Both Errors Remain High</text><text x="67" y="156" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#152c40">Error</text><line x1="67" y1="285" x2="501" y2="285" stroke="#526575" stroke-width="2"/><line x1="67" y1="285" x2="67" y2="163" stroke="#526575" stroke-width="2"/><line x1="85" y1="245" x2="183" y2="231" stroke="#1765a3" stroke-width="3"/><line x1="183" y1="231" x2="281" y2="224" stroke="#1765a3" stroke-width="3"/><line x1="281" y1="224" x2="379" y2="220" stroke="#1765a3" stroke-width="3"/><line x1="379" y1="220" x2="477" y2="218" stroke="#1765a3" stroke-width="3"/><line x1="85" y1="191" x2="183" y2="200" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><line x1="183" y1="200" x2="281" y2="206" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><line x1="281" y1="206" x2="379" y2="209" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><line x1="379" y1="209" x2="477" y2="211" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><text x="280" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Training examples: fewer → more</text><rect x="22" y="355" width="516" height="242" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#152c40">A Gap Narrows With More Data</text><text x="67" y="416" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#152c40">Error</text><line x1="67" y1="545" x2="501" y2="545" stroke="#526575" stroke-width="2"/><line x1="67" y1="545" x2="67" y2="423" stroke="#526575" stroke-width="2"/><line x1="85" y1="535" x2="183" y2="523" stroke="#1765a3" stroke-width="3"/><line x1="183" y1="523" x2="281" y2="513" stroke="#1765a3" stroke-width="3"/><line x1="281" y1="513" x2="379" y2="506" stroke="#1765a3" stroke-width="3"/><line x1="379" y1="506" x2="477" y2="502" stroke="#1765a3" stroke-width="3"/><line x1="85" y1="427" x2="183" y2="449" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><line x1="183" y1="449" x2="281" y2="468" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><line x1="281" y1="468" x2="379" y2="479" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><line x1="379" y1="479" x2="477" y2="486" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><text x="280" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">Training examples: fewer → more</text><line x1="70" y1="656" x2="120" y2="656" stroke="#1765a3" stroke-width="3"/><text x="185" y="663" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Training</text><line x1="305" y1="656" x2="355" y2="656" stroke="#a64b13" stroke-width="3" stroke-dasharray="6 5"/><text x="432" y="663" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Validation</text><text x="280" y="703" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c4