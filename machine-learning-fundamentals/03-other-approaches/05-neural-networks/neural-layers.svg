<svg xmlns="http://www.w3.org/2000/svg" width="560" height="515" viewBox="0 0 560 515" role="img" aria-labelledby="title desc"><title id="title">A Small Neural Network</title><desc id="desc">Two input values connect to three hidden calculation units, which connect to one output. Lines show connections, not measured weight strengths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#152c40"/></marker></defs><rect width="560" height="515" fill="#fff"/><text x="280" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#152c40">A Small Neural Network</text><text x="95" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Inputs</text><text x="280" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Hidden Layer</text><text x="465" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Output</text><line x1="115" y1="190" x2="260" y2="150" stroke="#98aebe" stroke-width="2"/><line x1="115" y1="190" x2="260" y2="260" stroke="#98aebe" stroke-width="2"/><line x1="115" y1="190" x2="260" y2="370" stroke="#98aebe" stroke-width="2"/><line x1="115" y1="330" x2="260" y2="150" stroke="#98aebe" stroke-width="2"/><line x1="115" y1="330" x2="260" y2="260" stroke="#98aebe" stroke-width="2"/><line x1="115" y1="330" x2="260" y2="370" stroke="#98aebe" stroke-width="2"/><line x1="300" y1="150" x2="445" y2="260" stroke="#98aebe" stroke-width="2"/><line x1="300" y1="260" x2="445" y2="260" stroke="#98aebe" stroke-width="2"/><line x1="300" y1="370" x2="445" y2="260" stroke="#98aebe" stroke-width="2"/><circle cx="95" cy="190" r="20" fill="#1765a3"/><circle cx="95" cy="330" r="20" fill="#1765a3"/><circle cx="280" cy="150" r="20" fill="#1765a3"/><circle cx="280" cy="260" r="20" fill="#1765a3"/><circle cx="280" cy="370" r="20" fill="#1765a3"/><circle cx="465" cy="260" r="20" fill="#a64b13"/><text x="280" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#152c40">Connections carry learned weights.</text><text x="280" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#152c40">Hidden units apply nonlinear calculations.</text></svg>