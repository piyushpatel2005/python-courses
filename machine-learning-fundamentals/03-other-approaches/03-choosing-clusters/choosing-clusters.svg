200" r="8" fill="#a64b13"/><text x="452.8" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">9</text><line x1="142.4" y1="160" x2="158.4" y2="176" stroke="#1765a3" stroke-width="4"/><line x1="142.4" y1="176" x2="158.4" y2="160" stroke="#1765a3" stroke-width="4"/><line x1="401.6" y1="160" x2="417.6" y2="176" stroke="#a64b13" stroke-width="4"/><line x1="401.6" y1="176" x2="417.6" y2="160" stroke="#a64b13" stroke-width="4"/><rect x="22" y="285" width="516" height="166" rx="8" fill="#f0f5f8" stroke="#bacbd7"/><text x="280" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#152c40">k = 3</text><line x1="64" y1="390" x2="496" y2="390" stroke="#526575" stroke-width="2"/><circle cx="107.2" cy="390" r="8" fill="#1765a3"/><text x="107.2" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">1</text><circle cx="150.4" cy="390" r="8" fill="#1765a3"/><text x="150.4" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">2</text><circle cx="193.60000000000002" cy="390" r="8" fill="#a64b13"/><text x="193.60000000000002" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">3</text><circle cx="366.40000000000003" cy="390" r="8" fill="#286953"/><text x="366.40000000000003" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">7</text><circle cx="409.6" cy="390" r="8" fill="#286953"/><text x="409.6" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">8</text><circle cx="452.8" cy="390" r="8" fill="#286953"/><text x="452.8" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#152c40">9</text><line x1="120.80000000000001" y1="350" x2="136.8" y2="366" stroke="#1765a3" stroke-width="4"/><line x1="120.80000000000001" y1="366" x2="136.8" y2="350" stroke="#1765a3" stroke-width="4"/><line x1="185.60000000000002" y1=