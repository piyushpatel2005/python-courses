<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" role="img" aria-labelledby="t d">
<title id="t">Two readings and one legend</title>
<desc id="d">Two differently colored lines share one axes; a matching two-item legend is placed to the right of the plot.</desc>
<rect width="640" height="285" rx="15" fill="#112131"/>
<rect x="44" y="32" width="390" height="214" fill="#f7f9f5" stroke="#8daab1" stroke-width="2"/>
<path d="M84 204 L84 72 M84 204 L400 204" fill="none" stroke="#455f73" stroke-width="3"/>
<path d="M98 181 L228 125 L371 76" fill="none" stroke="#137d80" stroke-width="4"/>
<path d="M98 191 L228 158 L371 134" fill="none" stroke="#d57539" stroke-width="4"/>
<g fill="#137d80"><circle cx="98" cy="181" r="5"/><circle cx="228" cy="125" r="5"/><circle cx="371" cy="76" r="5"/></g>
<g fill="#d57539"><circle cx="98" cy="191" r="5"/><circle cx="228" cy="158" r="5"/><circle cx="371" cy="134" r="5"/></g>
<text x="45" y="267" fill="#d4eee9" font-family="sans-serif" font-size="15">Both lines use the same hour axis.</text>
<rect x="458" y="68" width="150" height="102" rx="8" fill="#274155"/>
<text x="474" y="92" fill="#f6faf7" font-family="sans-serif" font-size="16">Legend</text>
<path d="M475 111 L505 111" stroke="#33b9b9" stroke-width="4"/>
<text x="518" y="116" fill="#f6faf7" font-family="sans-serif" font-size="15">Sun</text>
<path d="M475 145 L505 145" stroke="#f3a366" stroke-width="4"/>
<text x="518" y="150" fill="#f6faf7" font-family="sans-serif" font-size="15">Shade</text>
</svg>
