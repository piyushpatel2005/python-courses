<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">Keep Array Pairs Aligned</title>
<desc id="desc">One Boolean mask filters corresponding positions from both arrays.</desc>
<rect width="900" height="260" fill="#f8fafc"/>
<defs><marker id="tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#37658b"/></marker></defs>
<text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#15344f">Keep Array Pairs Aligned</text>
<rect x="30" y="83" width="240" height="133" rx="12" fill="#e7f1fa" stroke="#37658b" stroke-width="2"/>
<text x="150" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15344f">Original pairs</text>
<text x="150" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#15344f">(1,22) (2,28)</text>
<text x="150" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#15344f">(3,30) (4,25)</text>
<rect x="330" y="83" width="240" height="133" rx="12" fill="#e7f1fa" stroke="#37658b" stroke-width="2"/>
<text x="450" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15344f">Mask above 29°C</text>
<text x="450" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#15344f">False  False  True  False</text>
<rect x="630" y="83" width="240" height="133" rx="12" fill="#e7f1fa" stroke="#37658b" stroke-width="2"/>
<text x="750" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15344f">Matching result</text>
<text x="750" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#15344f">(3,30)</text>
<path d="M274 150 H324" fill="none" stroke="#37658b" stroke-width="3" marker-end="url(#tip)"/>
<path d="M574 150 H624" fill="none" stroke="#37658b" stroke-width="3" marker-end="url(#tip)"/>
</svg>
